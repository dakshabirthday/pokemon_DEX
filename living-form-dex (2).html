  );
}

/* ---------------------------------------------------------------------
   14. SLOT FORM: register a caught Pokémon or edit it later
   Species decides the slot (living dex order), so picking another
   species saves the record into that species' own slot.
   --------------------------------------------------------------------- */
function Combobox({ id, value, onChange, onPick, options, getKey, renderOption, placeholder, invalid, describedBy, adornment, onFocusChange }) {
  const [open, setOpen] = useState(false);
  const [active, setActive] = useState(0);
  const listRef = useRef(null);
  const closeTimer = useRef(null);
  const show = open && options.length > 0;
  const openList = () => { clearTimeout(closeTimer.current); setOpen(true); };
  useEffect(() => () => clearTimeout(closeTimer.current), []);

  useEffect(() => setActive(0), [value]);
  useEffect(() => {                       // keep the highlighted option visible inside the list
    const list = listRef.current;
    const el = list && list.children[active];
    if (!el) return;
    if (el.offsetTop < list.scrollTop) list.scrollTop = el.offsetTop;
    else if (el.offsetTop + el.offsetHeight > list.scrollTop + list.clientHeight) list.scrollTop = el.offsetTop + el.offsetHeight - list.clientHeight;
  }, [active, show]);

  function pick(option) { onPick(option); setOpen(false); }
  function onKeyDown(e) {
    if (e.key === 'ArrowDown') { e.preventDefault(); if (!open) openList(); else setActive((a) => Math.min(a + 1, options.length - 1)); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); setActive((a) => Math.max(a - 1, 0)); }
    else if (e.key === 'Enter' && show) { e.preventDefault(); pick(options[active]); }
    else if (e.key === 'Escape' && show) { e.preventDefault(); setOpen(false); }   // preventDefault keeps the dialog open
  }

  return (
    <div className="relative min-w-0">
      <input id={id} className={`field ${invalid ? 'is-invalid' : ''} ${adornment ? 'pr-[84px]' : ''}`} value={value} placeholder={placeholder}
        autoComplete="off" spellCheck={false} role="combobox" aria-expanded={show} aria-controls={`${id}-list`}
        aria-autocomplete="list" aria-activedescendant={show ? `${id}-opt-${active}` : undefined}
        aria-invalid={invalid || undefined} aria-describedby={describedBy}
        onChange={(e) => { onChange(e.target.value); openList(); }}
        onFocus={() => { openList(); if (onFocusChange) onFocusChange(true); }}
        onBlur={() => { closeTimer.current = setTimeout(() => setOpen(false), 120); if (onFocusChange) onFocusChange(false); }} onKeyDown={onKeyDown} />
      {adornment && <span className="pointer-events-none absolute right-2.5 top-1/2 -translate-y-1/2">{adornment}</span>}
      {show && (
        <ul id={`${id}-list`} ref={listRef} role="listbox" className="combo-list">
          {options.map((option, i) => (
            <li key={getKey(option)} id={`${id}-opt-${i}`} role="option" aria-selected={i === active} className="combo-option"
              onMouseDown={(e) => e.preventDefault()} onMouseMove={() => { if (active !== i) setActive(i); }} onClick={() => pick(option)}>
              {renderOption(option)}
            </li>
          ))}
        </ul>
      )}
    </div>
  );
}

const learnTag = (m) => (m.method === 'level-up' ? (m.level ? `Lv ${m.level}` : 'Evolve') : METHOD_LABEL[m.method] || prettify(m.method));

// slug -> how this Pokémon learns it ("Lv 36", "TM", "Egg", "Older games")
function learnTags(data) {
  const tags = new Map();
  if (!data) return tags;
  data.moves.forEach((m) => { if (!tags.has(m.key)) tags.set(m.key, learnTag(m)); });
  (data.allMoves || []).forEach((slug) => { if (!tags.has(slug)) tags.set(slug, 'Older games'); });
  return tags;
}

// Empty box: its learnset. Typing: any move, learnable ones first.
function moveSuggestions(text, tags, taken, catalog) {
  const q = searchKey(text);
  const out = [];
  for (const mv of catalog) {
    if (taken.has(mv.slug)) continue;
    const tag = tags.get(mv.slug);
    if (q ? !mv.sk.includes(q) : !tag) continue;
    const tagRank = !tag ? 2 : tag === 'Older games' ? 1 : 0;
    out.push({ mv, tag, rank: mv.sk === q ? -1 : (q && !mv.sk.startsWith(q) ? 3 : 0) + tagRank });
  }
  out.sort((a, b) => a.rank - b.rank || a.mv.name.localeCompare(b.mv.name));
  return out.slice(0, 60);
}

// target: { kind: 'dex', id } for a living dex slot, or { kind: 'free', boxId, slot, prefillId? } for a free box slot
function SlotSheet({ target, caught, freeBoxes, index, boxes, onSave, onRemove, onMove, onClose, onOpenDex }) {
  const isFree = target.kind === 'free';
  const fbox = isFree ? freeBoxes.find((b) => b.id === target.boxId) || { name: 'Free box', slots: {} } : null;
  const existing = (isFree ? fbox && fbox.slots[target.slot] : caught[target.id]) || null;
  const lookup = (id) => (id == null ? null : index.byId.get(id) || { id, dex: id, name: `Pokémon #${id}`, kind: 'species', sk: '' });
  const planned = isFree ? lookup(existing ? existing.pokemonId : target.prefillId) : lookup(target.id);
  const here = isFree
    ? { title: fbox.name, slot: target.slot + 1, row: Math.floor(target.slot / BOX_COLS) + 1, col: (target.slot % BOX_COLS) + 1 }
    : { title: `HOME ${locate(planned, boxes).box}`, ...locate(planned, boxes) };
  const initialGender = () => {
    if (existing && existing.gender) return existing.gender;
    if (!planned) return null;
    const opts = genderOptions(planned.dex);
    return opts.length === 1 ? opts[0] : null;
  };

  const [speciesText, setSpeciesText] = useState(planned ? planned.name : '');
  const [species, setSpecies] = useState(planned);
  const [nickname, setNickname] = useState((existing && existing.nickname) || '');
  const [gender, setGender] = useState(initialGender);
  const [moves, setMoves] = useState(() => Array.from({ length: MOVE_SLOTS }, (_, i) => {
    const slug = existing && existing.moves ? existing.moves[i] : null;
    return slug ? (MOVE_BY_SLUG.get(slug) || { name: moveName(slug) }).name : '';
  }));
  const [learn, setLearn] = useState({ status: 'loading', data: null });
  const [error, setError] = useState('');
  const [confirmRemove, setConfirmRemove] = useState(false);
  const [editing, setEditing] = useState(null);     // field being typed in; it isn't flagged until you leave it
  const dialogRef = useRef(null);
  const focusOf = (name) => (on) => setEditing((cur) => (on ? name : cur === name ? null : cur));

  // Lock page scroll, focus the dialog, hand focus back to the slot on close
  useEffect(() => {
    const returnTo = document.activeElement;
    const prev = document.body.style.overflow;
    document.body.style.overflow = 'hidden';
    const speciesInput = document.getElementById('slot-species');
    if (!planned && speciesInput) speciesInput.focus();       // empty free slot: start with the species
    else if (dialogRef.current) dialogRef.current.focus();
    return () => { document.body.style.overflow = prev; if (returnTo && returnTo.focus) returnTo.focus(); };
  }, []); // eslint-disable-line react-hooks/exhaustive-deps

  // Learnset for the move picker (live PokeAPI, else the offline pack)
  const speciesId = species ? species.id : null;
  useEffect(() => {
    if (speciesId == null) return;
    let alive = true;
    setLearn({ status: 'loading', data: null });
    fetchPokemon(speciesId)
      .then((data) => alive && setLearn({ status: 'ready', data }))
      .catch(() => alive && setLearn({ status: 'error', data: null }));
    return () => { alive = false; };
  }, [speciesId]);

  const tags = useMemo(() => learnTags(learn.data), [learn.data]);
  const catalog = useMemo(() => {
    const extra = ((learn.data && learn.data.allMoves) || []).filter((s) => !MOVE_BY_SLUG.has(s))
      .map((slug) => ({ slug, name: moveName(slug), sk: searchKey(moveName(slug)) }));   // moves newer than this file
    return extra.length ? [...ALL_MOVES, ...extra] : ALL_MOVES;
  }, [learn.data]);
  const moveBySk = useMemo(() => new Map(catalog.map((m) => [m.sk, m])), [catalog]);
  const resolved = moves.map((t) => (t.trim() ? moveBySk.get(searchKey(t)) || null : null));

  function chooseSpecies(entry) {
    setSpecies(entry);
    setError('');
    if (!entry) return;
    const opts = genderOptions(entry.dex);
    setGender((g) => (opts.length === 1 ? opts[0] : opts.includes(g) ? g : null));
  }
  const setMove = (i, text) => { setMoves((m) => m.map((t, j) => (j === i ? text : t))); setError(''); };

  const shown = species || planned;
  const genderOpts = species ? genderOptions(species.dex) : [];
  const noSlot = !isFree && species && species.kind === 'variety';     // alternate forms live in Free Boxes only
  const dest = !isFree && species && !noSlot && species.id !== planned.id ? species : null;
  const destLoc = dest ? locate(dest, boxes) : null;
  const destRec = dest ? caught[dest.id] : null;
  const replaces = dest && hasDetails(destRec);
  const saveLabel = isFree ? (existing ? 'Save changes' : 'Add to box')
    : replaces ? 'Replace and save' : dest ? `Save to HOME ${destLoc.box}` : existing ? 'Save changes' : 'Register';
  const speciesOptions = searchIndex(speciesText, index, 12)
    .filter((e) => isFree || e.kind !== 'variety')
    .filter((e) => !species || e.id !== species.id || searchKey(speciesText) !== e.sk)
    .slice(0, 8);
  const types = learn.data && species && learn.data.id === species.id ? learn.data.types : [];

  function submit(e) {
    e.preventDefault();
    if (!species) { setError(speciesText.trim() ? `“${speciesText.trim()}” doesn’t match a Pokémon. Pick a species from the list.` : 'Choose a species first.'); return; }
    if (noSlot) { setError(`${species.name} has no living dex slot. Add it in Free Boxes instead.`); return; }
    const g = genderOpts.length === 1 ? genderOpts[0] : gender;
    if (!g || !genderOpts.includes(g)) { setError(`Choose ${species.name}’s gender.`); return; }
    const slugs = [];
    for (let i = 0; i < moves.length; i++) {
      if (!moves[i].trim()) continue;
      const mv = resolved[i];
      if (!mv) { setError(`Move ${i + 1}: “${moves[i].trim()}” isn’t a move. Pick one from the list.`); return; }
      if (slugs.includes(mv.slug)) { setError(`${mv.name} is listed twice. A Pokémon knows each move only once.`); return; }
      slugs.push(mv.slug);
    }
    onSave({ target, species, record: { nickname: nickname.trim().slice(0, NICKNAME_MAX), gender: g, moves: slugs } });
  }

  const status = !existing ? { text: 'Empty slot', color: 'var(--muted)' }
    : isFree ? { text: 'Stored', color: 'var(--ok)' }
    : hasDetails(existing) ? { text: 'Registered', color: 'var(--ok)' } : { text: 'Caught · no details yet', color: 'var(--warn)' };

  return (
    <div className="overlay" onMouseDown={(e) => { if (e.target === e.currentTarget) onClose(); }}>
      <form ref={dialogRef} tabIndex={-1} onSubmit={submit} noValidate className="sheet panel relative max-w-[620px] p-5 outline-none sm:p-7"
        role="dialog" aria-modal="true" aria-labelledby="slot-title">
        <button type="button" onClick={onClose} className="btn btn-quiet absolute right-3 top-3 z-10 px-2" aria-label="Close without saving"><X size={18} /></button>

        <header className="flex items-center gap-4 pr-10">
          <div className="grid h-20 w-20 shrink-0 rounded-2xl border border-vault-line bg-vault-bg p-1.5 text-vault-line sm:h-24 sm:w-24">
            {shown ? <Sprite id={shown.id} female={gender === 'female'} alt="" /> : <PokeballGlyph />}
          </div>
          <div className="min-w-0">
            <p className="eyebrow truncate">{here.title} · slot {here.slot}<span className="hidden sm:inline"> · row {here.row}, col {here.col}</span></p>
            <h2 id="slot-title" className="font-display mt-0.5 truncate text-2xl font-bold uppercase tracking-wide sm:text-3xl">
              {nickname.trim() || (shown ? shown.name : 'New Pokémon')}
            </h2>
            <div className="mt-1 flex flex-wrap items-center gap-1.5">
              <span className="mono text-xs text-vault-muted">{shown ? `${shown.name} · ${pad4(shown.dex)}` : 'Any species or form'}</span>
              {types.map((t) => <TypeChip key={t} type={t} small />)}
              <span className="eyebrow ml-1" style={{ color: status.color }}>{status.text}</span>
            </div>
          </div>
        </header>

        <div className="mt-6 grid gap-5">
          <div className="grid gap-1.5">
            <label htmlFor="slot-species" className="text-sm font-semibold">Species</label>
            <Combobox id="slot-species" value={speciesText} placeholder={isFree ? 'Any Pokémon: name, form or Dex number' : 'Name or Dex number'}
              onFocusChange={focusOf('species')}
              invalid={(!species && !!speciesText.trim() && editing !== 'species') || !!noSlot}
              describedBy={dest || noSlot ? 'slot-dest' : undefined}
              onChange={(text) => { setSpeciesText(text); chooseSpecies(resolveQuery(text, index)); }}
              onPick={(entry) => { setSpeciesText(entry.name); chooseSpecies(entry); }}
              options={speciesOptions}
              getKey={(entry) => entry.id}
              renderOption={(entry) => (
                <>
                  <span className="h-8 w-8 shrink-0"><Sprite id={entry.id} /></span>
                  <span className="mono w-12 shrink-0 text-xs text-vault-faint">{pad4(entry.dex)}</span>
                  <span className="min-w-0 flex-1 truncate">{entry.name}</span>
                  {!isFree && caught[entry.id] && <span className="eyebrow" style={{ color: 'var(--ok)' }}>Caught</span>}
                  {entry.kind === 'variety' && <span className="eyebrow">Form</span>}
                </>
              )} />
            {noSlot && (
              <p id="slot-dest" className="flex items-start gap-1.5 text-xs text-vault-bad">
                <Info size={13} className="mt-px shrink-0" />
                <span>{species.name} is an alternate form with no living dex slot. Add it in Free Boxes instead.</span>
              </p>
            )}
            {dest && (
              <p id="slot-dest" className="flex items-start gap-1.5 text-xs" style={{ color: replaces ? 'var(--warn)' : 'var(--muted)' }}>
                <Info size={13} className="mt-px shrink-0" />
                <span>
                  {dest.name} belongs in HOME {destLoc.box} · slot {destLoc.slot}.{' '}
                  {existing ? `Saving moves this record there and empties slot ${here.slot}.` : 'It will be saved there.'}
                  {replaces && ` It replaces ${describeRecord(dest, destRec)}.`}
                </span>
              </p>
            )}
          </div>

          <div className="grid gap-1.5">
            <div className="flex items-baseline justify-between">
              <label htmlFor="slot-nick" className="text-sm font-semibold">Nickname</label>
              <span className="mono text-xs text-vault-faint">{nickname.length}/{NICKNAME_MAX}</span>
            </div>
            <input id="slot-nick" className="field" maxLength={NICKNAME_MAX} value={nickname} placeholder="Leave blank if it has none"
              autoComplete="off" spellCheck={false} onChange={(e) => setNickname(e.target.value)} />
          </div>

          <fieldset className="grid gap-1.5">
            <legend className="mb-1.5 text-sm font-semibold">Gender</legend>
            {species ? (
              <div className="flex flex-wrap items-center gap-2" role="radiogroup" aria-label="Gender">
                {genderOpts.map((g) => {
                  const on = gender === g || genderOpts.length === 1;
                  return (
                    <button key={g} type="button" role="radio" aria-checked={on} onClick={() => { setGender(g); setError(''); }}
                      className="flex items-center gap-2 rounded-xl border px-3.5 py-2 text-sm font-semibold transition"
                      style={on ? { borderColor: GENDERS[g].color, background: 'var(--panel-2)', color: 'var(--fg)' } : { borderColor: 'var(--line)', color: 'var(--muted)' }}>
                      <span className="text-base leading-none" style={{ color: GENDERS[g].color }}>{GENDERS[g].symbol}</span>{GENDERS[g].label}
                    </button>
                  );
                })}
                {genderOpts.length === 1 && (
                  <span className="text-xs text-vault-muted">
                    {genderOpts[0] === 'genderless' ? `${species.name} has no gender.` : `${species.name} is always ${genderOpts[0]}.`}
                  </span>
                )}
              </div>
            ) : <p className="text-xs text-vault-muted">Pick a species first.</p>}
          </fieldset>

          <fieldset className="grid gap-2">
            <legend className="mb-0.5 flex w-full items-baseline justify-between text-sm font-semibold">
              <span>Moves</span>
              <span className="text-xs font-normal text-vault-faint">
                {!species ? 'Pick a species to see its learnset' : learn.status === 'loading' ? 'Loading learnset…' : learn.status === 'error' ? 'Learnset unavailable, any move allowed' : 'Up to 4 · change them any time'}
              </span>
            </legend>
            <ol className="grid gap-2">
              {moves.map((text, i) => {
                const mv = resolved[i];
                const unknown = !!text.trim() && !mv && editing !== i;
                const offList = !!mv && learn.status === 'ready' && !tags.has(mv.slug);
                const taken = new Set(resolved.filter((m, j) => m && j !== i).map((m) => m.slug));
                const noteId = `move-note-${i}`;
                return (
                  <li key={i} className="grid grid-cols-[18px_minmax(0,1fr)_32px] items-center gap-2">
                    <span className="mono text-xs text-vault-faint" aria-hidden="true">{i + 1}</span>
                    <Combobox id={`slot-move-${i}`} value={text} placeholder={i === 0 ? 'Start typing a move' : 'Empty'} onFocusChange={focusOf(i)}
                      invalid={unknown} describedBy={unknown || offList ? noteId : undefined}
                      adornment={mv && mv.type ? <TypeChip type={mv.type} small /> : null}
                      onChange={(v) => setMove(i, v)} onPick={(o) => setMove(i, o.mv.name)}
                      options={moveSuggestions(text, tags, taken, catalog)} getKey={(o) => o.mv.slug}
                      renderOption={(o) => (
                        <>
                          <span className="min-w-0 flex-1 truncate">{o.mv.name}</span>
                          <span className="mono shrink-0 text-[11px]" style={{ color: o.tag ? (o.tag === 'Older games' ? 'var(--faint)' : 'var(--muted)') : 'var(--warn)' }}>{o.tag || 'Not learnable'}</span>
                          <span className="w-[62px] shrink-0 text-right">{o.mv.type && <TypeChip type={o.mv.type} small />}</span>
                        </>
                      )} />
                    <div className="flex justify-end">
                      {text && <button type="button" className="btn btn-quiet px-1.5 py-1.5" aria-label={`Clear move ${i + 1}`} onClick={() => setMove(i, '')}><X size={14} /></button>}
                    </div>
                    {(unknown || offList) && (
                      <p id={noteId} className="col-span-2 col-start-2 text-xs" style={{ color: unknown ? 'var(--bad)' : 'var(--warn)' }}>
                        {unknown ? 'No move by that name. Pick one from the list.' : `Not in ${shown.name}’s learnset. Keep it if it came from an event.`}
                      </p>
                    )}
                  </li>
                );
              })}
            </ol>
          </fieldset>

          {error && <p role="alert" className="flex items-start gap-2 text-sm text-vault-bad"><AlertTriangle size={16} className="mt-0.5 shrink-0" />{error}</p>}

          <div className="flex flex-wrap items-center gap-2 border-t border-vault-line pt-4">
            <button type="submit" className="btn btn-ember"><Check size={14} /> {saveLabel}</button>
            <button type="button" className="btn" onClick={onClose}>Cancel</button>
            {isFree && existing && <button type="button" className="btn" onClick={() => onMove(target)}><Move size={14} /> Move</button>}
            {shown && <button type="button" className="btn btn-quiet ml-auto" onClick={() => onOpenDex(shown)}><BookOpen size={14} /> Pokédex data</button>}
          </div>

          {existing && (
            !confirmRemove ? (
              <button type="button" className="btn btn-quiet justify-self-start text-vault-bad" onClick={() => setConfirmRemove(true)}>
                <Trash2 size={14} /> Remove from box
              </button>
            ) : (
              <div className="flex flex-wrap items-center gap-2 rounded-xl border border-vault-bad px-3 py-2 text-sm" role="alertdialog" aria-label="Confirm removal">
                <span className="min-w-0 flex-1">Remove {describeRecord(planned, existing)} from {here.title} · slot {here.slot}? Its details are deleted.</span>
                <button type="button" className="btn btn-ember" onClick={() => onRemove(target)}>Remove</button>
                <button type="button" className="btn" onClick={() => setConfirmRemove(false)}>Keep</button>
              </div>
            )
          )}
        </div>
      </form>
    </div>
  );
}

/* ---------------------------------------------------------------------
   15. FREE BOXES: any Pokémon in any slot, like HOME's own boxes.
   No Dex order, duplicates allowed, nothing here counts toward completion.
   --------------------------------------------------------------------- */
function FreeSlot({ i, record, entry, held, holding, highlighted, onActivate }) {
  const row = Math.floor(i / BOX_COLS) + 1;
  const col = (i % BOX_COLS) + 1;
  if (!record) {
    return (
      <button type="button" className={`slot-free-empty ${holding ? 'is-target' : ''}`} onClick={() => onActivate(i)}
        aria-label={`Slot ${i + 1} (row ${row}, column ${col}), empty. ${holding ? 'Click to place it here.' : 'Click to add a Pokémon.'}`}>
        <Plus size={16} aria-hidden="true" />
      </button>
    );
  }
  const shownEntry = entry || { name: `Pokémon #${record.pokemonId}` };
  const desc = describeRecord(shownEntry, record);
  const gender = record.gender && record.gender !== 'genderless' ? GENDERS[record.gender] : null;
  const action = held ? 'Being moved. Click to put it back.' : holding ? 'Click to swap places.' : 'Click to edit or move.';
  return (
    <button type="button" className={`slot is-stored ${held ? 'is-held' : ''} ${highlighted ? 'is-hl' : ''}`} onClick={() => onActivate(i)}
      aria-label={`${desc}, slot ${i + 1} (row ${row}, column ${col}). ${action}`} title={`${desc}\nSlot ${i + 1} · row ${row}, col ${col}`}>
      <Sprite id={record.pokemonId} female={record.gender === 'female'} />
      {gender && <span className="slot-gender" style={{ color: gender.color }} aria-hidden="true">{gender.symbol}</span>}
    </button>
  );
}

function FreeBoxes({ freeBoxes, currentId, setCurrentId, index, holding, onSlot, onCancelHold, onAddBox, onRenameBox, onDeleteBox, highlight, setHighlight }) {
  const pos = Math.max(0, freeBoxes.findIndex((b) => b.id === currentId));
  const box = freeBoxes[pos];
  const [renaming, setRenaming] = useState(false);
  const [draftName, setDraftName] = useState(box.name);
  const [confirmDelete, setConfirmDelete] = useState(false);
  const [find, setFind] = useState('');
  const [found, setFound] = useState({ q: '', i: -1, total: 0 });

  useEffect(() => { setRenaming(false); setConfirmDelete(false); }, [box.id]);
  useEffect(() => {
    if (highlight == null) return;
    const t = setTimeout(() => setHighlight(null), 2600);
    return () => clearTimeout(t);
  }, [highlight, setHighlight]);

  const total = freeBoxes.reduce((n, b) => n + freeCount(b), 0);
  const filled = freeCount(box);
  const heldRecord = holding ? ((freeBoxes.find((b) => b.id === holding.boxId) || { slots: {} }).slots[holding.slot] || null) : null;
  const heldEntry = heldRecord ? index.byId.get(heldRecord.pokemonId) : null;
  const go = (d) => setCurrentId(freeBoxes[(pos + d + freeBoxes.length) % freeBoxes.length].id);

  function saveName(e) {
    e.preventDefault();
    const name = draftName.trim().slice(0, FREE_BOX_NAME_MAX);
    if (name) onRenameBox(box.id, name);
    setRenaming(false);
  }

  // Search nicknames and species across every free box; pressing Find again jumps to the next match
  function doFind(e) {
    e.preventDefault();
    const q = searchKey(find);
    if (!q) return;
    const matches = [];
    freeBoxes.forEach((b) => {
      for (let s = 0; s < BOX_SIZE; s++) {
        const r = b.slots[s];
        if (!r) continue;
        const en = index.byId.get(r.pokemonId);
        if (searchKey(r.nickname || '').includes(q) || (en && en.sk.includes(q))) matches.push({ boxId: b.id, slot: s });
      }
    });
    if (!matches.length) { setFound({ q, i: -1, total: 0 }); return; }
    const i = found.q === q && found.total === matches.length ? (found.i + 1) % matches.length : 0;
    setFound({ q, i, total: matches.length });
    setCurrentId(matches[i].boxId);
    setHighlight(`${matches[i].boxId}:${matches[i].slot}`);
  }

  return (
    <div className="grid min-w-0 gap-5">
      <section className="panel min-w-0 p-5 sm:p-6" aria-labelledby="free-title">
        <div className="flex flex-wrap items-end justify-between gap-4">
          <div className="min-w-0">
            <p className="eyebrow">Any Pokémon · any slot</p>
            <h1 id="free-title" className="font-display mt-1 text-3xl font-bold uppercase tracking-wide">Free Boxes</h1>
            <p className="mt-1.5 max-w-xl text-sm text-vault-muted">
              These boxes don’t follow the Pokédex. Store duplicates, alternate forms, battle teams or trade stock. Nothing here counts toward Dex completion.
            </p>
          </div>
          <dl className="flex gap-6">
            <div><dt className="eyebrow">Stored</dt><dd className="mono text-xl font-semibold">{total}</dd></div>
            <div><dt className="eyebrow">Boxes</dt><dd className="mono text-xl font-semibold">{freeBoxes.length}</dd></div>
          </dl>
        </div>
      </section>

      <div className="grid min-w-0 items-start gap-5 lg:grid-cols-[minmax(0,1.45fr)_minmax(0,1fr)]">
        <section className="panel min-w-0 p-4 sm:p-5" aria-labelledby="free-box-title">
          <div className="flex flex-wrap items-center justify-between gap-3">
            <div className="min-w-0 flex-1">
              <p className="eyebrow">Free box {pos + 1} of {freeBoxes.length}</p>
              {!renaming ? (
                <div className="flex min-w-0 items-center gap-1">
                  <h2 id="free-box-title" className="font-display truncate text-2xl font-bold uppercase tracking-wide">{box.name}</h2>
                  <button type="button" className="btn btn-quiet shrink-0 px-2" onClick={() => { setDraftName(box.name); setRenaming(true); }} aria-label={`Rename ${box.name}`}>
                    <Pencil size={14} />
                  </button>
                </div>
              ) : (
                <form onSubmit={saveName} className="mt-1 flex flex-wrap items-center gap-2" aria-label="Rename box">
                  <label htmlFor="free-box-name" className="sr-only">Box name</label>
                  <input id="free-box-name" className="field w-48" maxLength={FREE_BOX_NAME_MAX} value={draftName} autoFocus
                    onChange={(e) => setDraftName(e.target.value)} onKeyDown={(e) => { if (e.key === 'Escape') { e.preventDefault(); setRenaming(false); } }} />
                  <button type="submit" className="btn btn-ember"><Check size={14} /> Save</button>
                  <button type="button" className="btn" onClick={() => setRenaming(false)}>Cancel</button>
                </form>
              )}
            </div>
          </div>

          <div className="mt-4 flex items-center gap-2">
            <button type="button" className="btn shrink-0 px-2" onClick={() => go(-1)} aria-label="Previous free box" disabled={freeBoxes.length < 2}><ChevronLeft size={18} /></button>
            <p className="mono min-w-0 flex-1 text-center text-xs text-vault-muted">{filled}/{BOX_SIZE} stored</p>
            <button type="button" className="btn shrink-0 px-2" onClick={() => go(1)} aria-label="Next free box" disabled={freeBoxes.length < 2}><ChevronRight size={18} /></button>
          </div>

          {heldRecord && (
            <div className="mt-3 flex flex-wrap items-center gap-3 rounded-xl border px-3 py-2 text-sm" role="status"
              style={{ borderColor: 'var(--ember)', background: 'var(--ember-soft)' }}>
              <span className="h-9 w-9 shrink-0"><Sprite id={heldRecord.pokemonId} female={heldRecord.gender === 'female'} /></span>
              <span className="min-w-0 flex-1">
                Moving <strong>{heldRecord.nickname || (heldEntry ? heldEntry.name : 'Pokémon')}</strong>. Click a slot in any free box to place it. A filled slot swaps.
              </span>
              <button type="button" className="btn" onClick={onCancelHold}>Cancel</button>
            </div>
          )}

          <div className="box-frame mt-3">
            <div className="box-grid">
              {Array.from({ length: BOX_SIZE }, (_, i) => {
                const rec = box.slots[i] || null;
                return (
                  <FreeSlot key={i} i={i} record={rec} entry={rec ? index.byId.get(rec.pokemonId) : null}
                    held={!!holding && holding.boxId === box.id && holding.slot === i} holding={!!holding}
                    highlighted={highlight === `${box.id}:${i}`} onActivate={(slot) => onSlot(box.id, slot)} />
                );
              })}
            </div>
            <p className="relative mt-2.5 flex items-start gap-1.5 text-xs text-vault-muted">
              <Info size={13} className="mt-px shrink-0" />
              {holding ? 'Use the arrows or the box list to carry it to another box.' : 'Click an empty slot to add any Pokémon. Click a stored one to edit it or move it.'}
            </p>
          </div>

          <div className="mt-3 flex flex-col gap-3 sm:flex-row sm:flex-wrap sm:items-start sm:justify-between">
            <form onSubmit={doFind} className="flex min-w-0 flex-wrap items-center gap-2 sm:flex-1" aria-label="Find in free boxes">
              <label htmlFor="free-find" className="sr-only">Find by nickname or species</label>
              <div className="relative min-w-0 flex-1 sm:max-w-[240px]">
                <Search size={14} className="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-vault-faint" />
                <input id="free-find" className="field pl-8" placeholder="Find: nickname or species" value={find}
                  onChange={(e) => { setFind(e.target.value); setFound({ q: '', i: -1, total: 0 }); }} />
              </div>
              <button type="submit" className="btn">{found.total > 1 ? 'Next' : 'Find'}</button>
              {found.q && (
                <span role="status" className="w-full text-xs" style={{ color: found.total ? 'var(--muted)' : 'var(--bad)' }}>
                  {found.total ? `Match ${found.i + 1} of ${found.total}` : `Nothing in your free boxes matches “${find.trim()}”.`}
                </span>
              )}
            </form>
            {!confirmDelete ? (
              <div className="flex gap-2">
                <button type="button" className="btn" onClick={onAddBox} disabled={freeBoxes.length >= MAX_FREE_BOXES}><Plus size={14} /> Add box</button>
                {freeBoxes.length > 1 && <button type="button" className="btn" onClick={() => setConfirmDelete(true)}><Trash2 size={14} /> Delete box</button>}
              </div>
            ) : (
              <div className="flex flex-wrap items-center gap-2 rounded-xl border border-vault-bad px-3 py-2 text-sm" role="alertdialog" aria-label="Confirm delete box">
                <span>{filled ? `Delete ${box.name} and the ${filled} Pokémon in it?` : `Delete ${box.name}?`}</span>
                <button type="button" className="btn btn-ember" onClick={() => { onDeleteBox(box.id); setConfirmDelete(false); }}>Delete</button>
                <button type="button" className="btn" onClick={() => setConfirmDelete(false)}>Cancel</button>
              </div>
            )}
          </div>
        </section>

        <section className="panel min-w-0 p-5" aria-labelledby="free-list-title">
          <div className="flex flex-wrap items-baseline justify-between gap-x-3">
            <h2 id="free-list-title" className="font-display text-lg font-bold uppercase tracking-wide">All Free Boxes</h2>
            <span className="eyebrow">{freeBoxes.length} of {MAX_FREE_BOXES}</span>
          </div>
          <ul className="strip mt-3 grid max-h-[460px] gap-1.5 overflow-y-auto pr-1">
            {freeBoxes.map((b, i) => {
              const c = freeCount(b);
              return (
                <li key={b.id}>
                  <button type="button" className="free-row" aria-current={b.id === box.id ? 'true' : undefined} onClick={() => setCurrentId(b.id)}>

                    <span className="min-w-0 flex-1 truncate font-semibold">{b.name}</span>
                    <span className="mono shrink-0 text-xs text-vault-muted">{c}/{BOX_SIZE}</span>
                    <span className="bar-track w-14 shrink-0"><span className="bar-fill block" style={{ width: `${(c / BOX_SIZE) * 100}%`, background: c === BOX_SIZE ? 'var(--ok)' : 'var(--ember)' }} /></span>
                  </button>
                </li>
              );
            })}
          </ul>
          <button type="button" className="btn mt-3" onClick={onAddBox} disabled={freeBoxes.length >= MAX_FREE_BOXES}><Plus size={14} /> Add box</button>
        </section>
      </div>
    </div>
  );
}

/* ---------------------------------------------------------------------
   16. ACCOUNTS & CLOUD SAVE
   Two sign-in routes, one save format:
   - Inside Claude (the published page): your Claude account. The save sits in
     this page's private per-person storage (user + db capabilities).
   - Your VS Code copy: Google (Apple when switched on) through your own
     Firebase project, saved in Firestore.
   The save is split so no document grows too big: meta (guardian, version
   stamp, box order), caught (the living dex), and one document per free box.
   The current box, tab and click mode stay per device and never sync.
   --------------------------------------------------------------------- */
const FIREBASE_SDK = 'https://www.gstatic.com/firebasejs/10.14.1/';

function stableStringify(v) {
  if (v === null || typeof v !== 'object') return JSON.stringify(v === undefined ? null : v);
  if (Array.isArray(v)) return `[${v.map(stableStringify).join(',')}]`;
  return `{${Object.keys(v).filter((k) => v[k] !== undefined).sort().map((k) => `${JSON.stringify(k)}:${stableStringify(v[k])}`).join(',')}}`;
}
const cloneJSON = (v) => JSON.parse(JSON.stringify(v));
function withTimeout(promise, ms, message) {
  let timer;
  const limit = new Promise((_, reject) => { timer = setTimeout(() => reject(new Error(message)), ms); });
  return Promise.race([promise, limit]).finally(() => clearTimeout(timer));
}

const claudePaths = (id) => ({
  meta: `data/users/${id}/meta`, caught: `data/users/${id}/caught`,
  boxes: `data/users/${id}/meta/boxes`, box: (boxId) => `data/users/${id}/meta/boxes/${boxId}`,
});
const firebasePaths = (uid) => ({
  meta: `users/${uid}`, caught: `users/${uid}/parts/caught`,
  boxes: `users/${uid}/boxes`, box: (boxId) => `users/${uid}/boxes/${boxId}`,
});

function toParts(s) {
  return {
    meta: { schemaVersion: SCHEMA_VERSION, guardian: s.guardian, updatedAt: s.updatedAt, boxOrder: s.freeBoxes.map((b) => b.id) },
    caught: { caught: s.caught },
    boxes: Object.fromEntries(s.freeBoxes.map((b) => [b.id, { name: b.name, slots: b.slots }])),
  };
}
const partsSnapshot = (parts) => ({
  caught: stableStringify(parts.caught),
  boxes: Object.fromEntries(Object.entries(parts.boxes).map(([id, b]) => [id, stableStringify(b)])),
});
const contentKey = (s) => stableStringify({
  guardian: s.guardian, caught: s.caught, freeBoxes: (s.freeBoxes || []).map((b) => ({ id: b.id, name: b.name, slots: b.slots })),
});

// A fresh device: nothing but Thalaivar and an empty Box 1
function isPristine(s) {
  const keys = Object.keys(s.caught || {});
  const own = (s.caught || {})[6];
  const g = s.guardian || {};
  return keys.length === 1 && keys[0] === '6' && !!own && own.nickname === DEFAULT_GUARDIAN.nickname && !own.gender
    && !(own.moves && own.moves.length) && g.nickname === DEFAULT_GUARDIAN.nickname && g.pokemonId === DEFAULT_GUARDIAN.pokemonId
    && clampLevel(g.level) === DEFAULT_GUARDIAN.level && (s.freeBoxes || []).length <= 1
    && (s.freeBoxes || []).every((b) => !Object.keys(b.slots || {}).length);
}

// Both stores (Claude db and Firestore compat) share doc().get/set/delete and collection().get
async function readCloud(store, paths) {
  const meta = await store.doc(paths.meta).get();
  if (!meta.exists) return null;
  const m = cloneJSON(meta.data());
  const [caughtSnap, boxesSnap] = await Promise.all([store.doc(paths.caught).get(), store.collection(paths.boxes).get()]);
  const caught = caughtSnap.exists ? cloneJSON(caughtSnap.data()).caught || {} : {};
  const byId = {};
  boxesSnap.docs.forEach((d) => { byId[d.id] = { id: d.id, ...cloneJSON(d.data()) }; });
  const order = Array.isArray(m.boxOrder) ? m.boxOrder : [];
  const freeBoxes = [...order.filter((id) => byId[id]).map((id) => byId[id]), ...Object.values(byId).filter((b) => !order.includes(b.id))];
  return { schemaVersion: m.schemaVersion, guardian: m.guardian, caught, freeBoxes, updatedAt: m.updatedAt };
}

// Write only what changed since `prev` (what the cloud holds). Meta goes last: its stamp marks a complete save.
async function writeCloud(store, paths, parts, prev) {
  if (!prev || stableStringify(parts.caught) !== prev.caught) await store.doc(paths.caught).set(cloneJSON(parts.caught));
  for (const [id, box] of Object.entries(parts.boxes)) {
    if (!prev || stableStringify(box) !== prev.boxes[id]) await store.doc(paths.box(id)).set(cloneJSON(box));
  }
  if (prev) {
    for (const id of Object.keys(prev.boxes)) if (!(id in parts.boxes)) await store.doc(paths.box(id)).delete();
  }
  await store.doc(paths.meta).set(cloneJSON(parts.meta));
  return partsSnapshot(parts);
}

function getSyncMark(key) {
  try { return (JSON.parse(safeStorage.get(SYNC_KEY) || '{}') || {})[key] || null; } catch { return null; }
}
function setSyncMark(key, value) {
  let all = {};
  try { all = JSON.parse(safeStorage.get(SYNC_KEY) || '{}') || {}; } catch { all = {}; }
  all[key] = value;
  safeStorage.set(SYNC_KEY, JSON.stringify(all));
}

function saveSummary(s) {
  const caught = s.caught || {};
  const boxes = s.freeBoxes || [];
  return {
    caught: Object.keys(caught).length,
    registered: Object.values(caught).filter(hasDetails).length,
    stored: boxes.reduce((n, b) => n + Object.keys(b.slots || {}).length, 0),
    boxes: boxes.length,
    guardian: (s.guardian && s.guardian.nickname) || '',
    updatedAt: s.updatedAt,
  };
}
function timeAgo(ts) {
  if (!ts) return 'never';
  const sec = Math.max(0, Math.round((Date.now() - ts) / 1000));
  if (sec < 45) return 'just now';
  if (sec < 3600) return `${Math.round(sec / 60)} min ago`;
  if (sec < 86400) return `${Math.round(sec / 3600)} h ago`;
  if (sec < 7 * 86400) return `${Math.round(sec / 86400)} days ago`;
  return new Date(ts).toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' });
}

/* ---- Firebase (VS Code copy only) ---- */
let firebasePromise = null;
function loadScript(src) {
  return new Promise((resolve, reject) => {
    const el = document.createElement('script');
    el.src = src;
    el.onload = resolve;
    el.onerror = () => reject(new Error('Could not load Google sign-in. Check your connection.'));
    document.head.appendChild(el);
  });
}
function loadFirebase() {
  if (!firebasePromise) {
    firebasePromise = (async () => {
      for (const file of ['firebase-app-compat.js', 'firebase-auth-compat.js', 'firebase-firestore-compat.js']) await loadScript(FIREBASE_SDK + file);
      const fb = window.firebase;
      const { apiKey, authDomain, projectId, appId, storageBucket, messagingSenderId } = FIREBASE_CONFIG;
      if (!fb.apps.length) fb.initializeApp(cloneJSON({ apiKey, authDomain, projectId, appId, storageBucket, messagingSenderId }));
      return { auth: fb.auth(), fs: fb.firestore() };
    })();
    firebasePromise.catch(() => { firebasePromise = null; });
  }
  return firebasePromise;
}

const FIREBASE_ERRORS = {
  'auth/popup-closed-by-user': '',
  'auth/cancelled-popup-request': '',
  'auth/user-cancelled': '',
  'auth/unauthorized-domain': 'This address isn’t an authorized domain in your Firebase project. Add it under Authentication → Settings → Authorized domains.',
  'auth/operation-not-allowed': 'That sign-in method is switched off in Firebase. Turn it on under Authentication → Sign-in method.',
  'auth/network-request-failed': 'Couldn’t reach the sign-in service. Check your connection and try again.',
  'auth/operation-not-supported-in-this-environment': 'Sign-in needs the page served over http. Open it through VS Code Live Server instead of double-clicking the file.',
  'auth/invalid-api-key': 'The apiKey in the setup block isn’t valid. Copy it again from Firebase → Project settings.',
  'auth/configuration-not-found': 'Firebase Authentication isn’t set up yet. Open Authentication in the Firebase console and press Get started.',
};

async function firebaseSignIn(which) {
  const { auth } = await loadFirebase();
  const fb = window.firebase;
  let provider;
  if (which === 'apple') {
    provider = new fb.auth.OAuthProvider('apple.com');
    provider.addScope('email');
    provider.addScope('name');
  } else {
    provider = new fb.auth.GoogleAuthProvider();
    provider.setCustomParameters({ prompt: 'select_account' });
  }
  try {
    await auth.signInWithPopup(provider);
  } catch (e) {
    if (e && e.code === 'auth/popup-blocked') { await auth.signInWithRedirect(provider); return; }
    throw e;
  }
}

/* ---- Who is signed in ---- */
function useAccount(mode) {
  const [session, setSession] = useState({ status: mode ? 'connecting' : 'none', provider: mode });
  useEffect(() => {
    let alive = true;
    let unsubscribe = null;
    const set = (value) => { if (alive) setSession(value); };
    if (mode === 'claude') {
      set({ status: 'connecting', provider: 'claude' });
      (async () => {
        const [user, db] = await Promise.all([window.claude.use('user'), window.claude.use('db')]);
        if (!user || !db) return set({ status: 'unavailable', provider: 'claude', reason: 'Cloud save isn’t available in this view. Open the page from Claude while signed in.' });
        const me = await user.me();
        if (!me.id) return set({ status: 'unavailable', provider: 'claude', reason: 'Sign in to Claude to sync your progress.' });
        set({
          status: 'ready', provider: 'claude', key: `claude:${me.id}`, store: db, paths: claudePaths(me.id),
          account: { name: me.name || 'Your Claude account', avatarUrl: me.avatarUrl, color: me.color, label: 'Claude account' },
        });
      })().catch((e) => set({ status: 'error', provider: 'claude', reason: (e && e.message) || 'Couldn’t connect to your Claude account.' }));
    } else if (mode === 'firebase') {
      set({ status: 'connecting', provider: 'firebase' });
      loadFirebase().then(({ auth, fs }) => {
        unsubscribe = auth.onAuthStateChanged((u) => {
          if (!u) { set({ status: 'signed-out', provider: 'firebase' }); return; }
          const pid = ((u.providerData || [])[0] || {}).providerId;
          set({
            status: 'ready', provider: 'firebase', key: `firebase:${u.uid}`, store: fs, paths: firebasePaths(u.uid),
            account: { name: u.displayName || u.email || 'Signed in', avatarUrl: u.photoURL || null, email: u.email || null, label: pid === 'apple.com' ? 'Apple' : 'Google' },
            signOut: () => auth.signOut(),
          });
        });
      }).catch((e) => set({ status: 'error', provider: 'firebase', reason: (e && e.message) || 'Couldn’t load Google sign-in.' }));
    } else {
      set({ status: 'none', provider: mode });
    }
    return () => { alive = false; if (unsubscribe) unsubscribe(); };
  }, [mode]);
  return session;
}

/* ---- Keep this device and the cloud save in step ----
   syncedAt (per account, per device) = the cloud version this device last matched.
   cloud stamp == syncedAt -> nobody else changed it: push local changes.
   cloud changed, local not -> take the cloud save.
   both changed            -> ask which to keep (never merge silently). */
function useCloudSync(state, replaceState, session) {
  const [sync, setSync] = useState({ status: 'idle', at: null, error: '', conflict: null, dismissed: false });
  const stateRef = useRef(state);
  stateRef.current = state;
  const sessionRef = useRef(session);
  sessionRef.current = session;
  const cloudRef = useRef(null);
  const running = useRef(false);
  const again = useRef(false);
  const ready = session.status === 'ready';

  const adopt = useCallback((cloud) => {
    const next = migrateState({ ...cloud, ui: stateRef.current.ui });
    next.updatedAt = cloud.updatedAt;
    stateRef.current = next;
    replaceState(next);
  }, [replaceState]);

  const push = useCallback(async (s, local) => {
    setSync((x) => ({ ...x, status: 'saving', error: '' }));
    cloudRef.current = await writeCloud(s.store, s.paths, toParts(local), cloudRef.current);
    setSyncMark(s.key, { syncedAt: local.updatedAt });
  }, []);

  const run = useCallback(async () => {
    const s = sessionRef.current;
    if (s.status !== 'ready') return;
    if (running.current) { again.current = true; return; }
    running.current = true;
    const slow = 'Your cloud save didn’t answer. Check your connection; sync will retry.';
    try {
      do {
        again.current = false;
        const local = stateRef.current;
        const mark = getSyncMark(s.key);
        if (mark && cloudRef.current) {          // quick check: has anyone else saved since?
          const metaSnap = await withTimeout(s.store.doc(s.paths.meta).get(), 15000, slow);
          const stamp = metaSnap.exists ? (metaSnap.data() || {}).updatedAt : null;
          if (stamp === mark.syncedAt) {
            if (local.updatedAt !== mark.syncedAt) await withTimeout(push(s, local), 60000, slow);
            setSync({ status: 'synced', at: Date.now(), error: '', conflict: null, dismissed: false });
            continue;
          }
        }
        setSync((x) => ({ ...x, status: x.status === 'idle' ? 'connecting' : 'checking', error: '' }));
        const cloud = await withTimeout(readCloud(s.store, s.paths), 20000, slow);
        if (!cloud) {                              // first device on this account
          cloudRef.current = null;
          await withTimeout(push(s, local), 60000, slow);
          setSync({ status: 'synced', at: Date.now(), error: '', conflict: null, dismissed: false });
          continue;
        }
        cloudRef.current = partsSnapshot(toParts(cloud));
        const same = contentKey(local) === contentKey(cloud);
        const cloudChanged = !mark || cloud.updatedAt !== mark.syncedAt;
        const localChanged = mark ? local.updatedAt !== mark.syncedAt : !isPristine(local);
        if (same || (cloudChanged && !localChanged)) {
          adopt(cloud);
          setSyncMark(s.key, { syncedAt: cloud.updatedAt });
        } else if (!cloudChanged) {
          if (localChanged) await withTimeout(push(s, local), 60000, slow);
        } else {
          setSync({ status: 'conflict', at: null, error: '', conflict: { cloud }, dismissed: false });
          again.current = false;
          return;
        }
        setSync({ status: 'synced', at: Date.now(), error: '', conflict: null, dismissed: false });
      } while (again.current);
    } catch (e) {
      const msg = (e && (e.message || e.code)) || 'Sync failed.';
      setSync((x) => ({ ...x, status: 'error', error: e && e.code === 'quota_exceeded' ? 'Your cloud save is full. Remove some free boxes, then sync again.' : msg }));
    } finally {
      running.current = false;
    }
  }, [adopt, push]);

  // Connect: check the cloud as soon as an account is ready
  useEffect(() => {
    cloudRef.current = null;
    if (ready) run();
    else setSync({ status: 'idle', at: null, error: '', conflict: null, dismissed: false });
  }, [ready, session.key, run]);

  // Save changes 1.5 s after you stop editing
  const paused = sync.status === 'conflict';
  useEffect(() => {
    if (!ready || paused) return undefined;
    const mark = getSyncMark(session.key);
    if (mark && mark.syncedAt === state.updatedAt) return undefined;
    setSync((x) => (x.status === 'synced' ? { ...x, status: 'pending' } : x));
    const t = setTimeout(run, 1500);
    return () => clearTimeout(t);
  }, [state.updatedAt, ready, paused, session.key, run]);

  // Coming back to the tab or window: look for changes made on another device
  useEffect(() => {
    if (!ready) return undefined;
    let last = Date.now();
    const check = () => {
      if (document.visibilityState !== 'visible' || Date.now() - last < 15000) return;
      last = Date.now();
      run();
    };
    document.addEventListener('visibilitychange', check);
    window.addEventListener('focus', check);
    return () => { document.removeEventListener('visibilitychange', check); window.removeEventListener('focus', check); };
  }, [ready, run]);

  const resolve = useCallback(async (choice) => {
    const s = sessionRef.current;
    const c = sync.conflict;
    if (choice === 'later') { setSync((x) => ({ ...x, dismissed: true })); return; }
    if (!c || s.status !== 'ready') return;
    if (choice === 'cloud') {
      adopt(c.cloud);
      setSyncMark(s.key, { syncedAt: c.cloud.updatedAt });
      setSync({ status: 'synced', at: Date.now(), error: '', conflict: null, dismissed: false });
      return;
    }
    const local = { ...stateRef.current, updatedAt: Date.now() };   // a new stamp so other devices see the change
    stateRef.current = local;
    replaceState(local);
    try {
      await push(s, local);
      setSync({ status: 'synced', at: Date.now(), error: '', conflict: null, dismissed: false });
    } catch (e) {
      setSync({ status: 'error', at: null, error: (e && e.message) || 'Sync failed.', conflict: null, dismissed: false });
    }
  }, [sync.conflict, adopt, push, replaceState]);

  const reopen = useCallback(() => setSync((x) => ({ ...x, dismissed: false })), []);
  return { ...sync, run, resolve, reopen };
}

/* ---- Account button + menu ---- */
function syncLine(mode, session, sync) {
  if (mode === 'guest') return { tone: 'muted', text: 'Not signed in. Progress stays in this browser.' };
  if (session.status === 'connecting') return { tone: 'muted', text: 'Connecting…' };
  if (session.status === 'unavailable' || session.status === 'error') return { tone: 'warn', text: session.reason };
  if (session.status === 'signed-out') return { tone: 'warn', text: 'Signed out.' };
  switch (sync.status) {
    case 'synced': return { tone: 'ok', text: `Synced ${timeAgo(sync.at)}` };
    case 'pending': return { tone: 'muted', text: 'Changes waiting to sync' };
    case 'saving': return { tone: 'muted', text: 'Saving to the cloud…' };
    case 'conflict': return { tone: 'warn', text: 'Sync paused: this device and the cloud have different saves.' };
    case 'error': return { tone: 'bad', text: sync.error };
    default: return { tone: 'muted', text: 'Checking the cloud save…' };
  }
}
const TONE = { ok: 'var(--ok)', warn: 'var(--warn)', bad: 'var(--bad)', muted: 'var(--muted)' };

function Avatar({ account, size = 30 }) {
  const [failed, setFailed] = useState(false);
  if (account && account.avatarUrl && !failed) {
    return <img src={account.avatarUrl} alt="" width={size} height={size} referrerPolicy="no-referrer" onError={() => setFailed(true)}
      className="shrink-0 rounded-full object-cover" style={{ width: size, height: size }} />;
  }
  const initial = account && account.name ? account.name.trim().charAt(0).toUpperCase() : '';
  return (
    <span className="grid shrink-0 place-items-center rounded-full text-xs font-bold"
      style={{ width: size, height: size, background: (account && account.color) || 'var(--panel-2)', color: account ? '#fff' : 'var(--muted)' }}>
      {initial || <UserRound size={Math.round(size * 0.55)} />}
    </span>
  );
}

function AccountMenu({ mode, session, sync, onSignIn, onSignOut, onBackup }) {
  const [open, setOpen] = useState(false);
  const ref = useRef(null);
  useEffect(() => {
    if (!open) return undefined;
    const onDown = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    const onKey = (e) => { if (e.key === 'Escape') { e.preventDefault(); setOpen(false); } };
    document.addEventListener('mousedown', onDown);
    document.addEventListener('keydown', onKey, true);
    return () => { document.removeEventListener('mousedown', onDown); document.removeEventListener('keydown', onKey, true); };
  }, [open]);

  const account = session.status === 'ready' ? session.account : null;
  const line = syncLine(mode, session, sync);
  const name = account ? account.name : mode === 'guest' ? 'Guest' : session.provider === 'claude' ? 'Claude account' : 'Account';
  const label = account ? account.label : mode === 'guest' ? 'Offline on this device' : '';
  const busy = session.status === 'connecting' || ['connecting', 'checking', 'saving'].includes(sync.status);

  return (
    <div ref={ref} className="relative">
      <button type="button" className="btn btn-quiet gap-2 px-1.5 sm:pr-3" aria-haspopup="true" aria-expanded={open}
        onClick={() => setOpen((o) => !o)} title={`${name}: ${line.text}`}>
        <span className="relative">
          <Avatar account={account} size={28} />
          <span className="absolute -bottom-0.5 -right-0.5 h-2.5 w-2.5 rounded-full border-2 border-vault-bg" style={{ background: TONE[line.tone] }} />
        </span>
        <span className="hidden max-w-[120px] truncate lg:inline">{name}</span>
        <ChevronDown size={14} className="hidden lg:inline" />
      </button>
      {open && (
        <div className="account-pop" role="menu" aria-label="Account">
          <div className="flex items-center gap-3">
            <Avatar account={account} size={40} />
            <div className="min-w-0">
              <p className="truncate font-semibold">{name}</p>
              {label && <p className="truncate text-xs text-vault-muted">{label}{account && account.email ? ` · ${account.email}` : ''}</p>}
            </div>
          </div>
          <p className="mt-3 flex items-start gap-2 rounded-lg bg-vault-bg px-3 py-2 text-xs" style={{ color: TONE[line.tone] }}>
            {busy ? <Loader2 size={14} className="spin mt-px shrink-0" /> : mode === 'guest' ? <CloudOff size={14} className="mt-px shrink-0" /> : <Cloud size={14} className="mt-px shrink-0" />}
            <span>{line.text}</span>
          </p>
          <div className="mt-3 grid gap-1">
            {sync.status === 'conflict' && (
              <button type="button" role="menuitem" className="btn btn-ember justify-start" onClick={() => { setOpen(false); sync.reopen(); }}>
                <AlertTriangle size={14} /> Choose which save to keep
              </button>
            )}
            {session.status === 'ready' && sync.status !== 'conflict' && (
              <button type="button" role="menuitem" className="btn btn-quiet justify-start" onClick={() => sync.run()}>
                <RefreshCw size={14} /> Sync now
              </button>
            )}
            <button type="button" role="menuitem" className="btn btn-quiet justify-start" onClick={() => { setOpen(false); onBackup(); }}>
              <HardDrive size={14} /> Backup &amp; restore
            </button>
            {mode === 'guest' || session.status === 'signed-out' ? (
              <button type="button" role="menuitem" className="btn btn-quiet justify-start" onClick={() => { setOpen(false); onSignIn(); }}>
                <LogIn size={14} /> Sign in
              </button>
            ) : (
              <button type="button" role="menuitem" className="btn btn-quiet justify-start" onClick={() => { setOpen(false); onSignOut(); }}>
                <LogOut size={14} /> {session.provider === 'firebase' ? 'Sign out' : 'Stop syncing'}
              </button>
            )}
          </div>
          {mode !== 'guest' && <p className="mt-2 text-[11px] text-vault-faint">Signing out keeps a copy of your progress on this device.</p>}
        </div>
      )}
    </div>
  );
}

  const b = saveSummary(local);
  return (
    <div className="overlay">
      <div ref={ref} tabIndex={-1} className="sheet panel relative max-w-[640px] p-5 outline-none sm:p-7" role="dialog" aria-modal="true" aria-labelledby="conflict-title">

        <p className="mt-2 text-sm text-vault-muted">
          This device and your {accountLabel} cloud save were both changed. Choose the one to keep. The other is replaced on every device.
        </p>
        <div className="mt-5 grid gap-3 sm:grid-cols-2">
          <SaveCard title="Cloud save" summary={a} action="Use the cloud save" primary={(a.updatedAt || 0) >= (b.updatedAt || 0)} onPick={() => onResolve('cloud')} />
          <SaveCard title="This device" summary={b} action="Keep this device’s save" primary={(b.updatedAt || 0) > (a.updatedAt || 0)} onPick={() => onResolve('local')} />

<style>
/* Layout: sticky command bar -> Guardian hero -> [HOME box grid | generation ledger]
   Omnidex: search bar -> filter chips -> card grid -> detail sheet (modal) */
:root {
  color-scheme: dark;
  --bg: #0f172a;            /* slate-900: the vault floor */
  --panel: #141e35;
  --panel-2: #1a2643;
  --line: #273452;
  --line-hi: #3d4e78;
  --fg: #e8edf7;
  --muted: #8f9cba;
  --faint: #5d6a88;
  --ember: #ff7b35;         /* Thalaivar's flame: the one accent */
  --ember-soft: rgba(255, 123, 53, 0.14);
  --ok: #3ddc97;
  --ok-soft: rgba(61, 220, 151, 0.4);
  --warn: #fbbf24;
  --bad: #f87171;
  --male: #60a5fa;
  --female: #f472b6;
  --on-light: #0b1020;
  --font-display: "Chakra Petch", "Bahnschrift", "Segoe UI", system-ui, sans-serif;
  --font-body: "Figtree", "Segoe UI", -apple-system, system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Consolas, monospace;
}
html { background: var(--bg); }
body {
  background: var(--bg);
  background-image: radial-gradient(900px 420px at 12% -8%, var(--ember-soft), transparent 65%);
  background-repeat: no-repeat;
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--bg); }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1240px; margin-inline: auto; }
h1, h2, h3 { text-wrap: balance; }
@keyframes shimmer { to { background-position: -200% 0; } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pulse-slot { 50% { transform: scale(1.06); } }
@keyframes toast-in { from { transform: translateY(12px); opacity: 0; } }
@keyframes page-in { from { transform: translateY(6px); opacity: 0; } }
.page-in { animation: page-in .28s ease-out; }
/* below lg the tab bar sits at the bottom, so toasts float above it */
@media (max-width: 1023.98px) { body .toast-wrap { padding-bottom: calc(80px + env(safe-area-inset-bottom, 0px)); } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
}
</style>

          fg: 'var(--fg)', muted: 'var(--muted)', faint: 'var(--faint)', ember: 'var(--ember)',
          ok: 'var(--ok)', warn: 'var(--warn)', bad: 'var(--bad)', ink: 'var(--on-light)',
        },
      },
      fontFamily: {
        display: ['"Chakra Petch"', 'Bahnschrift', '"Segoe UI"', 'system-ui', 'sans-serif'],

<style type="text/tailwindcss">
@layer components {
  .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  .eyebrow { font-family: var(--font-display); text-transform: uppercase; letter-spacing: 0.14em; font-size: 11px; font-weight: 600; color: var(--muted); }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; }
  .btn { display: inline-flex; align-items: center; gap: 6px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel-2); color: var(--fg); font-weight: 600; font-size: 13px; padding: 7px 12px; transition: border-color .15s, background-color .15s; }
  .btn:hover { border-color: var(--line-hi); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn-ember { background: var(--ember); border-color: var(--ember); color: var(--on-light); }
  .btn-ember:hover { border-color: var(--fg); }
  .btn-quiet { background: transparent; border-color: transparent; }
  .btn-quiet:hover { border-color: var(--line); }
  .field { width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; color: var(--fg); font-size: 14px; }
  .field::placeholder { color: var(--faint); }
  .field:focus { border-color: var(--ember); outline: none; }
  .skeleton { background: linear-gradient(90deg, var(--panel-2) 0%, #26355a 50%, var(--panel-2) 100%); background-size: 200% 100%; animation: shimmer 1.2s linear infinite; border-radius: 8px; }
  .spin { animation: spin 1s linear infinite; }
  .sprite { display: block; image-rendering: pixelated; }
  .silhouette { filter: brightness(0) invert(0.85); opacity: 0.2; }

  /* HOME box */
  .box-frame { position: relative; border-radius: 14px; padding: 10px; background: var(--bg); border: 1px solid var(--line); }
  .box-frame::before { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; opacity: .35;
    background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px); background-size: 18px 18px; }
  .box-grid { position: relative; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; }
  .slot { position: relative; aspect-ratio: 1; border-radius: 10px; background: var(--panel-2); border: 1px solid var(--line); padding: 8%; transition: border-color .15s, transform .15s; }
  .slot:hover { border-color: var(--line-hi); transform: translateY(-1px); }
  .slot.is-caught { background: radial-gradient(circle at 50% 62%, rgba(255,255,255,.08), transparent 70%), var(--panel-2); border-color: var(--ok-soft); }
  .slot.is-hl { outline: 2px solid var(--ember); outline-offset: 2px; animation: pulse-slot .8s ease-in-out 3; }
  .slot-empty { aspect-ratio: 1; border-radius: 10px; border: 1px dashed var(--line); display: grid; place-items: center; color: var(--faint); font-family: var(--font-mono); font-size: 9px; }
  .slot-num { position: absolute; left: 5px; top: 3px; font: 500 9.5px/1 var(--font-mono); color: var(--faint); pointer-events: none; }
  .slot.is-caught .slot-num { color: var(--muted); }
  .slot-check { position: absolute; right: 4px; bottom: 4px; width: 15px; height: 15px; border-radius: 50%; background: var(--ok); color: var(--on-light); display: grid; place-items: center; }
  .slot-check.is-quick { background: var(--bg); color: var(--ok); box-shadow: inset 0 0 0 1.5px var(--ok); }
  .slot-gender { position: absolute; right: 5px; top: 2px; font: 700 12px/1 var(--font-body); pointer-events: none; }

  /* free boxes */
  .slot.is-stored { background: radial-gradient(circle at 50% 62%, rgba(255,255,255,.08), transparent 70%), var(--panel-2); }
  .slot.is-held { opacity: .35; outline: 2px dashed var(--ember); outline-offset: 2px; }
  .slot-free-empty { aspect-ratio: 1; border-radius: 10px; border: 1px dashed var(--line); display: grid; place-items: center; color: var(--line-hi); transition: border-color .15s, color .15s, background-color .15s; }
  .slot-free-empty:hover { border-color: var(--ember); color: var(--ember); background: var(--ember-soft); }
  .slot-free-empty.is-target { border-color: var(--ember); color: var(--ember); }
  .free-row { display: flex; width: 100%; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel-2); text-align: left; font-size: 14px; }
  .free-row:hover { border-color: var(--line-hi); }
  .free-row[aria-current="true"] { border-color: var(--ember); background: var(--ember-soft); }

  /* mega */
  .mega-card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px; transition: border-color .15s; }
  .mega-card:hover { border-color: var(--line-hi); }
  .mega-card.is-ready { border-color: rgba(255, 123, 53, .55); box-shadow: inset 0 0 0 1px rgba(255, 123, 53, .18); }
  .stone-toggle { display: inline-flex; align-items: center; gap: 6px; justify-self: start; padding: 5px 9px; border-radius: 8px;
    border: 1px dashed var(--line-hi); color: var(--muted); font-weight: 600; }
  .stone-toggle:hover { border-color: var(--ember); color: var(--fg); }
  .stone-toggle.is-on { border-style: solid; border-color: var(--ember); background: var(--ember-soft); color: var(--fg); }

  /* field guide */
  .book-page { position: relative; overflow: hidden; }
  .book-page::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--chapter, var(--ember)); opacity: .85; }

  /* phone and tablet navigation */
  .bottom-nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px;
    background: rgba(15, 23, 42, .95); backdrop-filter: blur(8px); border-top: 1px solid var(--line);
    padding: 6px max(8px, env(safe-area-inset-right, 0px)) max(6px, env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
  .bottom-nav button { display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 52px; justify-content: center; border-radius: 10px;
    font-size: 11px; font-weight: 600; color: var(--muted); }
  .bottom-nav button[aria-current="page"] { color: var(--ember); background: var(--ember-soft); }

  /* sign-in */
  .login-btn { width: 100%; justify-content: center; padding: 12px 16px; font-size: 15px; border-radius: 12px; }
  .account-pop { position: absolute; right: 0; top: calc(100% + 8px); z-index: 60; width: min(300px, calc(100vw - 32px)); padding: 14px;
    background: var(--panel); border: 1px solid var(--line-hi); border-radius: 14px; box-shadow: 0 18px 40px rgba(0, 0, 0, .5); }

  /* slot form */
  .field.is-invalid { border-color: var(--bad); }
  .combo-list { position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 40; max-height: 252px; overflow-y: auto; padding: 4px;
    background: var(--panel); border: 1px solid var(--line-hi); border-radius: 12px; box-shadow: 0 18px 40px rgba(0, 0, 0, .45);
    scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
  .combo-option { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 8px; cursor: pointer; font-size: 14px; }
  .combo-option[aria-selected="true"] { background: var(--panel-2); }
  .toast-wrap { position: fixed; left: 0; right: 0; bottom: 0; z-index: 90; display: flex; justify-content: center; pointer-events: none;
    padding-bottom: max(20px, env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .toast { display: flex; align-items: center; gap: 8px; max-width: 100%; padding: 10px 16px; border-radius: 12px; font-size: 14px; font-weight: 600;
    background: var(--panel-2); color: var(--fg); border: 1px solid var(--ok-soft); box-shadow: 0 12px 30px rgba(0, 0, 0, .45); animation: toast-in .25s ease-out; }
  .chip-box { flex: 0 0 auto; min-width: 44px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel-2); padding: 5px 7px 6px; text-align: center; }
  .chip-box[aria-current="true"] { border-color: var(--ember); background: var(--ember-soft); }
  .strip { scrollbar-width: thin; scrollbar-color: var(--line) transparent; }

  /* progress */
  .bar-track { height: 8px; border-radius: 999px; background: var(--panel-2); overflow: hidden; }
  .bar-fill { height: 100%; border-radius: inherit; transition: width 1s cubic-bezier(.2,.8,.2,1); }
  .ring-progress { transition: stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1); }

  /* guardian stage */
  .stage { position: relative; display: grid; place-items: end center; }
  .stage::before { content: ""; position: absolute; inset: 8% 6% 18%; border-radius: 50%; background: radial-gradient(circle, rgba(255,123,53,.35), transparent 68%); filter: blur(6px); }
  .stage::after { content: ""; position: absolute; left: 14%; right: 14%; bottom: 4%; height: 16%; border-radius: 50%; background: radial-gradient(ellipse, rgba(255,123,53,.28), transparent 70%); border-top: 1px solid rgba(255,123,53,.35); }

  /* modal */
  .overlay { position: fixed; inset: 0; z-index: 70; background: rgba(5, 8, 20, .72); backdrop-filter: blur(3px); display: flex; align-items: flex-start; justify-content: center; overflow-y: auto;
    padding: max(16px, env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); }
  .sheet { width: 100%; max-width: 980px; margin-block: 3vh; }
  .movelist { max-height: 340px; overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
  :where(button, a, select, textarea, input):focus-visible { outline: 2px solid var(--ember); outline-offset: 2px; }
}
</style>

  stone: item && !item.includes('(') ? searchKey(item) : null,     // Rayquaza needs a move, not an item
}));

// Sprite atlas order: species #1-1025, regional forms, other forms, Megas, then female variants (keyed "f" + id)
const FEMALE_SPRITES = new Set(D.genderDiff);
const ATLAS_COLS = 40;
const ATLAS_INDEX = new Map(
  [...BASE_SPECIES.map((e) => e.id), ...REGIONAL.map((e) => e.id), ...OTHER_FORMS.map((e) => e.id), ...MEGAS.map((e) => e.id), ...D.genderDiff.map((id) => `f${id}`)]
    .map((key, i) => [key, i]),
);
const ATLAS_ROWS = Math.ceil(ATLAS_INDEX.size / ATLAS_COLS);

// Gender: which choices a species allows (from its gender ratio)
const GENDERS = {
  male: { label: 'Male', symbol: '♂', color: 'var(--male)' },
  female: { label: 'Female', symbol: '♀', color: 'var(--female)' },
  genderless: { label: 'Genderless', symbol: '–', color: 'var(--muted)' },
};
function genderOptions(dex) {
  const rate = D.genderRates[dex - 1];
  if (rate === undefined) return ['male', 'female', 'genderless']; // species newer than this file
  if (rate === 'n') return ['genderless'];
  if (rate === '0') return ['male'];
  if (rate === '8') return ['female'];
  return ['male', 'female'];
}

// Every move a Pokémon can know, for the move picker
const MOVE_CLASS = ['', 'status', 'physical', 'special'];
const ALL_MOVES = D.allMoves.split('|').map((row) => {
  const [slug, type, cls, power] = row.split('.');
  const name = D.moveNameFix[slug] || slug.split('-').map((w) => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
  return { slug, name, type: D.types[type], cls: MOVE_CLASS[cls], power: +power, sk: searchKey(name) };
});
const MOVE_BY_SLUG = new Map(ALL_MOVES.map((m) => [m.slug, m]));
const VERSION_GROUPS = new Map(D.versionGroups.map(([key, label, gen], order) => [key, { key, label, gen, order }]));
const SKIP_MOVE_SOURCES = new Set(['lets-go-pikachu-lets-go-eevee', 'legends-arceus', 'colosseum', 'xd', 'champions']);
const REGION_LABEL = Object.fromEntries(ANNEX_BOXES.filter((a) => a.region).map((a) => [a.region, a.origin]));

const pad4 = (n) => '#' + String(n).padStart(4, '0');
const prettify = (slug) => String(slug).split('-').map((w) => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
const moveName = (slug) => D.moveNameFix[slug] || prettify(slug);
const abilityName = (slug) => D.abilityNameFix[slug] || prettify(slug);
const clampLevel = (n) => Math.min(100, Math.max(1, parseInt(n, 10) || 1));
const idFromUrl = (url) => parseInt(String(url).replace(/\/+$/, '').split('/').pop(), 10);

function buildGenerations(count) {
  if (count <= 1025) return GENERATIONS;
  return [...GENERATIONS, { ...FUTURE_GEN, start: 1026, end: count }];
}
const genOf = (dex, gens) => gens.find((g) => dex >= g.start && dex <= g.end);

function buildIndex(species, live = { forms: [], megas: [] }) {
  const all = [...species, ...REGIONAL, ...OTHER_FORMS, ...MEGAS, ...live.forms, ...live.megas];
  return {
    all,
    byId: new Map(all.map((e) => [e.id, e])),
    bySk: new Map(all.map((e) => [e.sk, e])),
  };
}

// "25", "#0025", "pikachu", "Mr. Mime", "alolan raichu" -> index entry (or null)
function resolveQuery(query, index) {
  const raw = String(query || '').trim();
  if (!raw) return null;
  const num = raw.replace(/^#/, '');
  if (/^\d+$/.test(num)) return index.byId.get(parseInt(num, 10)) || null;
  return index.bySk.get(searchKey(raw)) || null;
}

// Ranked matches for the search bar: exact > starts with > contains; numbers match Dex prefixes.
function searchIndex(query, index, limit = 8) {
  const raw = String(query || '').trim();
  if (!raw) return [];
  const num = raw.replace(/^#/, '');
  if (/^\d+$/.test(num)) {
    const n = parseInt(num, 10);
    const hits = index.all.filter((e) => e.kind === 'species' && String(e.dex).startsWith(String(n)));
    hits.sort((a, b) => (a.dex === n ? -1 : b.dex === n ? 1 : a.dex - b.dex));
    const forms = index.all.filter((e) => e.kind !== 'species' && e.dex === n);
    return [...hits.slice(0, 1), ...forms, ...hits.slice(1)].slice(0, limit);
  }
  const sk = searchKey(raw);
  if (!sk) return [];
  const scored = [];
  for (const e of index.all) {
    const i = e.sk.indexOf(sk);
    if (i === -1) continue;
    scored.push([e.sk === sk ? 0 : i === 0 ? 1 : 2, e.dex, e.kind === 'form' ? 1 : 0, e]);
  }
  scored.sort((a, b) => a[0] - b[0] || a[1] - b[1] || a[2] - b[2]);
  return scored.slice(0, limit).map((s) => s[3]);
}

/* ---------------------------------------------------------------------
   3. HOME BOX MODEL
   Spine:  HOME 1..N    -> Dex #n sits in box ceil(n/30), slot ((n-1) % 30) + 1
   Runway: N+1..50      -> empty, future species keep landing in the spine
   Annex:  HOME 51..55  -> one box per regional set
   --------------------------------------------------------------------- */
function homeSlot(dex) {
  const box = Math.ceil(dex / BOX_SIZE);
  const slot = ((dex - 1) % BOX_SIZE) + 1;
  return { box, slot, row: Math.ceil(slot / BOX_COLS), col: ((slot - 1) % BOX_COLS) + 1 };
}

function buildBoxes(species, gens) {
  const boxes = [];
  const spineCount = Math.ceil(species.length / BOX_SIZE);
  for (let b = 1; b <= spineCount; b++) {
    const first = (b - 1) * BOX_SIZE + 1;
    const last = b * BOX_SIZE;
    const regions = gens.filter((g) => g.end >= first && g.start <= Math.min(last, species.length)).map((g) => g.region);
    boxes.push({
      number: b, kind: 'spine', label: regions.join(' → '), range: `${pad4(first)} – ${pad4(last)}`,
      firstDex: first, slots: Array.from({ length: BOX_SIZE }, (_, i) => species[first - 1 + i] || null),
    });
  }
  for (const a of ANNEX_BOXES) {
    const forms = a.region ? REGIONAL.filter((f) => f.region === a.region) : [];
    boxes.push({
      number: a.box, kind: a.region ? 'annex' : 'reserved', label: a.label, color: a.color,
      range: a.region ? `${forms.length} forms` : 'Reserved', slots: Array.from({ length: BOX_SIZE }, (_, i) => forms[i] || null),
    });
  }
  return boxes;
}

function locate(entry, boxes) {
  if (!entry) return null;
  if (entry.kind === 'species') return homeSlot(entry.dex);
  for (const b of boxes) {
    const i = b.slots.findIndex((s) => s && s.id === entry.id);
    if (i !== -1) return { box: b.number, slot: i + 1, row: Math.floor(i / BOX_COLS) + 1, col: (i % BOX_COLS) + 1 };
  }
  return null;
}

/* ---------------------------------------------------------------------
   4. LOCAL STATE (localStorage)
   --------------------------------------------------------------------- */
const safeStorage = {
  get(key) { try { return window.localStorage.getItem(key); } catch { return null; } },
  set(key, value) { try { window.localStorage.setItem(key, value); return true; } catch { return false; } },
};

const DEFAULT_GUARDIAN = {
  nickname: 'Thalaivar', pokemonId: 6, species: 'Charizard', level: 100,
  types: ['fire', 'flying'], sprite: `${SPRITES}/other/showdown/6.gif`, origin: 'Kanto',
};

/* Schema v3
   caught[pokemonId]  = { caughtAt, updatedAt, nickname, gender, moves: [move slugs, max 4] }   living dex, one per slot
   freeBoxes[]        = { id, name, slots: { 0-29: { pokemonId, ...same record fields } } }     any Pokémon, any slot
   megaStones         = { [stone key]: true }                                                     Mega Stones you own
   A quick-marked living dex entry has caughtAt only. */
const SCHEMA_VERSION = 4;   // v4: megaStones
const MOVE_SLOTS = 4;

const newBoxId = () => `fb${Date.now().toString(36)}${Math.random().toString(36).slice(2, 6)}`;
const makeFreeBox = (n) => ({ id: newBoxId(), name: `Box ${n}`, slots: {} });

function createDefaultState() {
  const now = Date.now();
  const first = makeFreeBox(1);
  return {
    schemaVersion: SCHEMA_VERSION,
    guardian: { ...DEFAULT_GUARDIAN },
    caught: { 6: { caughtAt: now, updatedAt: now, nickname: 'Thalaivar', gender: null, moves: [] } }, // Thalaivar is already in the vault
    freeBoxes: [first],
    megaStones: {},
    ui: { box: 1, clickMode: 'register', freeBox: first.id },
    updatedAt: now,
  };
}

function cleanRecord(value) {
  const now = Date.now();
  if (typeof value === 'number') return { caughtAt: value };                 // v1 stored a timestamp
  if (!value || typeof value !== 'object') return { caughtAt: now };          // v1 arrays / booleans
  const rec = { caughtAt: typeof value.caughtAt === 'number' ? value.caughtAt : now };
  if (typeof value.updatedAt === 'number') rec.updatedAt = value.updatedAt;
  const nickname = String(value.nickname || '').trim().slice(0, NICKNAME_MAX);
  if (nickname) rec.nickname = nickname;
  if (GENDERS[value.gender]) rec.gender = value.gender;
  if (Array.isArray(value.moves)) {
    const moves = [...new Set(value.moves.map((m) => String(m).toLowerCase()).filter(Boolean))].slice(0, MOVE_SLOTS);
    if (moves.length) rec.moves = moves;
  }
  return rec;
}

const hasDetails = (rec) => !!(rec && (rec.nickname || rec.gender || (rec.moves && rec.moves.length)));

function cleanFreeRecord(value) {
  const pokemonId = value && parseInt(value.pokemonId, 10);
  if (!pokemonId || pokemonId < 1) return null;
  return { pokemonId, ...cleanRecord(value) };
}

function cleanFreeBoxes(raw) {
  if (!Array.isArray(raw)) return [makeFreeBox(1)];
  const seen = new Set();
  const out = [];
  raw.slice(0, MAX_FREE_BOXES).forEach((b, i) => {
    if (!b || typeof b !== 'object') return;
    let id = typeof b.id === 'string' && b.id ? b.id : newBoxId();
    if (seen.has(id)) id = newBoxId();
    seen.add(id);
    const name = String(b.name || '').trim().slice(0, FREE_BOX_NAME_MAX) || `Box ${i + 1}`;
    const slots = {};
    Object.entries(b.slots || {}).forEach(([k, v]) => {
      const n = parseInt(k, 10);
      const rec = n >= 0 && n < BOX_SIZE ? cleanFreeRecord(v) : null;
      if (rec) slots[n] = rec;
    });
    out.push({ id, name, slots });
  });
  return out.length ? out : [makeFreeBox(1)];
}

const freeCount = (box) => Object.keys(box.slots).length;

// The Pokédex slot a stored Pokémon counts for: species and regional forms have their own,
// other forms (Wash Rotom, Origin Giratina...) count for their species.
const LIVE_FORM_DEX = new Map();   // forms found by the live PokeAPI check -> their species
function dexSlotFor(pokemonId) {
  if (pokemonId <= 10000) return pokemonId;
  if (REGIONAL.some((f) => f.id === pokemonId)) return pokemonId;
  const other = OTHER_FORMS.find((f) => f.id === pokemonId);
  if (other) return other.dex;
  return LIVE_FORM_DEX.get(pokemonId) || null;
}

// Everything in a free box is also registered in the Pokédex (removing it later doesn't unregister it)
function registerFreeInDex(caught, freeBoxes) {
  const added = [];
  freeBoxes.forEach((b) => Object.values(b.slots).forEach((r) => {
    const id = dexSlotFor(r.pokemonId);
    if (id && !caught[id]) { caught[id] = { caughtAt: r.caughtAt || Date.now() }; added.push(id); }
  }));
  return added;
}

// Accepts anything that came out of localStorage or a pasted backup (v1 or v2), returns a valid v2 state.
function migrateState(raw) {
  const base = createDefaultState();
  if (!raw || typeof raw !== 'object') return base;
  const caught = {};
  if (Array.isArray(raw.caught)) {
    raw.caught.forEach((id) => { if (/^\d+$/.test(String(id))) caught[id] = cleanRecord(null); });
  } else if (raw.caught && typeof raw.caught === 'object') {
    for (const [id, value] of Object.entries(raw.caught)) {
      if (/^\d+$/.test(id) && value) caught[id] = cleanRecord(value);
    }
  } else {
    Object.assign(caught, base.caught);
  }
  const guardian = { ...base.guardian, ...(raw.guardian || {}) };
  guardian.level = clampLevel(guardian.level);
  guardian.nickname = String(guardian.nickname || base.guardian.nickname).slice(0, NICKNAME_MAX);
  if (!Array.isArray(guardian.types)) guardian.types = [];
  // v1 -> v2: the guardian's own slot picks up its nickname once
  if ((raw.schemaVersion || 1) < 2) {
    const own = caught[guardian.pokemonId];
    if (own && !own.nickname) own.nickname = guardian.nickname;
  }
  const freeBoxes = cleanFreeBoxes(raw.freeBoxes);    // v1/v2 saves have none: start with one empty box
  registerFreeInDex(caught, freeBoxes);
  const megaStones = {};
  Object.entries(raw.megaStones || {}).forEach(([k, v]) => { if (v === true && /^[a-z0-9]{2,40}$/.test(k)) megaStones[k] = true; });
  const ui = { ...base.ui, ...(raw.ui || {}) };
  if (ui.clickMode !== 'quick') ui.clickMode = 'register';
  if (!freeBoxes.some((b) => b.id === ui.freeBox)) ui.freeBox = freeBoxes[0].id;
  return {
    schemaVersion: SCHEMA_VERSION,
    guardian,
    caught,
    freeBoxes,
    megaStones,
    ui,
    updatedAt: typeof raw.updatedAt === 'number' ? raw.updatedAt : Date.now(),
  };
}

// Every account keeps its own save on this device; the offline (guest) save stays at STORAGE_KEY.
const GUEST_KEY = STORAGE_KEY;
const accountStorageKey = (accountKey) => `livingFormDex:acct:${accountKey}`;

function loadState(key = GUEST_KEY) {
  const raw = safeStorage.get(key);
  if (!raw) return createDefaultState();
  try { return migrateState(JSON.parse(raw)); } catch { return createDefaultState(); }
}

// One save per storage key. Changing the key (switching account) loads that account's save,
// so one account's progress never shows up under another.
function usePersistentState(key) {
  const [slot, setSlot] = useState(() => ({ key, state: loadState(key) }));
  const [storageOk, setStorageOk] = useState(true);
  const fromOtherTab = useRef(false);

  let current = slot;
  if (slot.key !== key) {
    current = { key, state: loadState(key) };
    setSlot(current);
  }

  useEffect(() => {
    if (fromOtherTab.current) { fromOtherTab.current = false; return; }
    setStorageOk(safeStorage.set(slot.key, JSON.stringify(slot.state)));
  }, [slot]);

  // Keep two open tabs on the same account in step.
  useEffect(() => {
    const onStorage = (e) => {
      if (e.key !== key || !e.newValue) return;
      try { fromOtherTab.current = true; setSlot({ key, state: migrateState(JSON.parse(e.newValue)) }); } catch { fromOtherTab.current = false; }
    };
    window.addEventListener('storage', onStorage);
    return () => window.removeEventListener('storage', onStorage);
  }, [key]);

  // touch=false for per-device view changes (current box, click mode) so they never count as progress to sync
  const update = useCallback((fn, touch = true) => setSlot((sl) => {
    const next = fn(sl.state);
    return { key: sl.key, state: touch ? { ...next, updatedAt: Date.now() } : next };
  }), []);
  // Cloud sync: take a save exactly as it is, but only into the save it was meant for
  const replace = useCallback((next, forKey) => setSlot((sl) => (forKey && sl.key !== forKey ? sl : { key: sl.key, state: next })), []);
  return [current.state, update, storageOk, replace, current.key];
}

/* ---------------------------------------------------------------------
   5. POKEAPI CLIENT (live first, offline pack as fallback)
   --------------------------------------------------------------------- */
class ApiError extends Error {
  constructor(kind, message, status) { super(message); this.kind = kind; this.status = status; }
}
const apiHealth = { offlineUntil: 0 };
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

async function fetchJSON(url, { timeout = 12000, retries = 1 } = {}) {
  for (let attempt = 0; ; attempt++) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), timeout);
    try {
      const res = await fetch(url, { signal: ctrl.signal });
      if (res.status === 404) throw new ApiError('not_found', 'Not found', 404);
      if (!res.ok) throw new ApiError('http', `PokeAPI answered ${res.status}`, res.status);
      return await res.json();
    } catch (err) {
      const e = err instanceof ApiError ? err
        : err && err.name === 'AbortError' ? new ApiError('timeout', 'PokeAPI took too long to answer')
        : new ApiError('network', 'Could not reach PokeAPI');
      const retryable = e.kind === 'timeout' || e.kind === 'network' || (e.kind === 'http' && e.status >= 500);
      if (!retryable || attempt >= retries) throw e;
      await sleep(400 * (attempt + 1));
    } finally {
      clearTimeout(timer);
    }
  }
}

let packPromise = null;
function loadPack() {
  if (!packPromise) {
    packPromise = fetch(PACK_DIR + 'dex.json')
      .then((r) => (r.ok ? r.json() : null))
      .catch(() => null)
      .then((p) => { if (!p) packPromise = null; return p; });
  }
  return packPromise;
}

function pickVersionGroup(keys) {
  const order = (k) => (VERSION_GROUPS.has(k) ? VERSION_GROUPS.get(k).order : 999); // unknown = newer than this file
  const sorted = [...keys].sort((a, b) => order(b) - order(a));
  return sorted.find((k) => !SKIP_MOVE_SOURCES.has(k)) || sorted[0] || null;
}

const METHOD_ORDER = { 'level-up': 0, machine: 1, egg: 2, tutor: 3 };
function sortMoves(moves) {
  const seen = new Set();
  return moves
    .filter((m) => { const k = `${m.key}|${m.method}|${m.level}`; if (seen.has(k)) return false; seen.add(k); return true; })
    .sort((a, b) => (METHOD_ORDER[a.method] ?? 9) - (METHOD_ORDER[b.method] ?? 9)
      || (a.method === 'level-up' ? a.level - b.level : 0) || a.name.localeCompare(b.name));
}

function statsFromList(list) {
  const s = { hp: 0, attack: 0, defense: 0, spAtk: 0, spDef: 0, speed: 0 };
  const map = { hp: 'hp', attack: 'attack', defense: 'defense', 'special-attack': 'spAtk', 'special-defense': 'spDef', speed: 'speed' };
  list.forEach(([name, v]) => { if (map[name]) s[map[name]] = v; });
  return s;
}

function displayNameFor(id, fallback) {
  const base = BASE_SPECIES[id - 1];
  if (base) return base.name;
  const form = REGIONAL.find((f) => f.id === id) || OTHER_FORMS.find((f) => f.id === id) || MEGAS.find((f) => f.id === id);
  return form ? form.name : fallback;
}

function originFor(id, gen) {
  const form = REGIONAL.find((f) => f.id === id);
  if (form) return REGION_LABEL[form.region];
  return (GENERATIONS.find((g) => g.gen === gen) || FUTURE_GEN).region;
}

// Live /pokemon + /pokemon-species JSON -> one shape the UI understands
function fromLive(p, sp) {
  const speciesId = sp ? sp.id : idFromUrl(p.species.url);
  const gen = sp && sp.generation ? idFromUrl(sp.generation.url) : 0;
  const englishName = sp && sp.names ? (sp.names.find((n) => n.language.name === 'en') || {}).name : null;
  const vgSet = new Set();
  p.moves.forEach((m) => m.version_group_details.forEach((d) => vgSet.add(d.version_group.name)));
  const vg = pickVersionGroup(vgSet);
  const moves = [];
  p.moves.forEach((m) => m.version_group_details
    .filter((d) => d.version_group.name === vg)
    .forEach((d) => {
      const known = MOVE_BY_SLUG.get(m.move.name) || {};
      moves.push({ key: m.move.name, name: moveName(m.move.name), type: known.type, cls: known.cls, power: known.power,
        method: d.move_learn_method.name, level: d.level_learned_at });
    }));
  const games = new Set(vgSet);
  (p.game_indices || []).forEach((g) => { const k = D.versionToGroup[g.version.name]; if (k) games.add(k); });
  const other = (p.sprites && p.sprites.other) || {};
  const bw = (((p.sprites || {}).versions || {})['generation-v'] || {})['black-white'] || {};
  return {
    id: p.id, speciesId, dex: speciesId, slug: p.name,
    name: displayNameFor(p.id, p.is_default && englishName ? englishName : prettify(p.name)),
    genus: sp && sp.genera ? (sp.genera.find((g) => g.language.name === 'en') || {}).genus || '' : '',
    gen, origin: originFor(p.id, gen),
    types: [...p.types].sort((a, b) => a.slot - b.slot).map((t) => t.type.name),
    stats: statsFromList(p.stats.map((s) => [s.stat.name, s.base_stat])),
    abilities: [...p.abilities].sort((a, b) => a.slot - b.slot).map((a) => ({ name: abilityName(a.ability.name), hidden: a.is_hidden })),
    height: p.height, weight: p.weight,
    sprites: {
      static: p.sprites.front_default,
      artwork: (other['official-artwork'] || {}).front_default || null,
      animated: (other.showdown || {}).front_default || (bw.animated || {}).front_default || null,
    },
    moves: sortMoves(moves), movesFrom: vg,
    allMoves: p.moves.map((m) => m.move.name),   // every move it learns in any game
    games: [...games], source: 'live',
  };
}

// Offline pack entry -> same shape as fromLive
function fromPack(pack, id) {
  const e = pack.p[id];
  const [hp, attack, defense, spAtk, spDef, speed] = e.st;
  const cls = ['', 'status', 'physical', 'special'];
  return {
    id, speciesId: e.s, dex: e.s, slug: e.k, name: e.n, genus: e.g, gen: e.gen, origin: originFor(id, e.gen),
    types: e.t.map((t) => pack.types[t]),
    stats: { hp, attack, defense, spAtk, spDef, speed },
    abilities: e.ab.map(([aid, hidden]) => ({ name: (pack.abilities[aid] || [])[1] || '?', hidden: !!hidden })),
    height: e.h, weight: e.w,
    sprites: { static: null, artwork: null, animated: null },
    moves: sortMoves(e.mv.map(([mid, meth, level]) => {
      const m = pack.moves[mid] || [];
      return { key: m[0], name: m[1], type: pack.types[m[2]], cls: cls[m[3]], power: m[4], method: pack.methods[meth], level };
    })),
    movesFrom: e.vg, games: e.gm, source: 'pack',
    allMoves: [...e.mv.map(([mid]) => mid), ...(e.mx || [])].map((mid) => (pack.moves[mid] || [])[0]).filter(Boolean),
  };
}

async function fetchLive(key) {
  let poke;
  try {
    poke = await fetchJSON(`${API}/pokemon/${key}`);
  } catch (e) {
    if (e.kind !== 'not_found') throw e;
    // Names like "deoxys" or "urshifu" only exist as species; follow the default variety.
    const sp = await fetchJSON(`${API}/pokemon-species/${key}`);
    const variety = sp.varieties.find((v) => v.is_default) || sp.varieties[0];
    poke = await fetchJSON(variety.pokemon.url);
  }
  let species = null;
  try { species = await fetchJSON(poke.species.url, { retries: 0 }); } catch { /* species extras are optional */ }
  return fromLive(poke, species);
}

const pokemonCache = new Map();
// query: number (PokeAPI id) or free text. Resolves to the normalized Pokémon object.
function fetchPokemon(query) {
  const id = typeof query === 'number' ? query : /^\d+$/.test(String(query)) ? parseInt(query, 10) : null;
  const slug = id ? String(id) : searchKey(query) && String(query).trim().toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/♀/g, '-f').replace(/♂/g, '-m')
    .replace(/[.'’:]/g, '').replace(/[\s_]+/g, '-');
  if (!slug) return Promise.reject(new ApiError('not_found', 'Empty search'));
  if (pokemonCache.has(slug)) return pokemonCache.get(slug);

  const job = (async () => {
    let liveError = null;
    if (Date.now() >= apiHealth.offlineUntil) {
      try { return await fetchLive(slug); } catch (e) {
        liveError = e;
        if (e.kind === 'not_found' && !id) throw e;
        if (e.kind === 'network' || e.kind === 'timeout') apiHealth.offlineUntil = Date.now() + 2 * 60 * 1000;
      }
    }
    const pack = await loadPack();
    if (pack && id && pack.p[id]) return fromPack(pack, id);
    if (liveError && liveError.kind === 'not_found') throw liveError;
    throw new ApiError(liveError ? liveError.kind : 'network',
      pack ? 'This Pokémon is not in the offline pack and PokeAPI is unreachable.' : 'Could not reach PokeAPI.');
  })();
  pokemonCache.set(slug, job);
  job.catch(() => pokemonCache.delete(slug));
  return job;
}

// Which data source is answering? Also learns the live species count, so Gen 10 appears on its own.
function useDexSource() {
  const [source, setSource] = useState({ status: 'checking', count: BASE_SPECIES.length });
  const check = useCallback(async () => {
    setSource((s) => ({ ...s, status: 'checking' }));
    try {
      const data = await fetchJSON(`${API}/pokemon-species?limit=1`, { timeout: 8000, retries: 0 });
      apiHealth.offlineUntil = 0;
      setSource({ status: 'live', count: data.count });
    } catch {
      apiHealth.offlineUntil = Date.now() + 2 * 60 * 1000;
      const pack = await loadPack();
      setSource({ status: pack ? 'pack' : 'offline', count: BASE_SPECIES.length });
    }
  }, []);
  useEffect(() => { check(); }, [check]);
  return [source, check];
}

function useSpeciesList(source) {
  const [extras, setExtras] = useState(() => {
    try { const c = JSON.parse(safeStorage.get(EXTRA_SPECIES_KEY) || 'null'); return Array.isArray(c && c.names) ? c.names : []; }
    catch { return []; }
  });
  useEffect(() => {
    const known = BASE_SPECIES.length + extras.length;
    if (source.status !== 'live' || source.count <= known) return;
    let cancelled = false;
    fetchJSON(`${API}/pokemon-species?offset=${BASE_SPECIES.length}&limit=${source.count - BASE_SPECIES.length}`)
      .then((data) => {
        if (cancelled) return;
        const names = data.results.map((r) => prettify(r.name));
        setExtras(names);
        safeStorage.set(EXTRA_SPECIES_KEY, JSON.stringify({ names, at: Date.now() }));
      })
      .catch(() => {});
    return () => { cancelled = true; };
  }, [source.status, source.count]); // eslint-disable-line react-hooks/exhaustive-deps

  return useMemo(() => [
    ...BASE_SPECIES,
    ...extras.map((name, i) => {
      const id = BASE_SPECIES.length + i + 1;
      return { id, dex: id, name, sk: searchKey(name), kind: 'species', future: true };
    }),
  ], [extras]);
}

/* ---------------------------------------------------------------------
   6. SPRITES (live GitHub sprites, else the offline atlas, else a Poké Ball)
   --------------------------------------------------------------------- */
const SpriteContext = createContext('probing');

function useSpriteMode() {
  const [mode, setMode] = useState('probing');
  useEffect(() => {
    let settled = false;
    const finish = (m) => { if (!settled) { settled = true; setMode(m); } };
    const tryAtlas = () => {
      const a = new Image();
      a.onload = () => finish('atlas');
      a.onerror = () => finish('none');
      a.src = PACK_DIR + 'sprites.webp';
    };
    const probe = new Image();
    const timer = setTimeout(tryAtlas, 6000);
    probe.onload = () => { clearTimeout(timer); finish('live'); };
    probe.onerror = () => { clearTimeout(timer); tryAtlas(); };
    probe.src = `${SPRITES}/25.png`;
    return () => clearTimeout(timer);
  }, []);
  return mode;
}

function PokeballGlyph({ className = '' }) {
  return (

// Fills its container (square). Pass size for a fixed pixel box.
// female: show the female sprite when the species looks different by gender.
function Sprite({ id, size, className = '', alt = '', female = false }) {
  const mode = useContext(SpriteContext);
  const [failed, setFailed] = useState(0);         // 1 = female sprite failed, 2 = normal sprite failed
  useEffect(() => setFailed(0), [id, female]);
  const useFemale = female && FEMALE_SPRITES.has(id) && failed === 0;
  const box = size ? { width: size, height: size } : { width: '100%', aspectRatio: '1 / 1' };
  if (mode === 'probing') return <span className="skeleton block" style={box} aria-hidden="true" />;
  if (mode === 'live' && failed < 2) {
    const src = useFemale ? `${SPRITES}/female/${id}.png` : `${SPRITES}/${id}.png`;
    return <img src={src} alt={alt} loading="lazy" decoding="async" onError={() => setFailed(useFemale ? 1 : 2)}
      className={`sprite ${className}`} style={{ ...box, objectFit: 'contain' }} />;
  }
  const idx = ATLAS_INDEX.get(useFemale ? `f${id}` : id);
  if (mode === 'atlas' && idx != null) {
    const col = idx % ATLAS_COLS;
    const row = Math.floor(idx / ATLAS_COLS);
    return (
      <span role={alt ? 'img' : undefined} aria-label={alt || undefined} aria-hidden={alt ? undefined : 'true'}
        className={`sprite ${className}`}
        style={{
          ...box,
          backgroundImage: `url(${PACK_DIR}sprites.webp)`,
          backgroundSize: `${ATLAS_COLS * 100}% ${ATLAS_ROWS * 100}%`,
          backgroundPosition: `${(col / (ATLAS_COLS - 1)) * 100}% ${(row / (ATLAS_ROWS - 1)) * 100}%`,
        }} />
    );
  }
  return <span className={`grid text-vault-faint ${className}`} style={box} role={alt ? 'img' : undefined} aria-label={alt || undefined}><PokeballGlyph /></span>;
}

/* ---------------------------------------------------------------------
   7. NATURE RECOMMENDER
   Rule: raise the best useful stat, lower the attacking stat it won't use.
   Mixed attackers drop a defense instead; walls pair Def/Sp. Def;
   very slow attackers get a Trick Room option.
   --------------------------------------------------------------------- */
const STAT_LABEL = { hp: 'HP', attack: 'Attack', defense: 'Defense', spAtk: 'Sp. Atk', spDef: 'Sp. Def', speed: 'Speed' };
const STAT_SHORT = { hp: 'HP', attack: 'Atk', defense: 'Def', spAtk: 'SpA', spDef: 'SpD', speed: 'Spe' };
const NATURE_TABLE = {
  attack:  { defense: 'Lonely', speed: 'Brave',   spAtk: 'Adamant', spDef: 'Naughty' },
  defense: { attack: 'Bold',    speed: 'Relaxed', spAtk: 'Impish',  spDef: 'Lax' },
  speed:   { attack: 'Timid',   defense: 'Hasty', spAtk: 'Jolly',   spDef: 'Naive' },
  spAtk:   { attack: 'Modest',  defense: 'Mild',  speed: 'Quiet',   spDef: 'Rash' },
  spDef:   { attack: 'Calm',    defense: 'Gentle', speed: 'Sassy',  spAtk: 'Careful' },
};
const TIE_PRIORITY = { speed: 0, attack: 1, spAtk: 1, defense: 2, spDef: 2 };

function recommendNatures(stats) {
  const s = stats;
  const make = (plus, minus, reason) => ({ name: NATURE_TABLE[plus][minus], plus, minus, reason });
  const mixed = Math.abs(s.attack - s.spAtk) <= 10 && Math.min(s.attack, s.spAtk) >= 80;

  if (mixed) {
    const plus = ['speed', 'attack', 'spAtk'].sort((a, b) => s[b] - s[a] || TIE_PRIORITY[a] - TIE_PRIORITY[b])[0];
    const [weak, other] = s.defense <= s.spDef ? ['defense', 'spDef'] : ['spDef', 'defense'];
    const why = `Attack (${s.attack}) and Sp. Atk (${s.spAtk}) are both usable, so keep both and trade away a defense.`;
    return [
      make(plus, weak, `${why} ${STAT_LABEL[weak]} (${s[weak]}) is the weaker one.`),
      make(plus, other, `Same mixed plan, keeping ${STAT_LABEL[weak]} instead if you expect ${weak === 'defense' ? 'physical' : 'special'} hits.`),
    ];
  }

  const dump = s.attack < s.spAtk ? 'attack' : s.spAtk < s.attack ? 'spAtk' : 'attack';
  const ranked = ['attack', 'defense', 'spAtk', 'spDef', 'speed']
    .filter((k) => k !== dump)
    .sort((a, b) => s[b] - s[a] || TIE_PRIORITY[a] - TIE_PRIORITY[b]);
  const dumpWhy = `${STAT_LABEL[dump]} (${s[dump]}) goes unused`;
  const first = make(ranked[0], dump, `Raises ${STAT_LABEL[ranked[0]]} (${s[ranked[0]]}), its best stat. ${dumpWhy}.`);

  // A true wall (best stat is a defense, no attacking stat reaching 100) pairs Def and Sp. Def.
  const isWall = (ranked[0] === 'defense' || ranked[0] === 'spDef') && Math.max(s.attack, s.spAtk) < 100;
  if (isWall) {
    const other = ranked[0] === 'defense' ? 'spDef' : 'defense';
    return [first, make(other, dump, `Wall set for the other side: raises ${STAT_LABEL[other]} (${s[other]}). ${dumpWhy}.`)];
  }
  if (s.speed <= 50 && ranked[0] !== 'speed') {
    return [first, make(ranked[0], 'speed', `Trick Room option: Speed (${s.speed}) is low, so make it lower and hit harder.`)];
  }
  return [first, make(ranked[1], dump, `Raises ${STAT_LABEL[ranked[1]]} (${s[ranked[1]]}), its next best stat. ${dumpWhy}.`)];
}

function textOn(hex) {
  const n = parseInt(hex.slice(1), 16);
  const [r, g, b] = [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  return (0.299 * r + 0.587 * g + 0.114 * b) > 150 ? 'var(--on-light)' : '#ffffff';
}

function TypeChip({ type, small = false }) {
  const bg = TYPE_COLORS[type] || '#64748b';
  return (

      style={{ background: bg, color: textOn(bg) }}>
      {type}
    </span>
  );
}

}

function GuardianSprite({ guardian }) {

function CompletionRing({ pct }) {
  const r = 54;
  const c = 2 * Math.PI * r;
  const [shown, setShown] = useState(0);
  useEffect(() => { const t = requestAnimationFrame(() => setShown(pct)); return () => cancelAnimationFrame(t); }, [pct]);
  return (
    <svg viewBox="0 0 132 132" className="h-32 w-32 shrink-0" role="img" aria-label={`${pct.toFixed(1)} percent of the National Dex caught`}>

      <circle cx="66" cy="66" r={r} fill="none" stroke="var(--ember)" strokeWidth="11" strokeLinecap="round"
        strokeDasharray={c} strokeDashoffset={c * (1 - shown / 100)} transform="rotate(-90 66 66)" className="ring-progress" />
      <text x="66" y="64" textAnchor="middle" fill="var(--fg)" style={{ font: '700 26px var(--font-display)' }}>
        {pct >= 99.95 && pct < 100 ? '99.9' : pct.toFixed(1)}
      </text>
      <text x="66" y="84" textAnchor="middle" fill="var(--muted)" style={{ font: '600 10px var(--font-display)', letterSpacing: '0.14em' }}>PERCENT</text>

}

function GuardianHero({ guardian, onSave, stats, index }) {
  const [editing, setEditing] = useState(false);
  const [draft, setDraft] = useState(guardian);
  const [saving, setSaving] = useState(false);
  const [error, setError] = useState('');
  const suggestions = useMemo(() => index.all, [index]);

  useEffect(() => { if (!editing) setDraft(guardian); }, [guardian, editing]);

  async function save(e) {
    e.preventDefault();
    const nickname = String(draft.nickname).trim().slice(0, NICKNAME_MAX) || guardian.nickname;
    const level = clampLevel(draft.level);
    const typed = String(draft.species).trim();
    setError('');
    if (!typed || searchKey(typed) === searchKey(guardian.species)) {
      onSave({ ...guardian, nickname, level });
      setEditing(false);
      return;
    }
    const entry = resolveQuery(typed, index);
    setSaving(true);
    try {
      const p = await fetchPokemon(entry ? entry.id : typed);
      onSave({
        nickname, level, pokemonId: p.id, species: p.name, types: p.types, origin: p.origin,
        sprite: p.sprites.animated || p.sprites.static || null,
      });
      setEditing(false);
    } catch (err) {
      setError(err.kind === 'not_found'
        ? `No Pokémon called “${typed}”. Check the spelling or enter a Dex number.`
        : `Couldn't load ${typed}: ${err.message} Your guardian wasn't changed.`);
    } finally {
      setSaving(false);
    }
  }

  return (
    <section className="panel relative min-w-0 overflow-hidden" aria-labelledby="guardian-title">
      <div className="grid gap-6 p-5 sm:p-7 lg:grid-cols-[minmax(0,1fr)_auto] lg:items-center">

          <div className="min-w-0 flex-1">
            <p className="eyebrow flex items-center gap-2"><Shield size={14} style={{ color: 'var(--ember)' }} /> Guardian of the Vault</p>

            {!editing ? (
              <>
                <h1 id="guardian-title" className="font-display mt-1 text-4xl font-bold uppercase leading-none tracking-wide sm:text-5xl">{guardian.nickname}</h1>
                <p className="mt-2 text-vault-muted">
                  <span className="mono text-vault-fg">Lv. {guardian.level}</span>
                  <span className="mx-2 text-vault-faint">/</span>{guardian.species}
                  <span className="mx-2 text-vault-faint">/</span><span className="mono">{pad4(guardian.pokemonId > 10000 ? (index.byId.get(guardian.pokemonId) || {}).dex || 0 : guardian.pokemonId)}</span>
                </p>
                <div className="mt-3 flex flex-wrap items-center gap-2">
                  {guardian.types.map((t) => <TypeChip key={t} type={t} />)}
                  {guardian.origin && <span className="eyebrow ml-1">{guardian.origin} origin</span>}
                </div>
                <button type="button" className="btn mt-4" onClick={() => { setDraft(guardian); setEditing(true); }} aria-expanded="false">
                  <Pencil size={14} /> Edit Guardian
                </button>
              </>
            ) : (
              <form onSubmit={save} className="mt-2 grid gap-3 sm:max-w-md" aria-label="Edit guardian">
                <div className="grid grid-cols-[minmax(0,1fr)_88px] gap-3">
                  <label className="grid gap-1 text-xs text-vault-muted">Nickname
                    <input id="g-nick" className="field" maxLength={NICKNAME_MAX} value={draft.nickname}
                      onChange={(e) => setDraft({ ...draft, nickname: e.target.value })} />
                  </label>
                  <label className="grid gap-1 text-xs text-vault-muted">Level
                    <input id="g-level" className="field mono" type="number" min="1" max="100" value={draft.level}
                      onChange={(e) => setDraft({ ...draft, level: e.target.value })} />
                  </label>
                </div>
                <label className="grid gap-1 text-xs text-vault-muted">Species (name or Dex #)
                  <input id="g-species" className="field" list="guardian-species" value={draft.species} autoComplete="off"
                    onChange={(e) => setDraft({ ...draft, species: e.target.value })} />
                  <datalist id="guardian-species">{suggestions.map((s) => <option key={s.id} value={s.name} />)}</datalist>
                </label>
                <p className="text-xs text-vault-faint">Nicknames cap at {NICKNAME_MAX} characters, the same limit HOME uses.</p>
                {error && <p role="alert" className="flex items-start gap-2 text-sm text-vault-bad"><AlertTriangle size={16} className="mt-0.5 shrink-0" />{error}</p>}
                <div className="flex gap-2">
                  <button type="submit" className="btn btn-ember" disabled={saving}>
                    {saving ? <Loader2 size={14} className="spin" /> : <Check size={14} />} {saving ? 'Fetching sprite…' : 'Save Guardian'}
                  </button>
                  <button type="button" className="btn" onClick={() => { setEditing(false); setError(''); }} disabled={saving}><X size={14} /> Cancel</button>
                </div>
              </form>
            )}
          </div>
        </div>

        <div className="flex items-center gap-5 rounded-2xl border border-vault-line bg-vault-bg p-4 sm:p-5">
          <CompletionRing pct={stats.pct} />
          <dl className="grid gap-2.5 text-sm">
            <div><dt className="eyebrow">National Dex</dt><dd className="mono text-lg font-semibold">{stats.caught} <span className="text-vault-faint">/ {stats.total}</span></dd></div>
            <div><dt className="eyebrow">Regional forms</dt><dd className="mono">{stats.formsCaught} <span className="text-vault-faint">/ {stats.formsTotal}</span></dd></div>
            <div><dt className="eyebrow">Boxes complete</dt><dd className="mono">{stats.boxesDone} <span className="text-vault-faint">/ {stats.boxesTotal}</span></dd></div>
          </dl>
        </div>
      </div>
    </section>
  );
}

/* ---------------------------------------------------------------------
   11. BOX MANAGER (5 x 6 HOME grid + pagination)
   --------------------------------------------------------------------- */
function BoxStrip({ boxes, caught, current, onPick }) {
  const ref = useRef(null);
  // Centre the active chip by scrolling the strip itself, never the page.
  useEffect(() => {
    const strip = ref.current;
    const el = strip && strip.querySelector('[aria-current="true"]');
    if (!el) return;
    const left = el.offsetLeft - strip.offsetLeft - (strip.clientWidth - el.clientWidth) / 2;
    try { strip.scrollTo({ left, behavior: 'smooth' }); } catch { strip.scrollLeft = left; }
  }, [current]);
  const spineLast = boxes.filter((b) => b.kind === 'spine').length;
  return (
    <div ref={ref} className="strip -mx-1 flex gap-1.5 overflow-x-auto px-1 pb-2" role="list" aria-label="All boxes">
      {boxes.map((b) => {
        const filled = b.slots.filter(Boolean);
        const n = filled.filter((e) => caught[e.id]).length;
        const pct = filled.length ? n / filled.length : 0;
        const chip = (
          <button key={b.number} role="listitem" type="button" className="chip-box" aria-current={b.number === current ? 'true' : 'false'}
            onClick={() => onPick(b.number)} title={`HOME ${b.number}: ${b.label || ''} (${n}/${filled.length})`}>
            <span className="mono block text-[11px] font-semibold">{b.number}</span>
            <span className="mt-1 block h-1 overflow-hidden rounded-full bg-vault-line">
              <span className="block h-full rounded-full" style={{ width: `${pct * 100}%`, background: pct === 1 ? 'var(--ok)' : (b.color || 'var(--ember)') }} />
            </span>
          </button>
        );
        if (b.number === ANNEX_BOXES[0].box) {
          return [
            <span key="runway" className="chip-box flex items-center border-dashed text-[10px] text-vault-faint" role="listitem"
              title={`HOME ${spineLast + 1}–${RUNWAY_LAST_BOX} stay empty so future species extend the National Dex without moving anything`}>
              <span className="mono">{spineLast + 1}–{RUNWAY_LAST_BOX}<br />runway</span>
            </span>,
            chip,
          ];
        }
        return chip;
      })}
    </div>
  );
}

// "Thalaivar the Charizard ♂ · Flamethrower, Air Slash" (used for tooltips and screen readers)
function describeRecord(entry, rec) {
  if (!rec) return entry.name;
  const who = rec.nickname ? `${rec.nickname} the ${entry.name}` : entry.name;
  const g = rec.gender && rec.gender !== 'genderless' ? ` ${GENDERS[rec.gender].symbol}` : '';
  const moves = rec.moves && rec.moves.length ? ` · ${rec.moves.map(moveName).join(', ')}` : '';
  return `${who}${g}${moves}`;
}

function Slot({ entry, index, futureDex, record, highlighted, onActivate, mode }) {
  const row = Math.floor(index / BOX_COLS) + 1;
  const col = (index % BOX_COLS) + 1;
  if (!entry) {
    return <div className="slot-empty" title={futureDex ? `${pad4(futureDex)} lands here` : `Slot ${index + 1} is open for a future form`}>
      {futureDex ? pad4(futureDex).slice(1) : ''}
    </div>;
  }
  const isCaught = !!record;
  const status = !isCaught ? 'empty' : hasDetails(record) ? 'registered' : 'caught, no details yet';
  const action = mode === 'quick' && !hasDetails(record) ? (isCaught ? 'Click to unmark.' : 'Click to mark caught.') : (isCaught ? 'Click to edit.' : 'Click to register.');
  const label = `${describeRecord(entry, record)}, ${pad4(entry.dex)}, slot ${index + 1} (row ${row}, column ${col}), ${status}. ${action}`;
  const gender = record && record.gender && record.gender !== 'genderless' ? GENDERS[record.gender] : null;
  return (
    <button type="button" className={`slot ${isCaught ? 'is-caught' : ''} ${highlighted ? 'is-hl' : ''}`}
      aria-label={label} title={`${describeRecord(entry, record)}\n${pad4(entry.dex)} · row ${row}, col ${col}`} onClick={() => onActivate(entry)}>
      <Sprite id={entry.id} female={record && record.gender === 'female'} className={isCaught ? '' : 'silhouette'} />
      <span className="slot-num">{entry.dex}</span>
      {gender && <span className="slot-gender" style={{ color: gender.color }} aria-hidden="true">{gender.symbol}</span>}
      {isCaught && (
        <span className={`slot-check ${hasDetails(record) ? '' : 'is-quick'}`} aria-hidden="true">
          <Check size={10} strokeWidth={3.5} />
        </span>
      )}
    </button>
  );
}

function BoxManager({ boxes, caught, currentBox, setCurrentBox, clickMode, setClickMode, onToggle, onSetMany, onOpenSlot, index, highlight, setHighlight }) {
  const box = boxes.find((b) => b.number === currentBox) || boxes[0];
  const pos = boxes.indexOf(box);
  const [confirm, setConfirm] = useState(null);
  const [jump, setJump] = useState('');
  const [jumpError, setJumpError] = useState('');

  useEffect(() => { setConfirm(null); }, [currentBox]);
  useEffect(() => {
    if (highlight == null) return;
    const t = setTimeout(() => setHighlight(null), 2600);
    return () => clearTimeout(t);
  }, [highlight, setHighlight]);

  const go = (delta) => setCurrentBox(boxes[(pos + delta + boxes.length) % boxes.length].number);
  const filled = box.slots.filter(Boolean);
  const caughtHere = filled.filter((e) => caught[e.id]).length;
  const registeredHere = filled.filter((e) => hasDetails(caught[e.id])).length;

  function doJump(e) {
    e.preventDefault();
    const entry = resolveQuery(jump, index);
    if (!entry) { setJumpError(`Nothing matches “${jump}”.`); return; }
    const loc = locate(entry, boxes);
    if (!loc) { setJumpError(`${entry.name} has no box yet.`); return; }
    setJumpError('');
    setCurrentBox(loc.box);
    setHighlight(entry.id);
    setJump('');
  }

  // Register mode opens the slot form. Quick mark toggles, but never wipes a slot that has details.
  function activate(entry) {
    if (clickMode === 'quick' && !hasDetails(caught[entry.id])) onToggle(entry.id);
    else onOpenSlot(entry.id);
  }

  return (
    <section className="panel min-w-0 p-4 sm:p-5" aria-labelledby="box-title">
      <div className="flex flex-wrap items-center justify-between gap-3">
        <div>
          <p className="eyebrow">{box.kind === 'spine' ? 'National Spine' : box.kind === 'annex' ? 'Regional Annex' : 'Reserved'}</p>
          <h2 id="box-title" className="font-display text-2xl font-bold uppercase tracking-wide">HOME {box.number}</h2>
        </div>
        <div className="flex rounded-xl border border-vault-line bg-vault-bg p-1 text-xs font-semibold" role="radiogroup" aria-label="What clicking a slot does">
          {[['register', <PenLine key="i" size={14} />, 'Register'], ['quick', <CheckCheck key="i" size={14} />, 'Quick mark']].map(([mode, icon, text]) => (
            <button key={mode} type="button" role="radio" aria-checked={clickMode === mode} onClick={() => setClickMode(mode)}
              className="flex items-center gap-1.5 rounded-lg px-3 py-1.5"
              style={clickMode === mode ? { background: 'var(--panel-2)', color: 'var(--fg)' } : { color: 'var(--muted)' }}>
              {icon}{text}
            </button>
          ))}
        </div>
      </div>

      <div className="mt-4 flex items-center gap-2">
        <button type="button" className="btn shrink-0 px-2" onClick={() => go(-1)} aria-label="Previous box"><ChevronLeft size={18} /></button>
        <div className="min-w-0 flex-1 text-center">
          <p className="truncate font-semibold" style={{ color: box.color || 'var(--fg)' }}>{box.label || 'Open slots'}</p>
          <p className="mono text-xs text-vault-muted">{box.range} · {caughtHere}/{filled.length} caught{registeredHere ? ` · ${registeredHere} registered` : ''}</p>
        </div>
        <button type="button" className="btn shrink-0 px-2" onClick={() => go(1)} aria-label="Next box"><ChevronRight size={18} /></button>
      </div>

      <div className="box-frame mt-3">
        <div className="box-grid">
          {box.slots.map((entry, i) => (
            <Slot key={entry ? entry.id : `empty-${box.number}-${i}`} entry={entry} index={i} mode={clickMode}
              futureDex={box.kind === 'spine' && !entry ? box.firstDex + i : null}
              record={entry ? caught[entry.id] : null} highlighted={entry && entry.id === highlight} onActivate={activate} />
          ))}
        </div>
        <p className="relative mt-2.5 flex items-start gap-1.5 text-xs text-vault-muted">
          <Info size={13} className="mt-px shrink-0" />
          {clickMode === 'quick'
            ? 'Click a slot to mark it caught or unmark it. Slots with a nickname, gender or moves open the form instead, so details are never lost.'
            : 'Click a slot to register a Pokémon or edit its nickname, gender and moves. A hollow check means caught but no details yet.'}
        </p>
        {box.kind === 'reserved' && (
          <p className="relative mt-3 text-center text-xs text-vault-muted">Kept empty. When the next game adds a regional set, its forms go here and nothing else moves.</p>
        )}
      </div>

      <div className="mt-3"><BoxStrip boxes={boxes} caught={caught} current={box.number} onPick={setCurrentBox} /></div>

      <div className="mt-3 flex flex-col gap-3 sm:flex-row sm:flex-wrap sm:items-start sm:justify-between">
        <form onSubmit={doJump} className="flex min-w-0 flex-wrap items-center gap-2 sm:flex-1" aria-label="Jump to a Pokémon's slot">
          <label htmlFor="jump" className="sr-only">Jump to Dex number or name</label>
          <div className="relative min-w-0 flex-1 sm:max-w-[240px]">
            <Crosshair size={14} className="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-vault-faint" />
            <input id="jump" className="field pl-8" placeholder="Find slot: 25 or Pikachu" value={jump} onChange={(e) => { setJump(e.target.value); setJumpError(''); }} />
          </div>
          <button type="submit" className="btn">Go</button>
          {jumpError && <span role="alert" className="w-full text-xs text-vault-bad">{jumpError}</span>}
        </form>

        {filled.length > 0 && (
          !confirm ? (
            <div className="flex gap-2">
              <button type="button" className="btn" onClick={() => setConfirm('fill')}><CheckCheck size={14} /> Mark box caught</button>
              <button type="button" className="btn" onClick={() => setConfirm('clear')}><Eraser size={14} /> Clear box</button>
            </div>
          ) : (
            <div className="flex flex-wrap items-center gap-2 rounded-xl border border-vault-line bg-vault-bg px-3 py-2 text-sm" role="alertdialog" aria-label="Confirm box change">
              <span>{confirm === 'fill'
                ? `Mark all ${filled.length} in HOME ${box.number} as caught? Existing details are kept.`
                : `Clear all ${caughtHere} caught in HOME ${box.number}?${registeredHere ? ` This deletes the nickname, gender and moves of ${registeredHere} registered Pokémon.` : ''}`}</span>
              <button type="button" className="btn btn-ember" onClick={() => { onSetMany(filled.map((e) => e.id), confirm === 'fill'); setConfirm(null); }}>
                {confirm === 'fill' ? 'Mark caught' : 'Clear'}
              </button>
              <button type="button" className="btn" onClick={() => setConfirm(null)}>Cancel</button>
            </div>
          )
        )}
      </div>
    </section>
  );
}

/* ---------------------------------------------------------------------
   12. OMNIDEX (search + browse)
   --------------------------------------------------------------------- */
function Omnidex({ index, species, gens, caught, onOpen }) {
  const [query, setQuery] = useState('');
  const [filter, setFilter] = useState('1');
  const [open, setOpen] = useState(false);
  const [active, setActive] = useState(0);
  const suggestions = useMemo(() => searchIndex(query, index, 8), [query, index]);
  const results = useMemo(() => {
    if (query.trim()) return searchIndex(query, index, 400);
    if (filter === 'forms') return REGIONAL;
    if (filter === 'other') return index.all.filter((e) => e.kind === 'variety');
    if (filter === 'mega') return index.all.filter((e) => e.kind === 'mega');
    if (filter === 'all') return index.all;
    const g = gens.find((x) => String(x.gen) === filter);
    return g ? species.filter((s) => s.dex >= g.start && s.dex <= g.end) : [];
  }, [query, filter, index, species, gens]);

  useEffect(() => setActive(0), [query]);

  function submit(e) {
    e.preventDefault();
    const pick = suggestions[active] || resolveQuery(query, index);
    if (pick) { onOpen({ id: pick.id, name: pick.name }); setOpen(false); return; }
    if (query.trim()) { onOpen({ query: query.trim(), name: query.trim() }); setOpen(false); } // let PokeAPI try (e.g. "deoxys-attack")
  }

  function onKeyDown(e) {
    if (!open || !suggestions.length) return;
    if (e.key === 'ArrowDown') { e.preventDefault(); setActive((a) => (a + 1) % suggestions.length); }
    if (e.key === 'ArrowUp') { e.preventDefault(); setActive((a) => (a - 1 + suggestions.length) % suggestions.length); }
    if (e.key === 'Escape') setOpen(false);
  }

  function random() {
    const pick = index.all[Math.floor(Math.random() * index.all.length)];
    onOpen({ id: pick.id, name: pick.name });
  }

  const chips = [['all', 'All'], ...gens.map((g) => [String(g.gen), g.roman]), ['forms', 'Regional'], ['other', 'Other forms'], ['mega', 'Mega']];

  return (
    <div className="grid min-w-0 gap-5">
      <section className="panel min-w-0 p-5 sm:p-6" aria-labelledby="omni-title">
        <p className="eyebrow">The {index.all.length.toLocaleString()} database</p>
        <h1 id="omni-title" className="font-display mt-1 text-3xl font-bold uppercase tracking-wide">Omnidex</h1>
        <form onSubmit={submit} className="relative mt-4" role="search">
          <label htmlFor="omni-search" className="sr-only">Search by name or National Dex number</label>
          <Search size={18} className="pointer-events-none absolute left-4 top-1/2 -translate-y-1/2 text-vault-faint" />
          <input id="omni-search" className="field h-14 rounded-2xl pl-12 pr-36 text-base" autoComplete="off"
            placeholder="Search Pikachu, #0445, Mr. Mime, Hisuian Zorua…"
            value={query} onChange={(e) => { setQuery(e.target.value); setOpen(true); }}
            onFocus={() => setOpen(true)} onBlur={() => setTimeout(() => setOpen(false), 150)} onKeyDown={onKeyDown}
            role="combobox" aria-expanded={open && suggestions.length > 0} aria-controls="omni-suggest" aria-autocomplete="list" />
          <div className="absolute right-2 top-1/2 flex -translate-y-1/2 gap-1.5">
            <button type="button" className="btn btn-quiet" onClick={random} title="Open a random Pokémon"><Shuffle size={15} /><span className="hidden sm:inline">Random</span></button>
            <button type="submit" className="btn btn-ember">Search</button>
          </div>
          {open && suggestions.length > 0 && (
            <ul id="omni-suggest" role="listbox" className="absolute left-0 right-0 top-[calc(100%+6px)] z-30 overflow-hidden rounded-2xl border border-vault-line bg-vault-panel shadow-2xl">
              {suggestions.map((s, i) => (
                <li key={s.id} role="option" aria-selected={i === active}>
                  <button type="button" onMouseDown={(e) => e.preventDefault()} onClick={() => { onOpen({ id: s.id, name: s.name }); setOpen(false); }}
                    className="flex w-full items-center gap-3 px-3 py-2 text-left" style={i === active ? { background: 'var(--panel-2)' } : undefined}>
                    <span className="h-10 w-10 shrink-0"><Sprite id={s.id} /></span>
                    <span className="mono w-14 text-xs text-vault-muted">{pad4(s.dex)}</span>
                    <span className="flex-1 font-semibold">{s.name}</span>
                    {caught[s.id] && <span className="eyebrow" style={{ color: 'var(--ok)' }}>Caught</span>}
                  </button>
                </li>
              ))}
            </ul>
          )}
        </form>
        <div className="mt-4 flex flex-wrap gap-1.5" role="tablist" aria-label="Filter by generation">
          {chips.map(([key, text]) => (
            <button key={key} type="button" role="tab" aria-selected={!query && filter === key} onClick={() => { setFilter(key); setQuery(''); }}
              className="rounded-lg border px-3 py-1.5 text-xs font-semibold"
              style={!query && filter === key ? { borderColor: 'var(--ember)', background: 'var(--ember-soft)', color: 'var(--fg)' } : { borderColor: 'var(--line)', color: 'var(--muted)' }}>
              {text}
            </button>
          ))}
        </div>
      </section>

      <section className="min-w-0" aria-label="Results">
        <p className="mb-3 text-sm text-vault-muted">
          {query.trim() ? `${results.length} match${results.length === 1 ? '' : 'es'} for “${query.trim()}” across every generation` : `${results.length} Pokémon`}
          {query.trim() && results.length === 0 && ' · press Search to ask PokeAPI directly'}
        </p>
        <ul className="grid gap-2 [grid-template-columns:repeat(auto-fill,minmax(118px,1fr))]">
          {results.map((e) => (
            <li key={e.id}>
              <button type="button" onClick={() => onOpen({ id: e.id, name: e.name })}
                className="group relative flex w-full flex-col items-center rounded-xl border border-vault-line bg-vault-panel px-2 pb-3 pt-2 text-center transition hover:border-vault-linehi">
                <span className="w-16"><Sprite id={e.id} alt="" /></span>
                <span className="mono text-[11px] text-vault-faint">{pad4(e.dex)}</span>
                <span className="mt-0.5 line-clamp-2 text-sm font-semibold leading-tight">{e.name}</span>
                {caught[e.id] && <span className="absolute right-2 top-2 h-2 w-2 rounded-full bg-vault-ok" title="Caught" />}
              </button>
            </li>
          ))}
        </ul>
      </section>
    </div>
  );
}

const statColor = (v) => (v < 50 ? '#f87171' : v < 80 ? '#fbbf24' : v < 100 ? '#a3e635' : v < 130 ? '#34d399' : '#22d3ee');
const METHOD_LABEL = { 'level-up': 'Level', machine: 'TM', egg: 'Egg', tutor: 'Tutor' };

function DetailSkeleton() {
  return (
    <div className="grid gap-5 p-5 sm:p-7" aria-busy="true" aria-label="Loading Pokémon data">
      <div className="flex gap-5"><div className="skeleton h-36 w-36 shrink-0 rounded-2xl" /><div className="grid flex-1 gap-3"><div className="skeleton h-4 w-24" /><div className="skeleton h-9 w-56" /><div className="skeleton h-6 w-40" /></div></div>
      <div className="grid gap-5 md:grid-cols-2">
        <div className="grid gap-3">{Array.from({ length: 6 }, (_, i) => <div key={i} className="skeleton h-5" />)}</div>
        <div className="grid gap-3"><div className="skeleton h-24" /><div className="skeleton h-24" /></div>
      </div>
      <div className="skeleton h-48" />

}

function Artwork({ data }) {
  const mode = useContext(SpriteContext);
  const [failed, setFailed] = useState(false);
  useEffect(() => setFailed(false), [data.id]);
  const src = data.sprites.artwork || data.sprites.static;
  if (mode === 'live' && src && !failed) return <img src={src} alt={data.name} onError={() => setFailed(true)} className="h-full w-full object-contain" />;
  return <Sprite id={data.id} alt={data.name} />;
}

function MoveList({ moves, movesFrom }) {
  const [tab, setTab] = useState('all');
  const [q, setQ] = useState('');
  const counts = useMemo(() => moves.reduce((acc, m) => { acc[m.method] = (acc[m.method] || 0) + 1; return acc; }, {}), [moves]);
  const tabs = [['all', 'All', moves.length], ...Object.keys(METHOD_LABEL).filter((k) => counts[k]).map((k) => [k, METHOD_LABEL[k], counts[k]])];
  const list = moves.filter((m) => (tab === 'all' || m.method === tab) && (!q || m.name.toLowerCase().includes(q.toLowerCase())));
  const vg = VERSION_GROUPS.get(movesFrom);
  return (
    <div>
      <div className="flex flex-wrap items-center gap-2">
        {tabs.map(([key, text, n]) => (
          <button key={key} type="button" onClick={() => setTab(key)} className="rounded-lg border px-2.5 py-1 text-xs font-semibold"
            style={tab === key ? { borderColor: 'var(--ember)', background: 'var(--ember-soft)' } : { borderColor: 'var(--line)', color: 'var(--muted)' }}>
            {text} <span className="mono opacity-70">{n}</span>
          </button>
        ))}
        <input id="move-filter" className="field ml-auto h-8 w-full py-1 text-xs sm:w-44" placeholder="Filter moves" value={q} onChange={(e) => setQ(e.target.value)} aria-label="Filter moves" />
      </div>
      <p className="mt-2 text-xs text-vault-faint">Learnset from {vg ? vg.label : movesFrom ? prettify(movesFrom) : 'unknown game'}</p>
      <ul className="movelist mt-2 divide-y divide-vault-line rounded-xl border border-vault-line bg-vault-bg">
        {list.length === 0 && <li className="px-3 py-6 text-center text-sm text-vault-muted">{moves.length ? 'No moves match that filter.' : 'PokeAPI lists no moves for this form.'}</li>}
        {list.map((m) => (
          <li key={`${m.key}-${m.method}-${m.level}`} className="flex items-center gap-3 px-3 py-2 text-sm">
            <span className="mono w-12 shrink-0 text-xs text-vault-muted">{m.method === 'level-up' ? (m.level === 0 ? 'Evo' : `Lv ${m.level}`) : METHOD_LABEL[m.method] || prettify(m.method)}</span>
            <span className="min-w-0 flex-1 truncate font-medium">{m.name}</span>
            {m.type && <TypeChip type={m.type} small />}
            {m.cls && <span className="hidden w-14 text-right text-xs capitalize text-vault-faint sm:inline">{m.cls}</span>}
            {m.power ? <span className="mono w-8 text-right text-xs text-vault-muted">{m.power}</span> : null}
          </li>
        ))}
      </ul>
    </div>
  );
}

function GameAppearances({ games }) {
  const groups = useMemo(() => {
    const byGen = new Map();
    [...new Set(games)]
      .map((k) => VERSION_GROUPS.get(k) || { key: k, label: prettify(k), gen: 0, order: 999 })
      .sort((a, b) => a.order - b.order)
      .forEach((vg) => { if (!byGen.has(vg.gen)) byGen.set(vg.gen, []); byGen.get(vg.gen).push(vg); });
    return [...byGen.entries()];
  }, [games]);
  if (!groups.length) return <p className="text-sm text-vault-muted">PokeAPI has no game data for this form yet.</p>;
  return (
    <ul className="grid gap-2.5">
      {groups.map(([gen, list]) => {
        const g = GENERATIONS.find((x) => x.gen === gen);
        return (
          <li key={gen} className="flex gap-3">
            <span className="font-display w-10 shrink-0 pt-1 text-sm font-bold" style={{ color: g ? g.color : 'var(--muted)' }}>{g ? g.roman : '?'}</span>
            <div className="flex flex-wrap gap-1.5">
              {list.map((vg) => <span key={vg.key} className="rounded-md border border-vault-line bg-vault-bg px-2 py-1 text-xs">{vg.label}</span>)}
            </div>
          </li>
        );
      })}
    </ul>
  );
}

function PokemonModal({ target, onClose, caught, onRegister, onAddFree, boxes, index }) {
  const [view, setView] = useState({ status: 'loading', data: null, error: null });
  const [attempt, setAttempt] = useState(0);
  const closeRef = useRef(null);

  useEffect(() => {
    let alive = true;
    setView({ status: 'loading', data: null, error: null });
    fetchPokemon(target.id != null ? target.id : target.query)
      .then((data) => alive && setView({ status: 'ready', data, error: null }))
      .catch((error) => alive && setView({ status: 'error', data: null, error }));
    return () => { alive = false; };
  }, [target, attempt]);

  useEffect(() => {          // Escape is handled once, in App, so stacked dialogs close one at a time
    const prev = document.body.style.overflow;
    document.body.style.overflow = 'hidden';
    if (closeRef.current) closeRef.current.focus();
    return () => { document.body.style.overflow = prev; };
  }, []);

  const d = view.data;
  const entry = d ? index.byId.get(d.id) : null;
  const loc = entry ? locate(entry, boxes) : null;
  const isCaught = d ? !!caught[d.id] : false;
  const natures = d ? recommendNatures(d.stats) : [];
  const bst = d ? Object.values(d.stats).reduce((a, b) => a + b, 0) : 0;

  return (
    <div className="overlay" onMouseDown={(e) => { if (e.target === e.currentTarget) onClose(); }}>
      <div className="sheet panel relative" role="dialog" aria-modal="true" aria-label={d ? `${d.name} details` : `Loading ${target.name || 'Pokémon'}`}>
        <button ref={closeRef} type="button" onClick={onClose} className="btn btn-quiet absolute right-3 top-3 z-10 px-2" aria-label="Close details"><X size={18} /></button>

        {view.status === 'loading' && <DetailSkeleton />}

        {view.status === 'error' && (
          <div className="grid place-items-center gap-3 px-6 py-16 text-center">
            <AlertTriangle size={32} style={{ color: 'var(--bad)' }} />
            <h2 className="font-display text-xl font-bold uppercase">{view.error.kind === 'not_found' ? 'No match' : 'Connection problem'}</h2>
            <p className="max-w-md text-vault-muted">

                    <div key={k} className="grid grid-cols-[64px_36px_minmax(0,1fr)] items-center gap-2 text-sm">
                      <dt className="text-vault-muted">{STAT_SHORT[k] === 'HP' ? 'HP' : STAT_LABEL[k]}</dt>

                    <dt className="font-semibold">Total</dt><dd className="mono text-right font-bold">{bst}</dd><span />

                <div className="flex flex-wrap gap-2">
                  {d.abilities.map((a) => (
                    <span key={a.name + a.hidden} className="rounded-lg border px-2.5 py-1 text-sm"
                      style={a.hidden ? { borderColor: 'var(--ember)', borderStyle: 'dashed' } : { borderColor: 'var(--line)' }}>
                      {a.name}{a.hidden && <span className="eyebrow ml-2" style={{ color: 'var(--ember)' }}>Hidden</span>}

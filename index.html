function useHashTab() {
  const read = () => (TABS.some(([k]) => `#${k}` === window.location.hash) ? window.location.hash.slice(1) : 'boxes');
  const [tab, setTab] = useState(read);
  useEffect(() => {
    const onHash = () => setTab(read());
    window.addEventListener('hashchange', onHash);
    return () => window.removeEventListener('hashchange', onHash);
  }, []);
  const go = useCallback((t) => {
    setTab(t);
    try { history.replaceState(null, '', `#${t}`); } catch { /* sandboxed frames may refuse */ }
  }, []);
  return [tab, go];
}

const TABS = [
  ['boxes', LayoutGrid, 'Box Manager', 'Dex'],
  ['free', Boxes, 'Free Boxes', 'Free'],
  ['superdex', Shapes, 'Superdex', 'Superdex'],
  ['hunt', Route, 'Hunter’s Itinerary', 'Hunt'],
  ['journal', CalendarDays, 'Catch Journal', 'Journal'],
  ['mega', Gem, 'Mega Evolution', 'Mega'],
  ['omnidex', Search, 'Omnidex', 'Search'],
  ['guide', BookOpenText, 'Field Guide', 'Guide'],
];
const BOTTOM_TABS = ['boxes', 'free', 'hunt', 'omnidex'];       // phones: these four plus More
const GUIDE_KEY = 'livingFormDex:guide:v1';   // last page read, per device

function App() {
  const [auth, setAuthRaw] = useState(() => {
    try { const v = JSON.parse(safeStorage.get(AUTH_KEY) || 'null') || {}; return { mode: v.mode || null, lastKey: v.lastKey || null }; }
    catch { return { mode: null, lastKey: null }; }
  });
  const saveAuth = useCallback((next) => { setAuthRaw(next); safeStorage.set(AUTH_KEY, JSON.stringify(next)); }, []);
  // A choice this copy can't honour (e.g. Claude sign-in in the VS Code copy) shows the sign-in screen again
  const mode = (auth.mode === 'claude' && !IN_CLAUDE) || (auth.mode === 'firebase' && !FIREBASE_READY) ? null : auth.mode;
  const greet = useRef(false);   // show "Signed in as…" only right after choosing an account, not on every load
  const setAuthMode = useCallback((next) => {
    greet.current = next === 'claude' || next === 'firebase';
    saveAuth({ mode: next, lastKey: next === 'claude' || next === 'firebase' ? auth.lastKey : null });
  }, [saveAuth, auth.lastKey]);
  const session = useAccount(mode);

  // Whose save is on screen: the signed-in account's own, the last account while it reconnects, else the offline save
  const signedIn = mode === 'claude' || mode === 'firebase';
  const accountKey = !signedIn ? null
    : session.status === 'ready' ? session.key
    : ['connecting', 'error', 'unavailable'].includes(session.status) ? auth.lastKey : null;
  const storageKey = accountKey ? accountStorageKey(accountKey) : GUEST_KEY;
  const [state, update, storageOk, replaceState, stateKey] = usePersistentState(storageKey);
  const sync = useCloudSync(state, stateKey, replaceState, session);
  useEffect(() => {
    if (session.status === 'ready' && auth.lastKey !== session.key) saveAuth({ mode: auth.mode, lastKey: session.key });
  }, [session.status, session.key]); // eslint-disable-line react-hooks/exhaustive-deps
  const spriteMode = useSpriteMode();
  const [source, recheck] = useDexSource();
  const species = useSpeciesList(source);
  const [live, liveFresh] = useLiveCatalog(source.status);
  const liveList = useMemo(() => liveEntries(live, species), [live, species]);
  const allMegas = useMemo(() => [...MEGAS, ...liveList.megas], [liveList]);
  const gens = useMemo(() => buildGenerations(species.length), [species.length]);
  const index = useMemo(() => buildIndex(species, liveList), [species, liveList]);
  const layout = state.ui.layout;
  const boxes = useMemo(() => buildBoxes(species, gens, layout), [species, gens, layout]);
  const [tab, setTab] = useHashTab();
  const [detail, setDetail] = useState(null);
  const [backupOpen, setBackupOpen] = useState(false);
  const [slotTarget, setSlotTarget] = useState(null);   // the slot whose form is open (living dex or free box)
  const [holding, setHolding] = useState(null);         // free box Pokémon being moved: { boxId, slot }
  const [highlight, setHighlight] = useState(null);
  const [toast, setToast] = useState(null);
  const [displayOpen, setDisplayOpen] = useState(false);
  const [exportOpen, setExportOpen] = useState(false);
  const [moreOpen, setMoreOpen] = useState(false);
  const packs = useStylePacks(state.ui.spriteStyle);
  const ownership = useSuperdexOwnership(state.caught, state.freeBoxes, state.superdex);
  const [guidePage, setGuidePageRaw] = useState(() => safeStorage.get(GUIDE_KEY) || 'species');
  const setGuidePage = useCallback((id) => { setGuidePageRaw(id); safeStorage.set(GUIDE_KEY, id); }, []);

  const caught = state.caught;
  const freeBoxes = state.freeBoxes;
  const currentFree = freeBoxes.some((b) => b.id === state.ui.freeBox) ? state.ui.freeBox : freeBoxes[0].id;
  const stats = useMemo(() => {
    const perGen = {};
    let caughtSpecies = 0;
    for (const s of species) {
      if (!caught[s.id]) continue;
      caughtSpecies++;
      const g = genOf(s.dex, gens);
      if (g) perGen[g.gen] = (perGen[g.gen] || 0) + 1;
    }
    const formsCaught = REGIONAL.filter((f) => caught[f.id]).length;
    const fullBoxes = boxes.filter((b) => b.kind !== 'reserved');
    const boxesDone = fullBoxes.filter((b) => b.slots.every((e) => !e || caught[e.id])).length;
    return {
      perGen, caught: caughtSpecies, total: species.length, pct: species.length ? (caughtSpecies / species.length) * 100 : 0,
      formsCaught, formsTotal: REGIONAL.length, boxesDone, boxesTotal: fullBoxes.length,
    };
  }, [caught, species, gens, boxes]);

  const toggleCaught = useCallback((id) => update((s) => {
    const next = { ...s.caught };
    if (next[id]) delete next[id]; else next[id] = { caughtAt: Date.now() };
    return { ...s, caught: next };
  }), [update]);

  const setMany = useCallback((ids, value) => update((s) => {
    const next = { ...s.caught };
    const now = Date.now();
    ids.forEach((id) => { if (value) next[id] = next[id] || { caughtAt: now }; else delete next[id]; });
    return { ...s, caught: next };
  }), [update]);

  const setUi = useCallback((patch) => update((s) => ({ ...s, ui: { ...s.ui, ...patch } }), false), [update]);
  const setCurrentBox = useCallback((n) => setUi({ box: n }), [setUi]);
  const closeDetail = useCallback(() => setDetail(null), []);
  const closeBackup = useCallback(() => setBackupOpen(false), []);
  const closeSlot = useCallback(() => setSlotTarget(null), []);
  const openSlot = useCallback((id) => { setDetail(null); setSlotTarget({ kind: 'dex', id }); }, []);
  const showToast = useCallback((text) => setToast({ text, at: Date.now() }), []);

  useEffect(() => {
    if (!toast) return;
    const t = setTimeout(() => setToast(null), toast.long ? 6500 : 3200);
    return () => clearTimeout(t);
  }, [toast]);

  // PokeAPI added something after this build: say so once, and point at the Field Guide
  // (new species and new forms arrive separately, so a second finding joins the toast already showing)
  const seenSpecies = useRef(species.length);
  const seenFresh = useRef(null);
  useEffect(() => {
    const found = { species: Math.max(0, species.length - seenSpecies.current), forms: 0, games: 0, types: 0 };
    seenSpecies.current = species.length;
    if (liveFresh && liveFresh !== seenFresh.current) {
      seenFresh.current = liveFresh;
      ['forms', 'games', 'types'].forEach((k) => { found[k] = Math.max(0, liveFresh[k]); });
    }
    if (!Object.values(found).some(Boolean)) return;
    setToast((prev) => {
      const counts = { ...found };
      if (prev && prev.counts && Date.now() - prev.at < 6500) Object.keys(counts).forEach((k) => { counts[k] += prev.counts[k]; });
      const words = { species: ['species', 'species'], forms: ['form', 'forms'], games: ['game', 'games'], types: ['type', 'types'] };
      const parts = Object.entries(counts).filter(([, n]) => n > 0).map(([k, n]) => `${n} new ${words[k][n === 1 ? 0 : 1]}`);
      return { text: `PokeAPI update: ${parts.join(', ')}. See What’s new in the Field Guide.`, at: Date.now(), long: true, counts };
    });
  }, [species.length, liveFresh]);

  // Milestones: log anything newly finished (no toast for what was already done when this save opened)
  const milestoneKey = useRef(null);
  useEffect(() => {
    const found = computeMilestones(state, species, gens, boxes, ownership.owned);
    const fresh = Object.keys(found).filter((k) => !state.milestones[k]);
    const opening = milestoneKey.current !== stateKey;
    milestoneKey.current = stateKey;
    if (!fresh.length) return;
    update((s) => ({ ...s, milestones: { ...Object.fromEntries(fresh.map((k) => [k, found[k]])), ...s.milestones } }));
    if (!opening) showToast(`Milestone: ${milestoneLabel(fresh[0], gens)}${fresh.length > 1 ? ` (+${fresh.length - 1} more)` : ''}`);
  }, [state.caught, state.freeBoxes, state.superdex, species, gens, boxes, stateKey]); // eslint-disable-line react-hooks/exhaustive-deps

  // Sprite style feedback: what changed, and whether its pack is still downloading or missing
  const styleWatch = useRef(null);
  const STYLE_PACK_FILE = { home: ['home.webp', '6.5 MB'], gen3: ['gen3.webp', '0.2 MB'] };
  const changeDisplay = useCallback((patch) => {
    setUi(patch);
    if (!patch.spriteStyle || patch.spriteStyle === state.ui.spriteStyle) return;
    const st = SPRITE_STYLES.find((x) => x.key === patch.spriteStyle);
    const pending = STYLE_PACKS[st.key] && packStore.state[st.key] !== 'ok' && spriteMode !== 'live';
    styleWatch.current = pending ? st.key : null;
    showToast(pending ? `Loading ${st.label} (${STYLE_PACK_FILE[st.key][1]})…` : `Sprite style: ${st.label}`);
  }, [setUi, state.ui.spriteStyle, spriteMode, showToast]);
  useEffect(() => {
    const k = styleWatch.current;
    if (!k || k !== state.ui.spriteStyle) return;
    const label = SPRITE_STYLES.find((x) => x.key === k).label;
    if (packs[k] === 'ok') { styleWatch.current = null; showToast(`Sprite style: ${label}`); }
    if (packs[k] === 'error') {
      styleWatch.current = null;
      showToast(`Couldn’t load ${label}: pack/${STYLE_PACK_FILE[k][0]} is missing. Copy the new pack folder next to the app.`);
    }
  }, [packs, state.ui.spriteStyle, showToast]);

  const tickSuperdex = useCallback((set, it, o) => {
    if (o.derived) { showToast(`${it.name} is already in your boxes`); return; }
    const key = `${set.key}:${it.k}`;
    update((s) => { const next = { ...s.superdex }; if (next[key]) delete next[key]; else next[key] = Date.now(); return { ...s, superdex: next }; });
  }, [update, showToast]);
  const openEvent = useCallback((e) => {
    if (e.where === 'free') { setTab('free'); setUi({ freeBox: e.boxId }); setSlotTarget({ kind: 'free', boxId: e.boxId, slot: e.slot }); return; }
    const entry = index.byId.get(e.id != null ? e.id : e.pokemonId);
    if (entry && (entry.kind === 'species' || entry.kind === 'form')) setSlotTarget({ kind: 'dex', id: entry.id });
  }, [index, setTab, setUi]);
  const makeImage = useCallback(() => drawBragImage({
    boxes, caught, stats, gens, guardian: state.guardian, records: allRecords(caught, freeBoxes),
    trainer: (session.account && session.account.name) || state.guardian.nickname,
    useHome: state.ui.spriteStyle === 'home' && packs.home === 'ok',
  }), [boxes, caught, freeBoxes, stats, gens, state.guardian, session.account, state.ui.spriteStyle, packs.home]);

  const toggleStone = useCallback((key) => update((s) => {
    const next = { ...s.megaStones };
    if (next[key]) delete next[key]; else next[key] = true;
    return { ...s, megaStones: next };
  }), [update]);
  const openMega = useCallback((m) => setDetail({ id: m.id, name: m.name }), []);
  const guideCtx = useMemo(() => ({
    index, gens, live, sourceStatus: source.status,
    speciesCount: species.length, liveForms: liveList.forms.length, liveMegas: liveList.megas.length,
    newSpeciesNames: species.filter((x) => x.future).map((x) => x.name),
    guardianId: state.guardian.pokemonId, guardianLevel: state.guardian.level,
    openDex: (id, name) => setDetail({ id, name }), goTab: setTab,
  }), [index, gens, live, source.status, species, liveList, state.guardian.pokemonId, state.guardian.level, setTab]);

  // One Escape handler: close the topmost dialog only
  useEffect(() => {
    const onKey = (e) => {
      if (e.key !== 'Escape' || e.defaultPrevented) return;
      if ((sync.status === 'conflict' || sync.status === 'offer') && !sync.dismissed) { if (sync.status === 'conflict') sync.resolve('later'); }
      else if (exportOpen) setExportOpen(false);
      else if (displayOpen) setDisplayOpen(false);
      else if (moreOpen) setMoreOpen(false);
      else if (detail) setDetail(null);
      else if (slotTarget) setSlotTarget(null);
      else if (backupOpen) setBackupOpen(false);
      else if (holding) setHolding(null);
    };
    document.addEventListener('keydown', onKey);
    return () => document.removeEventListener('keydown', onKey);
  }, [detail, slotTarget, backupOpen, holding, sync, exportOpen, displayOpen, moreOpen]);

  // Say hello once an account connects
  const signedInKey = session.status === 'ready' ? session.key : null;
  useEffect(() => {
    if (signedInKey && greet.current) { greet.current = false; showToast(`Signed in as ${session.account.name}`); }
  }, [signedInKey]); // eslint-disable-line react-hooks/exhaustive-deps

  // Signing out returns to the sign-in screen; the account's save stays in its cloud and this device's copy is hidden
  const signOut = useCallback(async () => {
    if (session.provider === 'firebase' && session.signOut) {
      try { await session.signOut(); } catch { /* the sign-in screen still shows */ }
    }
    saveAuth({ mode: null, lastKey: null });
    showToast('Signed out');
  }, [session, saveAuth, showToast]);

  // Save a living dex slot. Picking another species moves the record into that species' slot.
  const saveDex = useCallback((fromId, toId, record) => {
    const now = Date.now();
    const moving = fromId !== toId;
    const was = caught[fromId];
    update((s) => {
      const next = { ...s.caught };
      const keep = (moving ? s.caught[fromId] || s.caught[toId] : s.caught[fromId]) || null;
      if (moving) delete next[fromId];
      next[toId] = cleanRecord({ ...record, caughtAt: record.caughtAt || (keep ? keep.caughtAt : now), updatedAt: now }, toId);
      return { ...s, caught: next };
    });
    const entry = index.byId.get(toId);
    const loc = locate(entry, boxes);
    setSlotTarget(null);
    if (moving && loc) { setUi({ box: loc.box }); setHighlight(toId); }
    const name = record.nickname || entry.name;
    showToast(moving || !was ? `Registered ${name} in ${loc.name} · slot ${loc.slot}` : `Saved changes to ${name}`);
  }, [caught, update, index, boxes, setUi, showToast]);

  const removeRecord = useCallback((id) => {
    const entry = index.byId.get(id);
    const loc = locate(entry, boxes);
    const rec = caught[id];
    update((s) => { const next = { ...s.caught }; delete next[id]; return { ...s, caught: next }; });
    setSlotTarget(null);
    showToast(`Removed ${(rec && rec.nickname) || entry.name} from ${loc.name} · slot ${loc.slot}`);
  }, [caught, update, index, boxes, showToast]);

  /* ---- Free Boxes ---- */
  const nameOf = useCallback((rec) => {
    const e = rec && index.byId.get(rec.pokemonId);
    return (rec && rec.nickname) || (e ? e.name : 'Pokémon');
  }, [index]);
  const editFree = useCallback((fn) => update((s) => ({ ...s, freeBoxes: fn(s.freeBoxes.map((b) => ({ ...b, slots: { ...b.slots } }))) })), [update]);

  const saveFree = useCallback((target, species, record) => {
    const now = Date.now();
    const box = freeBoxes.find((b) => b.id === target.boxId);
    if (!box) return;
    const was = box.slots[target.slot];
    const dexId = dexSlotFor(species.id);
    const newlyRegistered = dexId && !caught[dexId] ? index.byId.get(dexId) : null;
    update((s) => {
      const list = s.freeBoxes.map((x) => (x.id === target.boxId
        ? { ...x, slots: { ...x.slots, [target.slot]: cleanFreeRecord({ ...record, pokemonId: species.id, caughtAt: record.caughtAt || (was ? was.caughtAt : now), updatedAt: now }) } }
        : x));
      const nextCaught = { ...s.caught };
      registerFreeInDex(nextCaught, list);          // the Pokédex records whatever you store
      return { ...s, freeBoxes: list, caught: nextCaught };
    });
    setUi({ freeBox: target.boxId });
    setSlotTarget(null);
    const name = record.nickname || species.name;
    const base = was ? `Saved changes to ${name}` : `Added ${name} to ${box.name} · slot ${target.slot + 1}`;
    showToast(newlyRegistered ? `${base} · ${newlyRegistered.name} registered in the Pokédex` : base);
  }, [freeBoxes, caught, index, update, setUi, showToast]);

  const removeFree = useCallback((target) => {
    const box = freeBoxes.find((b) => b.id === target.boxId);
    const rec = box && box.slots[target.slot];
    editFree((list) => { const b = list.find((x) => x.id === target.boxId); if (b) delete b.slots[target.slot]; return list; });
    setSlotTarget(null);
    if (rec) showToast(`Removed ${nameOf(rec)} from ${box.name} · slot ${target.slot + 1}`);
  }, [freeBoxes, editFree, nameOf, showToast]);

  const saveSlot = useCallback(({ target, species, record }) => (
    target.kind === 'dex' ? saveDex(target.id, species.id, record) : saveFree(target, species, record)
  ), [saveDex, saveFree]);
  const removeSlot = useCallback((target) => (target.kind === 'dex' ? removeRecord(target.id) : removeFree(target)), [removeRecord, removeFree]);

  // Free box slot clicked: place the held Pokémon (swapping if filled), or open the form
  const onFreeSlot = useCallback((boxId, slot) => {
    if (!holding) { setSlotTarget({ kind: 'free', boxId, slot }); return; }
    setHolding(null);
    if (holding.boxId === boxId && holding.slot === slot) return;
    const from = freeBoxes.find((b) => b.id === holding.boxId);
    const to = freeBoxes.find((b) => b.id === boxId);
    const moving = from && from.slots[holding.slot];
    if (!moving || !to) return;
    const other = to.slots[slot];
    editFree((list) => {
      const A = list.find((x) => x.id === holding.boxId);
      const B = list.find((x) => x.id === boxId);
      const a = A.slots[holding.slot];
      const b = B.slots[slot];
      delete A.slots[holding.slot];
      if (b) A.slots[holding.slot] = b;
      B.slots[slot] = a;
      return list;
    });
    setHighlight(`${boxId}:${slot}`);
    showToast(other ? `Swapped ${nameOf(moving)} and ${nameOf(other)}` : `Moved ${nameOf(moving)} to ${to.name} · slot ${slot + 1}`);
  }, [holding, freeBoxes, editFree, nameOf, showToast]);

  const startMove = useCallback((target) => { setSlotTarget(null); setHolding({ boxId: target.boxId, slot: target.slot }); }, []);

  const addFreeBox = useCallback(() => {
    if (freeBoxes.length >= MAX_FREE_BOXES) return null;
    const box = makeFreeBox(freeBoxes.length + 1);
    update((s) => ({ ...s, freeBoxes: [...s.freeBoxes, box], ui: { ...s.ui, freeBox: box.id } }));
    return box;
  }, [freeBoxes.length, update]);

  const renameFreeBox = useCallback((id, name) => editFree((list) => list.map((b) => (b.id === id ? { ...b, name } : b))), [editFree]);

  const deleteFreeBox = useCallback((id) => {
    const i = freeBoxes.findIndex((b) => b.id === id);
    const box = freeBoxes[i];
    if (!box || freeBoxes.length < 2) return;
    const rest = freeBoxes.filter((b) => b.id !== id);
    update((s) => ({ ...s, freeBoxes: s.freeBoxes.filter((b) => b.id !== id), ui: { ...s.ui, freeBox: rest[Math.max(0, i - 1)].id } }));
    if (holding && holding.boxId === id) setHolding(null);
    showToast(`Deleted ${box.name}`);
  }, [freeBoxes, holding, update, showToast]);

  // From the Omnidex: open the form on the first empty free slot, starting at the current box
  const addToFree = useCallback((pokemonId) => {
    const start = Math.max(0, freeBoxes.findIndex((b) => b.id === currentFree));
    const order = [...freeBoxes.slice(start), ...freeBoxes.slice(0, start)];
    for (const b of order) {
      for (let s = 0; s < BOX_SIZE; s++) {
        if (!b.slots[s]) { setDetail(null); setSlotTarget({ kind: 'free', boxId: b.id, slot: s, prefillId: pokemonId }); return; }
      }
    }
    const box = addFreeBox();
    if (!box) { showToast('All free boxes are full.'); return; }
    setDetail(null);
    setSlotTarget({ kind: 'free', boxId: box.id, slot: 0, prefillId: pokemonId });
  }, [freeBoxes, currentFree, addFreeBox, showToast]);

  const jumpToBox = useCallback((box, dex) => {
    setUi({ box });
    if (dex) setHighlight(dex);
    setTab('boxes');
  }, [setUi, setTab]);

  // Sign-in screen: first visit, after choosing Sign in, or after signing out of Google/Apple
  const showGate = !mode || (mode === 'firebase' && session.status === 'signed-out');
  if (showGate) {
    return (
      <SpriteContext.Provider value={spriteMode}>
        <LoginScreen guardian={state.guardian} onChoose={setAuthMode}
          notice={mode === 'firebase' ? 'You’re signed out. Your progress is still saved on this device.' : ''} />
        <div className="toast-wrap" role="status" aria-live="polite">
          {toast && <div key={toast.at} className="toast"><Check size={15} style={{ color: 'var(--ok)' }} />{toast.text}</div>}
        </div>
      </SpriteContext.Provider>
    );
  }

  return (
    <SpriteContext.Provider value={spriteMode}>
    <SpriteStyleContext.Provider value={{ style: state.ui.spriteStyle, ready: packs }}>
      <header className="sticky z-40 border-b border-vault-line bg-vault-bg" style={{ top: 'env(safe-area-inset-top, 0px)' }}>
        <div className="gutter wrap flex h-16 items-center gap-3">
          <div className="flex min-w-0 items-center gap-2.5">
            <span className="grid h-9 w-9 shrink-0 place-items-center rounded-xl text-vault-ink" style={{ background: 'var(--ember)' }}>
              <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" strokeWidth="2.2" /><path d="M3 12h6.2m5.6 0H21" stroke="currentColor" strokeWidth="2.2" /><circle cx="12" cy="12" r="2.8" fill="none" stroke="currentColor" strokeWidth="2.2" /></svg>
            </span>
            <div className="min-w-0 leading-tight lg:hidden 2xl:block">
              <p className="font-display truncate text-base font-bold uppercase tracking-wide">Living Form Dex</p>
              <p className="mono truncate text-[11px] text-vault-faint">HOME vault · {stats.caught}/{stats.total}</p>
            </div>
          </div>
          <nav className="mx-auto hidden rounded-xl border border-vault-line bg-vault-panel p-1 lg:flex" role="tablist" aria-label="Views">
            {TABS.map(([key, Icon, text, short]) => (
              <button key={key} type="button" role="tab" aria-selected={tab === key} onClick={() => setTab(key)} aria-label={text} title={text}
                className="flex items-center gap-1.5 whitespace-nowrap rounded-lg px-2.5 py-1.5 text-sm font-semibold xl:px-3"
                style={tab === key ? { background: 'var(--ember)', color: 'var(--on-light)' } : { color: 'var(--muted)' }}>
                <Icon size={15} /><span className="hidden xl:inline">{short === 'Dex' ? 'Boxes' : short}</span>
              </button>
            ))}
          </nav>
          <div className="ml-auto flex shrink-0 items-center gap-1 lg:ml-0">
            <SourcePill status={source.status} onRetry={recheck} />
            <button type="button" className="btn btn-quiet px-2" onClick={() => setDisplayOpen(true)} aria-label="Display settings: sprite style and box layout" title="Display settings"><SlidersHorizontal size={17} /></button>
            <AccountMenu mode={mode} session={session} sync={sync} onBackup={() => setBackupOpen(true)}
              onSignIn={() => setAuthMode(null)} onSignOut={signOut} />
          </div>
        </div>
      </header>

      <main className="gutter wrap grid gap-5 pb-28 pt-5 lg:pb-16">
        {!storageOk && (
          <p role="alert" className="rounded-xl border border-vault-bad px-4 py-3 text-sm text-vault-bad">
            This browser is blocking localStorage, so progress will not survive a refresh. Open Backup to copy it somewhere safe.
          </p>
        )}
        <ErrorBoundary>
          {tab === 'boxes' ? (
            <>
              <GuardianHero guardian={state.guardian} stats={stats} index={index}
                onSave={(g) => update((s) => ({ ...s, guardian: { ...s.guardian, ...g } }))} />
              <div className="grid min-w-0 items-start gap-5 lg:grid-cols-[minmax(0,1.45fr)_minmax(0,1fr)]">
                <BoxManager boxes={boxes} caught={caught} currentBox={state.ui.box} setCurrentBox={setCurrentBox}
                  clickMode={state.ui.clickMode} setClickMode={(m) => setUi({ clickMode: m })}
                  onToggle={toggleCaught} onSetMany={setMany} onOpenSlot={openSlot}
                  index={index} highlight={highlight} setHighlight={setHighlight}
                  onExport={() => setExportOpen(true)} onLayout={() => setDisplayOpen(true)} />
                <GenerationLedger gens={gens} perGen={stats.perGen} formsCaught={stats.formsCaught} onJump={jumpToBox} boxes={boxes} />
              </div>
            </>
          ) : tab === 'free' ? (
            <FreeBoxes freeBoxes={freeBoxes} currentId={currentFree} setCurrentId={(id) => setUi({ freeBox: id })} index={index}
              holding={holding} onSlot={onFreeSlot} onCancelHold={() => setHolding(null)}
              onAddBox={addFreeBox} onRenameBox={renameFreeBox} onDeleteBox={deleteFreeBox}
              highlight={highlight} setHighlight={setHighlight} />
          ) : tab === 'superdex' ? (
            <SuperdexTab state={state} ownership={ownership} onTick={tickSuperdex} />
          ) : tab === 'hunt' ? (
            <HuntTab caught={caught} index={index} species={species} gens={gens} onOpen={(e) => setDetail({ id: e.id, name: e.name })} onRegister={(e) => openSlot(e.id)} />
          ) : tab === 'journal' ? (
            <JournalTab state={state} index={index} species={species} gens={gens} boxes={boxes} milestones={state.milestones} onOpenEvent={openEvent} onExport={() => setExportOpen(true)} />
          ) : tab === 'mega' ? (
            <MegaTab megas={allMegas} caught={caught} stones={state.megaStones} onToggleStone={toggleStone} onOpen={openMega} index={index} />
          ) : tab === 'guide' ? (
            <FieldGuide pageId={guidePage} setPageId={setGuidePage} ctx={guideCtx} />
          ) : (
            <Omnidex index={index} species={species} gens={gens} caught={caught} onOpen={setDetail} />
          )}
        </ErrorBoundary>
        <footer className="mt-4 flex flex-wrap justify-between gap-2 border-t border-vault-line pt-4 text-xs text-vault-faint">
          <span>{layout.mode === 'custom'
            ? `Custom layout: ${boxes.length} boxes of ${layout.cols * layout.rows}, ${layout.order === 'grouped' ? 'regional forms beside their species' : 'regional forms after the Dex'}${layout.genBreaks ? ', new box per generation' : ''}`
            : `Box map: Spine HOME 1–${boxes.filter((b) => b.kind === 'spine').length} · Runway to ${RUNWAY_LAST_BOX} · Regional Annex ${ANNEX_BOXES[0].box}–${ANNEX_BOXES[ANNEX_BOXES.length - 1].box}`}</span>
          <span>Data and sprites: PokeAPI. Pokémon © Nintendo / Creatures / GAME FREAK.</span>
        </footer>
      </main>

      <nav className="bottom-nav lg:hidden" aria-label="Views">
        {TABS.filter(([key]) => BOTTOM_TABS.includes(key)).map(([key, Icon, , short]) => (
          <button key={key} type="button" aria-current={tab === key ? 'page' : undefined} onClick={() => { setTab(key); window.scrollTo({ top: 0 }); }}>
            <Icon size={19} /><span>{short}</span>
          </button>
        ))}
        {(() => { const extra = TABS.find(([key]) => key === tab && !BOTTOM_TABS.includes(key)); const Icon = extra ? extra[1] : Ellipsis; return (
          <button type="button" aria-current={extra ? 'page' : undefined} aria-haspopup="dialog" onClick={() => setMoreOpen(true)}>
            <Icon size={19} /><span>{extra ? extra[3] : 'More'}</span>
          </button>
        ); })()}
      </nav>

      {slotTarget && (slotTarget.kind === 'dex' ? index.byId.has(slotTarget.id) : freeBoxes.some((b) => b.id === slotTarget.boxId)) && (
        <ErrorBoundary>
          <SlotSheet key={JSON.stringify(slotTarget)} target={slotTarget} caught={caught} freeBoxes={freeBoxes} index={index} boxes={boxes}
            onSave={saveSlot} onRemove={removeSlot} onMove={startMove} onClose={closeSlot}
            onOpenDex={(e) => setDetail({ id: e.id, name: e.name })} />
        </ErrorBoundary>
      )}
      {detail && (
        <ErrorBoundary>
          <PokemonModal target={detail} onClose={closeDetail} caught={caught} onRegister={openSlot} onAddFree={addToFree} boxes={boxes} index={index} />
        </ErrorBoundary>
      )}
      {backupOpen && (
        <BackupDialog state={state} storageOk={storageOk} onClose={closeBackup}
          onRestore={(next) => update(() => next)} onReset={() => update(() => createDefaultState())} />
      )}
      {sync.status === 'conflict' && !sync.dismissed && sync.conflict && (
        <ConflictDialog local={state} cloud={sync.conflict.cloud} accountLabel={session.account ? session.account.label : ''} onResolve={sync.resolve} />
      )}
      {sync.status === 'offer' && !sync.dismissed && sync.offer && (
        <ImportDialog offline={sync.offer.offline} accountName={session.account ? session.account.name : 'This account'} onResolve={sync.resolve} />
      )}
      {displayOpen && <DisplayDialog ui={state.ui} packs={packs} previewId={state.guardian.pokemonId} onChange={changeDisplay} onClose={() => setDisplayOpen(false)} />}
      {exportOpen && <ExportDialog make={makeImage} onClose={() => setExportOpen(false)} />}
      {moreOpen && (
        <div className="overlay lg:hidden" onMouseDown={(e) => { if (e.target === e.currentTarget) setMoreOpen(false); }}>
          <div className="sheet panel relative max-w-[480px] p-5" role="dialog" aria-modal="true" aria-label="All views">
            <button type="button" onClick={() => setMoreOpen(false)} className="btn btn-quiet absolute right-3 top-3 px-2" aria-label="Close"><X size={18} /></button>
            <p className="eyebrow">Views</p>
            <div className="mt-3 grid grid-cols-2 gap-2">
              {TABS.map(([key, Icon, text]) => (
                <button key={key} type="button" aria-current={tab === key ? 'page' : undefined} onClick={() => { setTab(key); setMoreOpen(false); window.scrollTo({ top: 0 }); }}
                  className="flex items-center gap-2 rounded-xl border p-3 text-left text-sm font-semibold"
                  style={tab === key ? { borderColor: 'var(--ember)', background: 'var(--ember-soft)' } : { borderColor: 'var(--line)', color: 'var(--muted)' }}>
                  <Icon size={16} />{text}
                </button>
              ))}
              <button type="button" onClick={() => { setMoreOpen(false); setDisplayOpen(true); }} className="col-span-2 flex items-center gap-2 rounded-xl border border-vault-line p-3 text-left text-sm font-semibold text-vault-muted">
                <SlidersHorizontal size={16} />Display: sprite style and box layout
              </button>
            </div>
          </div>
        </div>
      )}
      <div className="toast-wrap" role="status" aria-live="polite">
        {toast && <div key={toast.at} className="toast"><Check size={15} style={{ color: 'var(--ok)' }} />{toast.text}</div>}
      </div>
    </SpriteStyleContext.Provider>
    </SpriteContext.Provider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

</body>
</html>

function StatGrid({ det, setDet, base }) {
  const level = clampLevel(det.level || 100);
  const n = NATURES.find((x) => x.name === det.nature);
  const evTotal = det.evs.reduce((a, v) => a + (parseInt(v, 10) || 0), 0);
  const setList = (which, i, v) => setDet((d) => ({ ...d, [which]: d[which].map((x, j) => (j === i ? v.replace(/\D/g, '').slice(0, 3) : x)) }));
  const final = (k, i, lv) => {
    if (!base) return '–';
    const mult = k === 'hp' || !n || n.neutral ? 1 : k === n.plus ? 1.1 : k === n.minus ? 0.9 : 1;
    const iv = det.ivs[i] === '' ? 31 : Math.min(31, +det.ivs[i] || 0);
    return calcStat(k, base[k], iv, Math.min(252, +det.evs[i] || 0), lv, mult);
  };
  return (
    <div className="overflow-x-auto">
      <table className="w-full min-w-[440px] text-xs">
        <thead><tr className="eyebrow text-left"><th className="py-1.5">Stat</th><th>Base</th><th>IV</th><th>EV</th><th className="text-right">{det.level ? `Lv ${level}` : 'Yours'}</th><th className="text-right">Lv 50</th><th className="text-right">Lv 100</th></tr></thead>
        <tbody>
          {STAT_KEYS.map((k, i) => {
            const mark = n && !n.neutral && k !== 'hp' ? (k === n.plus ? '+' : k === n.minus ? '−' : '') : '';
            return (
              <tr key={k} className="border-t border-vault-line">
                <td className="py-1">{STAT_SHORT[k]}{mark && <span className="mono ml-1" style={{ color: mark === '+' ? 'var(--ok)' : 'var(--bad)' }}>{mark}</span>}</td>
                <td className="mono text-vault-muted">{base ? base[k] : '–'}</td>
                <td><input aria-label={`${STAT_LABEL[k]} IV`} inputMode="numeric" className="field mono h-7 w-12 px-1.5 py-0.5 text-xs" placeholder="31" value={det.ivs[i]} onChange={(e) => setList('ivs', i, e.target.value)} /></td>
                <td><input aria-label={`${STAT_LABEL[k]} EV`} inputMode="numeric" className="field mono h-7 w-14 px-1.5 py-0.5 text-xs" placeholder="0" value={det.evs[i]} onChange={(e) => setList('evs', i, e.target.value)} /></td>
                <td className="mono text-right font-semibold">{final(k, i, level)}</td>
                <td className="mono text-right text-vault-muted">{final(k, i, 50)}</td>
                <td className="mono text-right text-vault-muted">{final(k, i, 100)}</td>
              </tr>
            );
          })}
        </tbody>
      </table>
      <p className="mono mt-1 text-[11px]" style={{ color: evTotal > 510 ? 'var(--bad)' : 'var(--faint)' }}>EVs {evTotal}/510 · blank IVs count as 31</p>
    </div>
  );
}

function RecordDetails({ det, setDet, species, learn, checks }) {
  const set = (k) => (v) => setDet((d) => ({ ...d, [k]: v }));
  const forms = species ? formOptions(species.id) : null;
  const abilities = learn.data && species && learn.data.id === species.id ? learn.data.abilities : [];
  const base = learn.data && species && learn.data.id === species.id ? learn.data.stats : null;
  const ball = BALL_BY_KEY.get(det.ball);
  const titles = det.ribbons.map((k) => DECOR_BY_KEY.get(k)).filter((d) => d && d.title);
  const toggleRibbon = (k) => setDet((d) => {
    const ribbons = d.ribbons.includes(k) ? d.ribbons.filter((x) => x !== k) : [...d.ribbons, k];
    return { ...d, ribbons, title: ribbons.includes(d.title) ? d.title : '' };
  });
  const lab = 'grid gap-1 text-xs font-semibold text-vault-muted';
  return (
    <div className="grid gap-4">
      <div className="grid gap-3 sm:grid-cols-3">
        <label className={lab}>Caught on
          <input type="date" aria-label="Caught on" className="field" value={det.date} max={toDateInput(Date.now())} onChange={(e) => set('date')(e.target.value)} />
        </label>
        {forms && (
          <label className={`${lab} sm:col-span-2`}>Form
            <select aria-label="Form" className="field" value={det.form} onChange={(e) => set('form')(e.target.value)}>
              {forms.map(([k, label]) => <option key={k} value={k}>{label}</option>)}
            </select>
          </label>
        )}
        <div className={`flex flex-wrap items-end gap-2 ${forms ? 'sm:col-span-3' : 'sm:col-span-2'}`}>
          <button type="button" aria-pressed={det.shiny} onClick={() => set('shiny')(!det.shiny)} className="btn"
            style={det.shiny ? { borderColor: '#facc15', color: 'var(--fg)', background: 'rgba(250,204,21,.12)' } : undefined}>
            <Sparkles size={14} style={{ color: det.shiny ? '#facc15' : undefined }} /> Shiny
          </button>
          {species && canGmax(species.id) && (
            <button type="button" aria-pressed={det.gmax} onClick={() => set('gmax')(!det.gmax)} className="btn"
              style={det.gmax ? { borderColor: '#f43f5e', color: 'var(--fg)', background: 'rgba(244,63,94,.12)' } : undefined}>
              <Zap size={14} style={{ color: det.gmax ? '#f43f5e' : undefined }} /> G-Max factor
            </button>
          )}
        </div>
      </div>

      <div className="grid gap-3 sm:grid-cols-3">
        <label className={lab}>Origin game
          <select aria-label="Origin game" className="field" value={det.origin} onChange={(e) => set('origin')(e.target.value)}>
            <option value="">Not set</option>
            {ORIGIN_GAMES.map((g) => <option key={g.key} value={g.key}>{g.label}</option>)}
          </select>
        </label>
        <label className={lab}><span className="flex items-center gap-1.5">Poké Ball {ball && <span className="inline-block h-2.5 w-2.5 rounded-full border border-vault-line" style={{ background: ball.color }} />}</span>
          <select aria-label="Poké Ball" className="field" value={det.ball} onChange={(e) => set('ball')(e.target.value)}>
            <option value="">Not set</option>
            {BALLS.map((b) => <option key={b.key} value={b.key}>{b.name}</option>)}
          </select>
        </label>
        <label className={lab}>Met
          <select aria-label="Met" className="field" value={det.met} onChange={(e) => set('met')(e.target.value)}>
            <option value="">Not set</option>
            {MET_TYPES.map(([k, l]) => <option key={k} value={k}>{l}</option>)}
          </select>
        </label>
        <label className={lab}>Original Trainer (OT)
          <input aria-label="Original Trainer (OT)" className="field" maxLength={OT_MAX} value={det.ot} onChange={(e) => set('ot')(e.target.value)} autoComplete="off" spellCheck={false} placeholder="As on the summary screen" />
        </label>
        <label className={lab}>ID No.
          <input aria-label="ID No." className="field mono" inputMode="numeric" maxLength={6} value={det.tid} onChange={(e) => set('tid')(e.target.value.replace(/\D/g, ''))} placeholder="e.g. 042195" />
        </label>
        <label className={lab}>Level
          <input aria-label="Level" className="field mono" inputMode="numeric" maxLength={3} value={det.level} onChange={(e) => set('level')(e.target.value.replace(/\D/g, ''))} placeholder="1–100" />
        </label>
        <label className={lab}>Nature
          <select aria-label="Nature" className="field" value={det.nature} onChange={(e) => set('nature')(e.target.value)}>
            <option value="">Not set</option>
            {NATURES.map((x) => <option key={x.name} value={x.name}>{x.name}{x.neutral ? '' : ` (+${STAT_SHORT[x.plus]} −${STAT_SHORT[x.minus]})`}</option>)}
          </select>
        </label>
        <label className={`${lab} sm:col-span-2`}>Ability
          {abilities.length ? (
            <select aria-label="Ability" className="field" value={det.ability} onChange={(e) => set('ability')(e.target.value)}>
              <option value="">Not set</option>
              {abilities.map((a) => <option key={a.name} value={abilitySlug(a.name)}>{a.name}{a.hidden ? ' (Hidden Ability)' : ''}</option>)}
              {det.ability && !abilities.some((a) => abilitySlug(a.name) === det.ability) && <option value={det.ability}>{abilityName(det.ability)}</option>}
            </select>
          ) : <input aria-label="Ability" className="field" value={det.ability ? abilityName(det.ability) : ''} onChange={(e) => set('ability')(abilitySlug(e.target.value))} placeholder="Loads with the species" />}
        </label>
      </div>

      <div className="grid gap-1.5">
        <p className="text-xs font-semibold text-vault-muted">IVs, EVs and real stats</p>
        <StatGrid det={det} setDet={setDet} base={base} />
      </div>

      <div className="grid gap-2">
        <div className="flex flex-wrap items-baseline justify-between gap-2">
          <p className="text-xs font-semibold text-vault-muted">Ribbons and marks <span className="mono font-normal text-vault-faint">{det.ribbons.length}</span></p>
          {titles.length > 0 && (
            <label className="flex items-center gap-2 text-xs text-vault-muted">Title
              <select aria-label="Title" className="field h-8 py-1 text-xs" value={det.title} onChange={(e) => set('title')(e.target.value)}>
                <option value="">None</option>
                {titles.map((d) => <option key={d.key} value={d.key}>{d.title}</option>)}
              </select>
            </label>
          )}
        </div>
        {det.ribbons.length > 0 && <div className="flex flex-wrap gap-1.5">{det.ribbons.map((k) => DECOR_BY_KEY.get(k)).filter(Boolean).map((d) => <DecorBadge key={d.key} d={d} small on onClick={() => toggleRibbon(d.key)} />)}</div>}
        <RibbonPicker selected={det.ribbons} onToggle={toggleRibbon} />
      </div>

      {checks.length > 0 && (
        <div className="grid gap-2 rounded-xl border border-vault-line bg-vault-bg p-3">
          <p className="eyebrow">Origin and legality checks</p>
          <CheckList checks={checks} />
          <p className="text-[11px] text-vault-faint">Common rules only. A clean result here isn’t a full legality check.</p>
        </div>
      )}
    </div>
  );
}

// target: { kind: 'dex', id } for a living dex slot, or { kind: 'free', boxId, slot, prefillId? } for a free box slot
function SlotSheet({ target, caught, freeBoxes, index, boxes, onSave, onRemove, onMove, onClose, onOpenDex }) {
  const isFree = target.kind === 'free';
  const fbox = isFree ? freeBoxes.find((b) => b.id === target.boxId) || { name: 'Free box', slots: {} } : null;
  const existing = (isFree ? fbox && fbox.slots[target.slot] : caught[target.id]) || null;
  const lookup = (id) => (id == null ? null : index.byId.get(id) || { id, dex: id, name: `Pokémon #${id}`, kind: 'species', sk: '' });
  const planned = isFree ? lookup(existing ? existing.pokemonId : target.prefillId) : lookup(target.id);
  const here = isFree
    ? { title: fbox.name, slot: target.slot + 1, row: Math.floor(target.slot / BOX_COLS) + 1, col: (target.slot % BOX_COLS) + 1 }
    : { title: locate(planned, boxes).name, ...locate(planned, boxes) };
  const initialGender = () => {
    if (existing && existing.gender) return existing.gender;
    if (!planned) return null;
    const opts = genderOptions(planned.dex);
    return opts.length === 1 ? opts[0] : null;
  };

  const [speciesText, setSpeciesText] = useState(planned ? planned.name : '');
  const [species, setSpecies] = useState(planned);
  const [nickname, setNickname] = useState((existing && existing.nickname) || '');
  const [gender, setGender] = useState(initialGender);
  const [moves, setMoves] = useState(() => Array.from({ length: MOVE_SLOTS }, (_, i) => {
    const slug = existing && existing.moves ? existing.moves[i] : null;
    return slug ? (MOVE_BY_SLUG.get(slug) || { name: moveName(slug) }).name : '';
  }));
  const [learn, setLearn] = useState({ status: 'loading', data: null });
  const [error, setError] = useState('');
  const [confirmRemove, setConfirmRemove] = useState(false);
  const [det, setDet] = useState(() => initDetails(existing, planned));
  const [showDetails, setShowDetails] = useState(() => !!existing && DETAIL_FIELDS.slice(2).some((k) => existing[k] != null));
  const [editing, setEditing] = useState(null);     // field being typed in; it isn't flagged until you leave it
  const dialogRef = useRef(null);
  const focusOf = (name) => (on) => setEditing((cur) => (on ? name : cur === name ? null : cur));

  // Lock page scroll, focus the dialog, hand focus back to the slot on close
  useEffect(() => {
    const returnTo = document.activeElement;
    const prev = document.body.style.overflow;
    document.body.style.overflow = 'hidden';
    const speciesInput = document.getElementById('slot-species');
    if (!planned && speciesInput) speciesInput.focus();       // empty free slot: start with the species
    else if (dialogRef.current) dialogRef.current.focus();
    return () => { document.body.style.overflow = prev; if (returnTo && returnTo.focus) returnTo.focus(); };
  }, []); // eslint-disable-line react-hooks/exhaustive-deps

  // Learnset for the move picker (live PokeAPI, else the offline pack)
  const speciesId = species ? species.id : null;
  useEffect(() => {
    if (speciesId == null) return;
    let alive = true;
    setLearn({ status: 'loading', data: null });
    fetchPokemon(speciesId)
      .then((data) => alive && setLearn({ status: 'ready', data }))
      .catch(() => alive && setLearn({ status: 'error', data: null }));
    return () => { alive = false; };
  }, [speciesId]);

  const tags = useMemo(() => learnTags(learn.data), [learn.data]);
  const catalog = useMemo(() => {
    const extra = ((learn.data && learn.data.allMoves) || []).filter((s) => !MOVE_BY_SLUG.has(s))
      .map((slug) => ({ slug, name: moveName(slug), sk: searchKey(moveName(slug)) }));   // moves newer than this file
    return extra.length ? [...ALL_MOVES, ...extra] : ALL_MOVES;
  }, [learn.data]);
  const moveBySk = useMemo(() => new Map(catalog.map((m) => [m.sk, m])), [catalog]);
  const resolved = moves.map((t) => (t.trim() ? moveBySk.get(searchKey(t)) || null : null));

  function chooseSpecies(entry) {
    setSpecies(entry);
    setError('');
    if (!entry) return;
    const opts = genderOptions(entry.dex);
    setGender((g) => (opts.length === 1 ? opts[0] : opts.includes(g) ? g : null));
    setDet((d) => ({ ...d, form: formOptions(entry.id) && formOptions(entry.id).some((f) => f[0] === d.form) ? d.form : defaultForm(entry.id) || '', gmax: d.gmax && canGmax(entry.id) }));
  }
  const setMove = (i, text) => { setMoves((m) => m.map((t, j) => (j === i ? text : t))); setError(''); };

  const shown = species || planned;
  const genderOpts = species ? genderOptions(species.dex) : [];
  const battleOnly = !!species && species.kind === 'mega';               // Megas exist only mid-battle
  const noSlot = !isFree && species && (species.kind === 'variety' || battleOnly);     // alternate forms live in Free Boxes only
  const dest = !isFree && species && !noSlot && species.id !== planned.id ? species : null;
  const destLoc = dest ? locate(dest, boxes) : null;
  const destRec = dest ? caught[dest.id] : null;
  const replaces = dest && hasDetails(destRec);
  const saveLabel = isFree ? (existing ? 'Save changes' : 'Add to box')
    : replaces ? 'Replace and save' : dest ? `Save to ${destLoc.name}` : existing ? 'Save changes' : 'Register';
  const speciesOptions = searchIndex(speciesText, index, 12)
    .filter((e) => e.kind !== 'mega' && (isFree || e.kind !== 'variety'))
    .filter((e) => !species || e.id !== species.id || searchKey(speciesText) !== e.sk)
    .slice(0, 8);
  const types = learn.data && species && learn.data.id === species.id ? learn.data.types : [];
  const checks = useMemo(() => (species ? checkRecord(species, {
    origin: det.origin, ball: det.ball, met: det.met, tid: det.tid, ribbons: det.ribbons,
    caughtAt: fromDateInput(det.date, existing && existing.caughtAt),
  }) : []), [species, det, existing]);
  const worst = worstCheck(checks);
  const titleText = det.title && det.ribbons.includes(det.title) ? (DECOR_BY_KEY.get(det.title) || {}).title : '';

  function submit(e) {
    e.preventDefault();
    if (!species) { setError(speciesText.trim() ? `“${speciesText.trim()}” doesn’t match a Pokémon. Pick a species from the list.` : 'Choose a species first.'); return; }
    if (battleOnly) { setError(`${species.name} only exists during battle, so it can’t be stored. Add ${(index.byId.get(species.dex) || {}).name || 'its base form'} instead.`); return; }
    if (noSlot) { setError(`${species.name} has no living dex slot. Add it in Free Boxes instead.`); return; }
    const g = genderOpts.length === 1 ? genderOpts[0] : gender;
    if (!g || !genderOpts.includes(g)) { setError(`Choose ${species.name}’s gender.`); return; }
    const slugs = [];
    for (let i = 0; i < moves.length; i++) {
      if (!moves[i].trim()) continue;
      const mv = resolved[i];
      if (!mv) { setError(`Move ${i + 1}: “${moves[i].trim()}” isn’t a move. Pick one from the list.`); return; }
      if (slugs.includes(mv.slug)) { setError(`${mv.name} is listed twice. A Pokémon knows each move only once.`); return; }
      slugs.push(mv.slug);
    }
    const dr = detailsToRecord(det, existing);
    if (dr.error) { setError(dr.error); setShowDetails(true); return; }
    onSave({ target, species, record: { nickname: nickname.trim().slice(0, NICKNAME_MAX), gender: g, moves: slugs, ...dr.record } });
  }

  const status = !existing ? { text: 'Empty slot', color: 'var(--muted)' }
    : isFree ? { text: 'Stored', color: 'var(--ok)' }
    : hasDetails(existing) ? { text: 'Registered', color: 'var(--ok)' } : { text: 'Caught · no details yet', color: 'var(--warn)' };

  return (
    <div className="overlay" onMouseDown={(e) => { if (e.target === e.currentTarget) onClose(); }}>
      <form ref={dialogRef} tabIndex={-1} onSubmit={submit} noValidate className="sheet panel relative max-w-[620px] p-5 outline-none sm:p-7"
        role="dialog" aria-modal="true" aria-labelledby="slot-title">
        <button type="button" onClick={onClose} className="btn btn-quiet absolute right-3 top-3 z-10 px-2" aria-label="Close without saving"><X size={18} /></button>

        <header className="flex items-center gap-4 pr-10">
          <div className="grid h-20 w-20 shrink-0 rounded-2xl border border-vault-line bg-vault-bg p-1.5 text-vault-line sm:h-24 sm:w-24">
            {shown ? <Sprite id={shown.id} female={gender === 'female'} form={det.form} gmax={det.gmax} shiny={det.shiny} alt="" /> : <PokeballGlyph />}
          </div>
          <div className="min-w-0">
            <p className="eyebrow truncate">{here.title} · slot {here.slot}<span className="hidden sm:inline"> · row {here.row}, col {here.col}</span></p>
            <h2 id="slot-title" className="font-display mt-0.5 truncate text-2xl font-bold uppercase tracking-wide sm:text-3xl">
              {nickname.trim() || (shown ? shown.name : 'New Pokémon')}
              {det.shiny && <Sparkles size={18} className="ml-1.5 inline align-baseline" style={{ color: '#facc15' }} aria-label="Shiny" />}
            </h2>
            {titleText && <p className="text-sm italic text-vault-muted">{titleText}</p>}
            <div className="mt-1 flex flex-wrap items-center gap-1.5">
              <span className="mono text-xs text-vault-muted">{shown ? `${shown.name} · ${pad4(shown.dex)}` : 'Any species or form'}</span>
              {types.map((t) => <TypeChip key={t} type={t} small />)}
              <span className="eyebrow ml-1" style={{ color: status.color }}>{status.text}</span>
            </div>
          </div>
        </header>

        <div className="mt-6 grid gap-5">
          <div className="grid gap-1.5">
            <label htmlFor="slot-species" className="text-sm font-semibold">Species</label>
            <Combobox id="slot-species" value={speciesText} placeholder={isFree ? 'Any Pokémon: name, form or Dex number' : 'Name or Dex number'}
              onFocusChange={focusOf('species')}
              invalid={(!species && !!speciesText.trim() && editing !== 'species') || !!noSlot}
              describedBy={dest || noSlot ? 'slot-dest' : undefined}
              onChange={(text) => { setSpeciesText(text); chooseSpecies(resolveQuery(text, index)); }}
              onPick={(entry) => { setSpeciesText(entry.name); chooseSpecies(entry); }}
              options={speciesOptions}
              getKey={(entry) => entry.id}
              renderOption={(entry) => (
                <>
                  <span className="h-8 w-8 shrink-0"><Sprite id={entry.id} /></span>
                  <span className="mono w-12 shrink-0 text-xs text-vault-faint">{pad4(entry.dex)}</span>
                  <span className="min-w-0 flex-1 truncate">{entry.name}</span>
                  {!isFree && caught[entry.id] && <span className="eyebrow" style={{ color: 'var(--ok)' }}>Caught</span>}
                  {entry.kind === 'variety' && <span className="eyebrow">Form</span>}
                </>
              )} />
            {noSlot && (
              <p id="slot-dest" className="flex items-start gap-1.5 text-xs text-vault-bad">
                <Info size={13} className="mt-px shrink-0" />
                <span>{battleOnly ? `${species.name} only exists during battle, so it can’t be stored.` : `${species.name} is an alternate form with no living dex slot. Add it in Free Boxes instead.`}</span>
              </p>
            )}
            {dest && (
              <p id="slot-dest" className="flex items-start gap-1.5 text-xs" style={{ color: replaces ? 'var(--warn)' : 'var(--muted)' }}>
                <Info size={13} className="mt-px shrink-0" />
                <span>
                  {dest.name} belongs in {destLoc.name} · slot {destLoc.slot}.{' '}
                  {existing ? `Saving moves this record there and empties slot ${here.slot}.` : 'It will be saved there.'}
                  {replaces && ` It replaces ${describeRecord(dest, destRec)}.`}
                </span>
              </p>
            )}
          </div>

          <div className="grid gap-1.5">
            <div className="flex items-baseline justify-between">
              <label htmlFor="slot-nick" className="text-sm font-semibold">Nickname</label>
              <span className="mono text-xs text-vault-faint">{nickname.length}/{NICKNAME_MAX}</span>
            </div>
            <input id="slot-nick" className="field" maxLength={NICKNAME_MAX} value={nickname} placeholder="Leave blank if it has none"
              autoComplete="off" spellCheck={false} onChange={(e) => setNickname(e.target.value)} />
          </div>

          <fieldset className="grid gap-1.5">
            <legend className="mb-1.5 text-sm font-semibold">Gender</legend>
            {species ? (
              <div className="flex flex-wrap items-center gap-2" role="radiogroup" aria-label="Gender">
                {genderOpts.map((g) => {
                  const on = gender === g || genderOpts.length === 1;
                  return (
                    <button key={g} type="button" role="radio" aria-checked={on} onClick={() => { setGender(g); setError(''); }}
                      className="flex items-center gap-2 rounded-xl border px-3.5 py-2 text-sm font-semibold transition"
                      style={on ? { borderColor: GENDERS[g].color, background: 'var(--panel-2)', color: 'var(--fg)' } : { borderColor: 'var(--line)', color: 'var(--muted)' }}>
                      <span className="text-base leading-none" style={{ color: GENDERS[g].color }}>{GENDERS[g].symbol}</span>{GENDERS[g].label}
                    </button>
                  );
                })}
                {genderOpts.length === 1 && (
                  <span className="text-xs text-vault-muted">
                    {genderOpts[0] === 'genderless' ? `${species.name} has no gender.` : `${species.name} is always ${genderOpts[0]}.`}
                  </span>
                )}
              </div>
            ) : <p className="text-xs text-vault-muted">Pick a species first.</p>}
          </fieldset>

          <fieldset className="grid gap-2">
            <legend className="mb-0.5 flex w-full items-baseline justify-between text-sm font-semibold">
              <span>Moves</span>
              <span className="text-xs font-normal text-vault-faint">
                {!species ? 'Pick a species to see its learnset' : learn.status === 'loading' ? 'Loading learnset…' : learn.status === 'error' ? 'Learnset unavailable, any move allowed' : 'Up to 4 · change them any time'}
              </span>
            </legend>
            <ol className="grid gap-2">
              {moves.map((text, i) => {
                const mv = resolved[i];
                const unknown = !!text.trim() && !mv && editing !== i;
                const offList = !!mv && learn.status === 'ready' && !tags.has(mv.slug);
                const taken = new Set(resolved.filter((m, j) => m && j !== i).map((m) => m.slug));
                const noteId = `move-note-${i}`;
                return (
                  <li key={i} className="grid grid-cols-[18px_minmax(0,1fr)_32px] items-center gap-2">
                    <span className="mono text-xs text-vault-faint" aria-hidden="true">{i + 1}</span>
                    <Combobox id={`slot-move-${i}`} value={text} placeholder={i === 0 ? 'Start typing a move' : 'Empty'} onFocusChange={focusOf(i)}
                      invalid={unknown} describedBy={unknown || offList ? noteId : undefined}
                      adornment={mv && mv.type ? <TypeChip type={mv.type} small /> : null}
                      onChange={(v) => setMove(i, v)} onPick={(o) => setMove(i, o.mv.name)}
                      options={moveSuggestions(text, tags, taken, catalog)} getKey={(o) => o.mv.slug}
                      renderOption={(o) => (
                        <>
                          <span className="min-w-0 flex-1 truncate">{o.mv.name}</span>
                          <span className="mono shrink-0 text-[11px]" style={{ color: o.tag ? (o.tag === 'Older games' ? 'var(--faint)' : 'var(--muted)') : 'var(--warn)' }}>{o.tag || 'Not learnable'}</span>
                          <span className="w-[62px] shrink-0 text-right">{o.mv.type && <TypeChip type={o.mv.type} small />}</span>
                        </>
                      )} />
                    <div className="flex justify-end">
                      {text && <button type="button" className="btn btn-quiet px-1.5 py-1.5" aria-label={`Clear move ${i + 1}`} onClick={() => setMove(i, '')}><X size={14} /></button>}
                    </div>
                    {(unknown || offList) && (
                      <p id={noteId} className="col-span-2 col-start-2 text-xs" style={{ color: unknown ? 'var(--bad)' : 'var(--warn)' }}>
                        {unknown ? 'No move by that name. Pick one from the list.' : `Not in ${shown.name}’s learnset. Keep it if it came from an event.`}
                      </p>
                    )}
                  </li>
                );
              })}
            </ol>
          </fieldset>

          <section className="grid gap-3 rounded-2xl border border-vault-line p-3 sm:p-4" aria-labelledby="details-toggle">
            <button id="details-toggle" type="button" aria-expanded={showDetails} onClick={() => setShowDetails((v) => !v)}
              className="flex w-full items-center gap-2 text-left text-sm font-semibold">
              <Fingerprint size={15} className="text-vault-muted" />
              <span className="flex-1">Collector details</span>
              {worst && worst !== 'ok' && <span className="eyebrow" style={{ color: worst === 'error' ? 'var(--bad)' : 'var(--warn)' }}>{worst === 'error' ? 'Check failed' : 'Check note'}</span>}
              {!showDetails && <span className="hidden text-xs font-normal text-vault-faint sm:inline">Origin, ball, OT, IVs/EVs, ribbons</span>}
              <ChevronDown size={16} className="transition" style={{ transform: showDetails ? 'rotate(180deg)' : 'none' }} />
            </button>
            {showDetails && <RecordDetails det={det} setDet={setDet} species={species} learn={learn} checks={checks} />}
          </section>

          {error && <p role="alert" className="flex items-start gap-2 text-sm text-vault-bad"><AlertTriangle size={16} className="mt-0.5 shrink-0" />{error}</p>}

          <div className="flex flex-wrap items-center gap-2 border-t border-vault-line pt-4">
            <button type="submit" className="btn btn-ember"><Check size={14} /> {saveLabel}</button>
            <button type="button" className="btn" onClick={onClose}>Cancel</button>
            {isFree && existing && <button type="button" className="btn" onClick={() => onMove(target)}><Move size={14} /> Move</button>}
            {shown && <button type="button" className="btn btn-quiet ml-auto" onClick={() => onOpenDex(shown)}><BookOpen size={14} /> Pokédex data</button>}
          </div>

          {existing && (
            !confirmRemove ? (
              <button type="button" className="btn btn-quiet justify-self-start text-vault-bad" onClick={() => setConfirmRemove(true)}>
                <Trash2 size={14} /> Remove from box
              </button>
            ) : (
              <div className="flex flex-wrap items-center gap-2 rounded-xl border border-vault-bad px-3 py-2 text-sm" role="alertdialog" aria-label="Confirm removal">
                <span className="min-w-0 flex-1">Remove {describeRecord(planned, existing)} from {here.title} · slot {here.slot}? Its details are deleted.</span>
                <button type="button" className="btn btn-ember" onClick={() => onRemove(target)}>Remove</button>
                <button type="button" className="btn" onClick={() => setConfirmRemove(false)}>Keep</button>
              </div>
            )
          )}
        </div>
      </form>
    </div>
  );
}

/* ---------------------------------------------------------------------
   15. FREE BOXES: any Pokémon in any slot, like HOME's own boxes.
   No Dex order, duplicates allowed, nothing here counts toward completion.
   --------------------------------------------------------------------- */
function FreeSlot({ i, record, entry, held, holding, highlighted, onActivate }) {
  const row = Math.floor(i / BOX_COLS) + 1;  // Free Boxes are always HOME-shaped
  const col = (i % BOX_COLS) + 1;
  if (!record) {
    return (
      <button type="button" className={`slot-free-empty ${holding ? 'is-target' : ''}`} onClick={() => onActivate(i)}
        aria-label={`Slot ${i + 1} (row ${row}, column ${col}), empty. ${holding ? 'Click to place it here.' : 'Click to add a Pokémon.'}`}>
        <Plus size={16} aria-hidden="true" />
      </button>
    );
  }
  const shownEntry = entry || { name: `Pokémon #${record.pokemonId}` };
  const desc = describeRecord(shownEntry, record);
  const gender = record.gender && record.gender !== 'genderless' ? GENDERS[record.gender] : null;
  const action = held ? 'Being moved. Click to put it back.' : holding ? 'Click to swap places.' : 'Click to edit or move.';
  return (
    <button type="button" className={`slot is-stored ${held ? 'is-held' : ''} ${highlighted ? 'is-hl' : ''}`} onClick={() => onActivate(i)}
      aria-label={`${desc}, slot ${i + 1} (row ${row}, column ${col}). ${action}`} title={`${desc}\nSlot ${i + 1} · row ${row}, col ${col}`}>
      <Sprite id={record.pokemonId} female={record.gender === 'female'} form={record.form} gmax={record.gmax} shiny={record.shiny} />
      {gender && <span className="slot-gender" style={{ color: gender.color }} aria-hidden="true">{gender.symbol}</span>}
      {record.shiny && <span className="slot-shiny" aria-hidden="true"><Sparkles size={10} /></span>}
    </button>
  );
}

function FreeBoxes({ freeBoxes, currentId, setCurrentId, index, holding, onSlot, onCancelHold, onAddBox, onRenameBox, onDeleteBox, highlight, setHighlight }) {
  const pos = Math.max(0, freeBoxes.findIndex((b) => b.id === currentId));
  const box = freeBoxes[pos];
  const [renaming, setRenaming] = useState(false);
  const [draftName, setDraftName] = useState(box.name);
  const [confirmDelete, setConfirmDelete] = useState(false);
  const [find, setFind] = useState('');
  const [found, setFound] = useState({ q: '', i: -1, total: 0 });

  useEffect(() => { setRenaming(false); setConfirmDelete(false); }, [box.id]);
  useEffect(() => {
    if (highlight == null) return;
    const t = setTimeout(() => setHighlight(null), 2600);
    return () => clearTimeout(t);
  }, [highlight, setHighlight]);

  const total = freeBoxes.reduce((n, b) => n + freeCount(b), 0);
  const filled = freeCount(box);
  const heldRecord = holding ? ((freeBoxes.find((b) => b.id === holding.boxId) || { slots: {} }).slots[holding.slot] || null) : null;
  const heldEntry = heldRecord ? index.byId.get(heldRecord.pokemonId) : null;
  const go = (d) => setCurrentId(freeBoxes[(pos + d + freeBoxes.length) % freeBoxes.length].id);

  function saveName(e) {
    e.preventDefault();
    const name = draftName.trim().slice(0, FREE_BOX_NAME_MAX);
    if (name) onRenameBox(box.id, name);
    setRenaming(false);
  }

  // Search nicknames and species across every free box; pressing Find again jumps to the next match
  function doFind(e) {
    e.preventDefault();
    const q = searchKey(find);
    if (!q) return;
    const matches = [];
    freeBoxes.forEach((b) => {
      for (let s = 0; s < BOX_SIZE; s++) {
        const r = b.slots[s];
        if (!r) continue;
        const en = index.byId.get(r.pokemonId);
        if (searchKey(r.nickname || '').includes(q) || (en && en.sk.includes(q))) matches.push({ boxId: b.id, slot: s });
      }
    });
    if (!matches.length) { setFound({ q, i: -1, total: 0 }); return; }
    const i = found.q === q && found.total === matches.length ? (found.i + 1) % matches.length : 0;
    setFound({ q, i, total: matches.length });
    setCurrentId(matches[i].boxId);
    setHighlight(`${matches[i].boxId}:${matches[i].slot}`);
  }

  return (
    <div className="grid min-w-0 gap-5">
      <section className="panel min-w-0 p-5 sm:p-6" aria-labelledby="free-title">
        <div className="flex flex-wrap items-end justify-between gap-4">
          <div className="min-w-0">
            <p className="eyebrow">Any Pokémon · any slot</p>
            <h1 id="free-title" className="font-display mt-1 text-3xl font-bold uppercase tracking-wide">Free Boxes</h1>
            <p className="mt-1.5 max-w-xl text-sm text-vault-muted">
              These boxes don’t follow Pokédex order. Store duplicates, alternate forms, battle teams or trade stock. Anything you add is also registered in your Pokédex.
            </p>
          </div>
          <dl className="flex gap-6">
            <div><dt className="eyebrow">Stored</dt><dd className="mono text-xl font-semibold">{total}</dd></div>
            <div><dt className="eyebrow">Boxes</dt><dd className="mono text-xl font-semibold">{freeBoxes.length}</dd></div>
          </dl>
        </div>
      </section>

      <div className="grid min-w-0 items-start gap-5 lg:grid-cols-[minmax(0,1.45fr)_minmax(0,1fr)]">
        <section className="panel min-w-0 p-4 sm:p-5" aria-labelledby="free-box-title">
          <div className="flex flex-wrap items-center justify-between gap-3">
            <div className="min-w-0 flex-1">
              <p className="eyebrow">Free box {pos + 1} of {freeBoxes.length}</p>
              {!renaming ? (
                <div className="flex min-w-0 items-center gap-1">
                  <h2 id="free-box-title" className="font-display truncate text-2xl font-bold uppercase tracking-wide">{box.name}</h2>
                  <button type="button" className="btn btn-quiet shrink-0 px-2" onClick={() => { setDraftName(box.name); setRenaming(true); }} aria-label={`Rename ${box.name}`}>
                    <Pencil size={14} />
                  </button>
                </div>
              ) : (
                <form onSubmit={saveName} className="mt-1 flex flex-wrap items-center gap-2" aria-label="Rename box">
                  <label htmlFor="free-box-name" className="sr-only">Box name</label>
                  <input id="free-box-name" className="field w-48" maxLength={FREE_BOX_NAME_MAX} value={draftName} autoFocus
                    onChange={(e) => setDraftName(e.target.value)} onKeyDown={(e) => { if (e.key === 'Escape') { e.preventDefault(); setRenaming(false); } }} />
                  <button type="submit" className="btn btn-ember"><Check size={14} /> Save</button>
                  <button type="button" className="btn" onClick={() => setRenaming(false)}>Cancel</button>
                </form>
              )}
            </div>
          </div>

          <div className="mt-4 flex items-center gap-2">
            <button type="button" className="btn shrink-0 px-2" onClick={() => go(-1)} aria-label="Previous free box" disabled={freeBoxes.length < 2}><ChevronLeft size={18} /></button>
            <p className="mono min-w-0 flex-1 text-center text-xs text-vault-muted">{filled}/{BOX_SIZE} stored</p>
            <button type="button" className="btn shrink-0 px-2" onClick={() => go(1)} aria-label="Next free box" disabled={freeBoxes.length < 2}><ChevronRight size={18} /></button>
          </div>

          {heldRecord && (
            <div className="mt-3 flex flex-wrap items-center gap-3 rounded-xl border px-3 py-2 text-sm" role="status"
              style={{ borderColor: 'var(--ember)', background: 'var(--ember-soft)' }}>
              <span className="h-9 w-9 shrink-0"><Sprite id={heldRecord.pokemonId} female={heldRecord.gender === 'female'} /></span>
              <span className="min-w-0 flex-1">
                Moving <strong>{heldRecord.nickname || (heldEntry ? heldEntry.name : 'Pokémon')}</strong>. Click a slot in any free box to place it. A filled slot swaps.
              </span>
              <button type="button" className="btn" onClick={onCancelHold}>Cancel</button>
            </div>
          )}

          <div className="box-frame mt-3">
            <div className="box-grid">
              {Array.from({ length: BOX_SIZE }, (_, i) => {
                const rec = box.slots[i] || null;
                return (
                  <FreeSlot key={i} i={i} record={rec} entry={rec ? index.byId.get(rec.pokemonId) : null}
                    held={!!holding && holding.boxId === box.id && holding.slot === i} holding={!!holding}
                    highlighted={highlight === `${box.id}:${i}`} onActivate={(slot) => onSlot(box.id, slot)} />
                );
              })}
            </div>
            <p className="relative mt-2.5 flex items-start gap-1.5 text-xs text-vault-muted">
              <Info size={13} className="mt-px shrink-0" />
              {holding ? 'Use the arrows or the box list to carry it to another box.' : 'Click an empty slot to add any Pokémon. Click a stored one to edit it or move it.'}
            </p>
          </div>

          <div className="mt-3 flex flex-col gap-3 sm:flex-row sm:flex-wrap sm:items-start sm:justify-between">
            <form onSubmit={doFind} className="flex min-w-0 flex-wrap items-center gap-2 sm:flex-1" aria-label="Find in free boxes">
              <label htmlFor="free-find" className="sr-only">Find by nickname or species</label>
              <div className="relative min-w-0 flex-1 sm:max-w-[240px]">
                <Search size={14} className="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-vault-faint" />
                <input id="free-find" className="field pl-8" placeholder="Find: nickname or species" value={find}
                  onChange={(e) => { setFind(e.target.value); setFound({ q: '', i: -1, total: 0 }); }} />
              </div>
              <button type="submit" className="btn">{found.total > 1 ? 'Next' : 'Find'}</button>
              {found.q && (
                <span role="status" className="w-full text-xs" style={{ color: found.total ? 'var(--muted)' : 'var(--bad)' }}>
                  {found.total ? `Match ${found.i + 1} of ${found.total}` : `Nothing in your free boxes matches “${find.trim()}”.`}
                </span>
              )}
            </form>
            {!confirmDelete ? (
              <div className="flex gap-2">
                <button type="button" className="btn" onClick={onAddBox} disabled={freeBoxes.length >= MAX_FREE_BOXES}><Plus size={14} /> Add box</button>
                {freeBoxes.length > 1 && <button type="button" className="btn" onClick={() => setConfirmDelete(true)}><Trash2 size={14} /> Delete box</button>}
              </div>
            ) : (
              <div className="flex flex-wrap items-center gap-2 rounded-xl border border-vault-bad px-3 py-2 text-sm" role="alertdialog" aria-label="Confirm delete box">
                <span>{filled ? `Delete ${box.name} and the ${filled} Pokémon in it?` : `Delete ${box.name}?`}</span>
                <button type="button" className="btn btn-ember" onClick={() => { onDeleteBox(box.id); setConfirmDelete(false); }}>Delete</button>
                <button type="button" className="btn" onClick={() => setConfirmDelete(false)}>Cancel</button>
              </div>
            )}
          </div>
        </section>

        <section className="panel min-w-0 p-5" aria-labelledby="free-list-title">
          <div className="flex flex-wrap items-baseline justify-between gap-x-3">
            <h2 id="free-list-title" className="font-display text-lg font-bold uppercase tracking-wide">All Free Boxes</h2>
            <span className="eyebrow">{freeBoxes.length} of {MAX_FREE_BOXES}</span>
          </div>
          <ul className="strip mt-3 grid max-h-[460px] gap-1.5 overflow-y-auto pr-1">
            {freeBoxes.map((b, i) => {
              const c = freeCount(b);
              return (
                <li key={b.id}>
                  <button type="button" className="free-row" aria-current={b.id === box.id ? 'true' : undefined} onClick={() => setCurrentId(b.id)}>
                    <span className="mono w-6 shrink-0 text-xs text-vault-faint">{i + 1}</span>
                    <span className="min-w-0 flex-1 truncate font-semibold">{b.name}</span>
                    <span className="mono shrink-0 text-xs text-vault-muted">{c}/{BOX_SIZE}</span>
                    <span className="bar-track w-14 shrink-0"><span className="bar-fill block" style={{ width: `${(c / BOX_SIZE) * 100}%`, background: c === BOX_SIZE ? 'var(--ok)' : 'var(--ember)' }} /></span>
                  </button>
                </li>
              );
            })}
          </ul>
          <button type="button" className="btn mt-3" onClick={onAddBox} disabled={freeBoxes.length >= MAX_FREE_BOXES}><Plus size={14} /> Add box</button>
        </section>
      </div>
    </div>
  );
}

/* ---------------------------------------------------------------------
   15b. MEGA EVOLUTION: every Mega and Primal, with the stones you own.
   Megas exist only in battle, so a Mega is "ready" when its base species
   is in your Pokédex and you have its stone.
   --------------------------------------------------------------------- */
function MegaCard({ m, base, baseCaught, hasStone, onToggleStone, onOpen }) {
  const ready = baseCaught && (m.stone ? hasStone : true);
  const gain = m.bst - m.baseBst;
  return (
    <li className={`mega-card ${ready ? 'is-ready' : ''}`}>
      <button type="button" className="flex w-full items-center gap-3 text-left" onClick={() => onOpen(m)} aria-label={`${m.name}: open details`}>
        <span className="h-[72px] w-[72px] shrink-0 rounded-xl bg-vault-bg p-1"><Sprite id={m.id} /></span>
        <span className="min-w-0 flex-1">
          <span className="mono block text-[11px] text-vault-faint">{pad4(m.dex)}</span>
          <span className="block truncate font-semibold leading-tight">{m.name}</span>
          <span className="mt-1 flex flex-wrap gap-1">{m.types.map((t) => <TypeChip key={t} type={t} small />)}</span>
          {m.isNew ? <span className="mt-1 block text-[11px] font-semibold" style={{ color: 'var(--ember)' }}>New from PokeAPI</span>
            : <span className="mono mt-1 block text-[11px] text-vault-muted">Stats {m.baseBst} → {m.bst}{gain ? <strong className="ml-1" style={{ color: 'var(--ok)' }}>+{gain}</strong> : null}</span>}
        </span>
      </button>
      <div className="mt-3 grid gap-1.5 border-t border-vault-line pt-3 text-xs">
        <p className="flex items-center gap-1.5" style={{ color: baseCaught ? 'var(--ok)' : 'var(--muted)' }}>
          {baseCaught ? <Check size={13} /> : <CircleDashed size={13} />}
          {baseCaught ? `${base} is in your Pokédex` : `${base} not caught yet`}
        </p>
        {m.stone ? (
          <button type="button" className={`stone-toggle ${hasStone ? 'is-on' : ''}`} aria-pressed={hasStone} onClick={() => onToggleStone(m.stone, m.item)}>
            <Gem size={13} /> {hasStone ? `Have ${m.item}` : `Need ${m.item}`}
          </button>
        ) : m.isNew ? (
          <p className="flex items-center gap-1.5 text-vault-muted"><Info size={13} /> Its Mega Stone isn’t listed on PokeAPI yet</p>
        ) : (
          <p className="flex items-center gap-1.5 text-vault-muted"><Sparkles size={13} /> Rayquaza needs the move Dragon Ascent</p>
        )}
      </div>
    </li>
  );
}

function MegaTab({ megas, caught, stones, onToggleStone, onOpen, index }) {
  const [filter, setFilter] = useState('all');
  const [q, setQ] = useState('');
  const has = (m) => !!(m.stone && stones[m.stone]);
  const baseCaught = (m) => !!caught[m.dex];
  const isReady = (m) => baseCaught(m) && (m.stone ? has(m) : true);
  const stoneKeys = [...new Set(megas.filter((m) => m.stone).map((m) => m.stone))];
  const owned = stoneKeys.filter((k) => stones[k]).length;
  const readyCount = megas.filter(isReady).length;
  const sk = searchKey(q);
  const list = megas.filter((m) => (!sk || m.sk.includes(sk) || searchKey(m.item).includes(sk))
    && (filter === 'all' || filter === m.debut || (filter === 'ready' && isReady(m)) || (filter === 'missing' && m.stone && !has(m))));
  const order = [...Object.keys(MEGA_DEBUTS), 'new'];
  const groups = order.map((d) => [d, list.filter((m) => (MEGA_DEBUTS[m.debut] ? m.debut : 'new') === d)]).filter(([, l]) => l.length);
  const chips = [['all', 'All'], ...Object.entries(MEGA_DEBUTS).map(([k, v]) => [k, v.label]), ['ready', 'Ready to use'], ['missing', 'Missing stone']];
  const baseName = (m) => (index.byId.get(m.dex) || { name: `#${m.dex}` }).name;

  return (
    <div className="grid min-w-0 gap-5">
      <section className="panel min-w-0 p-5 sm:p-6" aria-labelledby="mega-title">
        <div className="flex flex-wrap items-end justify-between gap-4">
          <div className="min-w-0">
            <p className="eyebrow">Battle-only forms</p>
            <h1 id="mega-title" className="font-display mt-1 text-3xl font-bold uppercase tracking-wide">Mega Evolution</h1>
            <p className="mt-1.5 max-w-2xl text-sm text-vault-muted">
              A Pokémon holding its Mega Stone can Mega Evolve once per battle, gaining 100 base stat points, a new ability and sometimes a new type.
              Megas can’t be stored in HOME, so this tab tracks the base Pokémon in your Pokédex and the stones you own.
            </p>
          </div>
          <dl className="flex gap-6">
            <div><dt className="eyebrow">Megas</dt><dd className="mono text-xl font-semibold">{megas.length}</dd></div>
            <div><dt className="eyebrow">Stones</dt><dd className="mono text-xl font-semibold">{owned}<span className="text-vault-faint">/{stoneKeys.length}</span></dd></div>
            <div><dt className="eyebrow">Ready</dt><dd className="mono text-xl font-semibold" style={{ color: 'var(--ember)' }}>{readyCount}</dd></div>
          </dl>
        </div>
        <div className="mt-4 flex flex-col gap-3 md:flex-row md:items-center">
          <div className="relative min-w-0 md:w-72">
            <Search size={15} className="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-vault-faint" />
            <label htmlFor="mega-search" className="sr-only">Search Megas or Mega Stones</label>
            <input id="mega-search" className="field pl-9" placeholder="Search Megas or stones" value={q} onChange={(e) => setQ(e.target.value)} />
          </div>
          <div className="flex flex-wrap gap-1.5" role="tablist" aria-label="Filter Megas">
            {chips.map(([key, text]) => (
              <button key={key} type="button" role="tab" aria-selected={filter === key} onClick={() => setFilter(key)}
                className="rounded-lg border px-3 py-1.5 text-xs font-semibold"
                style={filter === key ? { borderColor: 'var(--ember)', background: 'var(--ember-soft)', color: 'var(--fg)' } : { borderColor: 'var(--line)', color: 'var(--muted)' }}>
                {text}
              </button>
            ))}
          </div>
        </div>
      </section>

      {groups.length === 0 && <p className="panel p-6 text-center text-sm text-vault-muted">No Megas match that search or filter.</p>}
      {groups.map(([debut, items]) => (
        <section key={debut} aria-label={MEGA_DEBUTS[debut] ? MEGA_DEBUTS[debut].label : 'New from PokeAPI'}>
          <div className="mb-3 flex flex-wrap items-baseline gap-x-3">
            <h2 className="font-display text-lg font-bold uppercase tracking-wide">{MEGA_DEBUTS[debut] ? MEGA_DEBUTS[debut].label : 'New from PokeAPI'}</h2>
            <span className="eyebrow">{MEGA_DEBUTS[debut] ? `${MEGA_DEBUTS[debut].year} · ` : ''}{items.length} {items.length === 1 ? 'form' : 'forms'}</span>
          </div>
          <ul className="grid gap-3 [grid-template-columns:repeat(auto-fill,minmax(250px,1fr))]">
            {items.map((m) => (
              <MegaCard key={m.id} m={m} base={baseName(m)} baseCaught={baseCaught(m)} hasStone={has(m)} onToggleStone={onToggleStone} onOpen={onOpen} />
            ))}
          </ul>
        </section>
      ))}
    </div>
  );
}

/* ---------------------------------------------------------------------
   15c. LIVE UPDATES FROM POKEAPI
   Once every 6 hours (when PokeAPI is reachable) the app compares PokeAPI's
   lists with this build: Pokémon ids above maxPokemonId are new forms or
   Megas, unknown version groups are new games, unknown types are new types.
   New species arrive through useSpeciesList. Everything new appears in the
   Omnidex, the Mega tab, Free Boxes and the Field Guide's "What's new" page.
   --------------------------------------------------------------------- */
const LIVE_KEY = 'livingFormDex:live:v1';
const LIVE_EVERY = 6 * 3600 * 1000;

function baseDexFromKey(key, species) {
  const parts = key.split('-');
  for (let n = parts.length - 1; n >= 1; n--) {
    const sk = parts.slice(0, n).join('');
    const hit = species.find((s) => s.sk === sk);
    if (hit) return hit.dex;
  }
  return 0;
}
function megaNameFromKey(key) {
  const [base, rest = ''] = key.split('-mega');
  const letter = rest.replace(/^-/, '').toUpperCase();
  return `Mega ${prettify(base)}${letter ? ` ${letter}` : ''}`;
}

function useLiveCatalog(sourceStatus) {
  const [live, setLive] = useState(() => {
    try { const c = JSON.parse(safeStorage.get(LIVE_KEY) || 'null'); return c && c.maxPokemonId === D.maxPokemonId ? c : null; } catch { return null; }
  });
  const [fresh, setFresh] = useState(null);       // what this check found that the previous one hadn't
  useEffect(() => {
    if (sourceStatus !== 'live') return undefined;
    if (live && Date.now() - live.checkedAt < LIVE_EVERY && live.maxPokemonId === D.maxPokemonId) return undefined;
    let cancelled = false;
    Promise.all([
      fetchJSON(`${API}/pokemon?limit=100000`, { timeout: 20000 }),
      fetchJSON(`${API}/version-group?limit=1000`),
      fetchJSON(`${API}/type?limit=1000`),
    ]).then(([pk, vg, ty]) => {
      if (cancelled) return;
      const forms = pk.results.map((r) => ({ id: idFromUrl(r.url), key: r.name }))
        .filter((r) => r.id > D.maxPokemonId)
        .map((r) => ({ ...r, mega: /-mega(-|$)/.test(r.key) || r.key.endsWith('-primal') }));
      const next = {
        checkedAt: Date.now(),
        maxPokemonId: D.maxPokemonId,
        forms,
        games: vg.results.map((r) => r.name).filter((n) => !VERSION_GROUPS.has(n)),
        types: ty.results.map((r) => r.name).filter((n) => !(n in TYPE_COLORS)),
      };
      const before = live ? live.forms.length + live.games.length + live.types.length : 0;
      const after = next.forms.length + next.games.length + next.types.length;
      if (after > before) setFresh({ forms: next.forms.length - (live ? live.forms.length : 0), games: next.games.length - (live ? live.games.length : 0), types: next.types.length - (live ? live.types.length : 0) });
      safeStorage.set(LIVE_KEY, JSON.stringify(next));
      setLive(next);
    }).catch(() => { /* try again next load */ });
    return () => { cancelled = true; };
  }, [sourceStatus]); // eslint-disable-line react-hooks/exhaustive-deps
  return [live, fresh];
}

// New forms and Megas found by the live check, shaped like the built-in lists
function liveEntries(live, species) {
  if (!live) return { forms: [], megas: [] };
  const forms = [];
  const megas = [];
  live.forms.forEach((f) => {
    const dex = baseDexFromKey(f.key, species);
    if (f.mega) {
      const name = f.key.endsWith('-primal') ? `Primal ${prettify(f.key.replace('-primal', ''))}` : megaNameFromKey(f.key);
      megas.push({ id: f.id, key: f.key, name, dex, item: '', debut: 'new', types: [], bst: 0, baseBst: 0, sk: searchKey(name), kind: 'mega', stone: null, isNew: true });
    } else {
      const name = prettify(f.key);
      if (dex) LIVE_FORM_DEX.set(f.id, dex);
      forms.push({ id: f.id, key: f.key, name, dex: dex || f.id, sk: searchKey(name), kind: 'variety', isNew: true });
    }
  });
  return { forms, megas };
}

/* ---------------------------------------------------------------------
   15d. FIELD GUIDE: an interactive book about how Pokémon work.
   Natures, the type chart and stat maths come from PokeAPI data; the
   prose covers mechanics as they stand in Scarlet & Violet and Legends: Z-A.
   --------------------------------------------------------------------- */
const TYPE_ORDER = D.typeOrder;
const TYPE_FACTOR = { 0: 0, h: 0.5, 1: 1, 2: 2 };
const typeFactor = (atk, def) => TYPE_FACTOR[D.typeChart[TYPE_ORDER.indexOf(atk) * TYPE_ORDER.length + TYPE_ORDER.indexOf(def)]];
const NATURES = D.natures.map(([name, plus, minus, likes, hates]) => ({ name, plus, minus, likes, hates, neutral: plus === minus }));
const NATURE_STATS = ['attack', 'defense', 'spAtk', 'spDef', 'speed'];
const FLAVOR_STAT = { spicy: 'Attack', sour: 'Defense', dry: 'Sp. Atk', bitter: 'Sp. Def', sweet: 'Speed' };
const fmtFactor = (f) => (f === 0.25 ? '¼×' : f === 0.5 ? '½×' : `${f}×`);

function GuideP({ children }) { return <p className="max-w-[68ch] text-[15px] leading-relaxed text-vault-fg/90">{children}</p>; }
function GuideNote({ children }) { return <p className="max-w-[68ch] rounded-xl border border-vault-line bg-vault-bg px-4 py-3 text-sm text-vault-muted">{children}</p>; }
function GuideList({ items }) {
  return <ul className="grid max-w-[68ch] gap-1.5 text-[15px] leading-relaxed">{items.map((t, i) => <li key={i} className="flex gap-2.5"><span className="mt-[9px] h-1.5 w-1.5 shrink-0 rounded-full bg-vault-ember" /><span className="min-w-0">{t}</span></li>)}</ul>;
}
function GuideFigure({ title, children }) {
  return (
    <figure className="min-w-0 rounded-2xl border border-vault-line bg-vault-bg p-4 sm:p-5">
      {title && <figcaption className="eyebrow mb-3">{title}</figcaption>}
      {children}
    </figure>
  );
}
function TypeButton({ type, on, onClick, children }) {
  const bg = TYPE_COLORS[type] || '#64748b';
  return (
    <button type="button" onClick={onClick} aria-pressed={on}
      className="rounded-md px-2 py-1 font-display text-[11px] font-semibold uppercase tracking-wider transition"
      style={on ? { background: bg, color: textOn(bg), boxShadow: '0 0 0 2px var(--fg)' } : { background: 'transparent', color: bg, boxShadow: `inset 0 0 0 1px ${bg}` }}>
      {children || type}
    </button>
  );
}

      <datalist id={`${id}-list`}>{opts.map((e) => <option key={e.id} value={e.name} />)}</datalist>

function usePokemon(id) {
  const [view, setView] = useState({ status: 'loading', data: null });
  useEffect(() => {
    if (id == null) return undefined;
    let alive = true;
    setView({ status: 'loading', data: null });
    fetchPokemon(id).then((data) => alive && setView({ status: 'ready', data })).catch(() => alive && setView({ status: 'error', data: null }));
    return () => { alive = false; };
  }, [id]);
  return view;
}

const STAT_KEYS = ['hp', 'attack', 'defense', 'spAtk', 'spDef', 'speed'];
function calcStat(key, base, iv, ev, level, mult) {
  const core = Math.floor(((2 * base + iv + Math.floor(ev / 4)) * level) / 100);
  if (key === 'hp') return base === 1 ? 1 : core + level + 10;       // Shedinja always has 1 HP
  return Math.floor((core + 5) * mult);
}
function StatCalcPage({ ctx }) {
  const start = ctx.index.byId.get(ctx.guardianId) || ctx.index.byId.get(6);
  const [entry, setEntry] = useState(start);
  const view = usePokemon(entry ? entry.id : null);
  const [level, setLevel] = useState(ctx.guardianLevel || 100);
  const [nature, setNature] = useState('Timid');
  const [ivs, setIvs] = useState({ hp: 31, attack: 31, defense: 31, spAtk: 31, spDef: 31, speed: 31 });
  const [evs, setEvs] = useState({ hp: 4, attack: 0, defense: 0, spAtk: 252, spDef: 0, speed: 252 });
  const n = NATURES.find((x) => x.name === nature);
  const evTotal = Object.values(evs).reduce((a, b) => a + b, 0);
  const setEv = (k, v) => setEvs((cur) => {
    const others = evTotal - cur[k];
    return { ...cur, [k]: Math.max(0, Math.min(252, 510 - others, v || 0)) };
  });
  const d = view.data;
  return (
    <>
      <GuideP>Pick a Pokémon and adjust its level, nature, IVs and EVs to see its real stats. It starts with your guardian.</GuideP>
      <GuideFigure>
        <div className="grid gap-3 sm:grid-cols-[minmax(0,1fr)_110px_minmax(0,1fr)]">
          <SpeciesField id="guide-calc" label="Species" index={ctx.index} value={entry} onPick={setEntry} />
          <label htmlFor="calc-level" className="grid gap-1 text-xs text-vault-muted">Level
            <input id="calc-level" type="number" min="1" max="100" className="field mono" value={level} onChange={(e) => setLevel(clampLevel(e.target.value))} />
          </label>
          <label htmlFor="calc-nature" className="grid gap-1 text-xs text-vault-muted">Nature
            <select id="calc-nature" className="field" value={nature} onChange={(e) => setNature(e.target.value)}>
              {NATURES.map((x) => <option key={x.name} value={x.name}>{x.name}{x.neutral ? ' (neutral)' : ` (+${STAT_SHORT[x.plus]} −${STAT_SHORT[x.minus]})`}</option>)}
            </select>
          </label>
        </div>
        {view.status === 'loading' && <div className="skeleton mt-4 h-48" />}
        {d && (
          <div className="mt-4 overflow-x-auto">
            <table className="w-full min-w-[420px] text-sm">
              <thead><tr className="eyebrow text-left"><th className="py-2">Stat</th><th>Base</th><th>IV</th><th>EV</th><th className="text-right">Final</th></tr></thead>
              <tbody>
                {STAT_KEYS.map((k) => {
                  const mult = k === 'hp' || n.neutral ? 1 : k === n.plus ? 1.1 : k === n.minus ? 0.9 : 1;
                  const final = calcStat(k, d.stats[k], ivs[k], evs[k], level, mult);
                  return (
                    <tr key={k} className="border-t border-vault-line">
                      <td className="py-1.5">{STAT_LABEL[k]}{mult !== 1 && <span className="mono ml-1.5 text-xs" style={{ color: mult > 1 ? 'var(--ok)' : 'var(--bad)' }}>{mult > 1 ? '+' : '−'}</span>}</td>
                      <td className="mono">{d.stats[k]}</td>
                      <td><input aria-label={`${STAT_LABEL[k]} IV`} type="number" min="0" max="31" className="field mono w-16 px-2 py-1" value={ivs[k]}
                        onChange={(e) => setIvs((cur) => ({ ...cur, [k]: Math.max(0, Math.min(31, parseInt(e.target.value, 10) || 0)) }))} /></td>
                      <td><input aria-label={`${STAT_LABEL[k]} EV`} type="number" min="0" max="252" step="4" className="field mono w-20 px-2 py-1" value={evs[k]}
                        onChange={(e) => setEv(k, parseInt(e.target.value, 10))} /></td>
                      <td className="mono text-right text-lg font-semibold">{final}</td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
            <p className="mono mt-2 text-xs" style={{ color: evTotal === 510 ? 'var(--ok)' : 'var(--muted)' }}>EVs used {evTotal}/510</p>
          </div>
        )}
      </GuideFigure>
    </>
  );
}

const GUIDE_PAGES = GUIDE.flatMap((ch) => ch.pages.map(([id, title, Body]) => ({ id, title, Body, chapter: ch })));

function FieldGuide({ pageId, setPageId, ctx }) {
  const at = Math.max(0, GUIDE_PAGES.findIndex((p) => p.id === pageId));
  const page = GUIDE_PAGES[at];
  const prev = GUIDE_PAGES[at - 1];
  const next = GUIDE_PAGES[at + 1];
  const topRef = useRef(null);
  const go = useCallback((id) => {
    setPageId(id);
    if (topRef.current && topRef.current.getBoundingClientRect().top < 0) topRef.current.scrollIntoView({ block: 'start' });
  }, [setPageId]);

  useEffect(() => {
    const onKey = (e) => {
      if (e.defaultPrevented || e.altKey || e.ctrlKey || e.metaKey) return;
      if (e.target.closest && e.target.closest('input, select, textarea')) return;
      if (document.querySelector('[role="dialog"]')) return;
      if (e.key === 'ArrowRight' && next) go(next.id);
      if (e.key === 'ArrowLeft' && prev) go(prev.id);
    };
    document.addEventListener('keydown', onKey);
    return () => document.removeEventListener('keydown', onKey);
  }, [prev, next, go]);

  const pageCtx = { ...ctx, goPage: go };
  const Body = page.Body;

/* ---------------------------------------------------------------------
   15e. SHARED: every stored record, for the Journal, Superdex and Hunt
   --------------------------------------------------------------------- */
const EARLIEST_CATCH = new Date(1996, 1, 27).getTime();       // Red & Green's release day
function allRecords(caught, freeBoxes) {
  const out = [];
  Object.entries(caught).forEach(([id, rec]) => out.push({ pokemonId: +id, rec, where: 'dex' }));
  freeBoxes.forEach((b) => Object.entries(b.slots).forEach(([slot, rec]) => out.push({ pokemonId: rec.pokemonId, rec, where: 'free', boxId: b.id, boxName: b.name, slot: +slot })));
  return out;
}
const dayKey = (ts) => toDateInput(ts);
const fmtDay = (key, opts = { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' }) => { const [y, m, d] = key.split('-').map(Number); return new Date(y, m - 1, d).toLocaleDateString(undefined, opts); };
const fmtTime = (ts) => new Date(ts).toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
const fmtDateTime = (ts) => new Date(ts).toLocaleString(undefined, { day: 'numeric', month: 'short', year: 'numeric', hour: 'numeric', minute: '2-digit' });
const addDays = (key, n) => { const [y, m, d] = key.split('-').map(Number); return dayKey(new Date(y, m - 1, d + n).getTime()); };

// One log entry per deposit. A free-box Pokémon also registers its species at the same moment; show it once.
function buildEvents(caught, freeBoxes) {
  const ev = [];
  const fromFree = new Set();
  freeBoxes.forEach((b) => Object.entries(b.slots).forEach(([slot, r]) => {
    ev.push({ at: r.caughtAt, id: r.pokemonId, rec: r, where: 'free', boxId: b.id, boxName: b.name, slot: +slot });
    fromFree.add(`${dexSlotFor(r.pokemonId)}|${r.caughtAt}`);
  }));
  Object.entries(caught).forEach(([id, r]) => { if (!fromFree.has(`${id}|${r.caughtAt}`)) ev.push({ at: r.caughtAt, id: +id, rec: r, where: 'dex' }); });
  return ev.filter((e) => e.at >= EARLIEST_CATCH).sort((a, b) => a.at - b.at);
}

function catchStats(events, remaining) {
  const byDay = new Map();
  events.forEach((e) => { const k = dayKey(e.at); if (!byDay.has(k)) byDay.set(k, []); byDay.get(k).push(e); });
  const days = [...byDay.keys()].sort();
  let best = null;
  byDay.forEach((list, k) => { if (!best || list.length > best.n) best = { key: k, n: list.length }; });
  let longest = 0; let run = 0; let prev = null;
  days.forEach((k) => { run = prev && addDays(prev, 1) === k ? run + 1 : 1; longest = Math.max(longest, run); prev = k; });
  const today = dayKey(Date.now());
  let cur = 0;
  let k = byDay.has(today) ? today : addDays(today, -1);
  while (byDay.has(k)) { cur++; k = addDays(k, -1); }
  const now = Date.now();
  const first = events.length ? events[0].at : now;
  const windowDays = Math.max(1, Math.min(30, Math.ceil((now - first) / 86400000)));
  const recent = events.filter((e) => e.at >= now - windowDays * 86400000).length;
  const perDay = recent / windowDays;
  const etaDays = remaining > 0 && perDay > 0 ? Math.ceil(remaining / perDay) : null;
  return { byDay, days, best, longest, current: cur, perDay, windowDays, recent, etaDays, first: events.length ? events[0].at : null };
}

/* Milestones: computed from the save; the time logged is the moment the last piece fell into place. */
const MILESTONE_COUNTS = [50, 100, 250, 500, 750, 1000];
function computeMilestones(state, species, gens, boxes, sdOwned) {
  const { caught, freeBoxes } = state;
  const out = {};
  const finished = (ids) => { let m = 0; for (const id of ids) { const r = caught[id]; if (!r) return null; m = Math.max(m, r.caughtAt || 0); } return ids.length ? m || 1 : null; };
  gens.forEach((g) => {
    const ids = []; for (let d = g.start; d <= Math.min(g.end, species.length); d++) ids.push(d);
    const t = finished(ids); if (t) out[`gen:${g.gen}`] = t;
  });
  const all = finished(species.map((x) => x.id)); if (all) out['dex:all'] = all;
  ANNEX_BOXES.filter((a) => a.region).forEach((a) => { const t = finished(REGIONAL.filter((f) => f.region === a.region).map((f) => f.id)); if (t) out[`forms:${a.region}`] = t; });
  boxes.forEach((b) => {
    if (b.prefix !== 'HOME') return;                      // custom layouts change; HOME boxes don't
    const ids = b.slots.filter(Boolean).map((e) => e.id);
    const t = ids.length ? finished(ids) : null;
    if (t) out[`box:${b.prefix.toLowerCase()}-${b.number}`] = t;
  });
  const times = species.map((x) => caught[x.id] && caught[x.id].caughtAt).filter(Boolean).sort((a, b) => a - b);
  MILESTONE_COUNTS.forEach((n) => { if (times.length >= n) out[`count:${n}`] = times[n - 1]; });
  const shinies = allRecords(caught, freeBoxes).filter((x) => x.rec.shiny).map((x) => x.rec.caughtAt).sort((a, b) => a - b);
  [1, 10, 50].forEach((n) => { if (shinies.length >= n) out[`shiny:${n}`] = shinies[n - 1]; });
  D.superdexSets.forEach((set) => {
    if (set.key === 'gender') return;
    const ts = set.items.map((it) => sdOwned(set, it));
    if (ts.every(Boolean)) out[`sd:${set.key}`] = Math.max(...ts.map((t) => (typeof t === 'number' ? t : 1)));
  });
  return out;
}
function milestoneLabel(key, gens) {
  const [kind, v] = key.split(':');
  if (kind === 'gen') { const g = gens.find((x) => String(x.gen) === v); return g ? `Generation ${g.roman} complete · ${g.region}` : `Generation ${v} complete`; }
  if (kind === 'dex') return 'National Pokédex complete';
  if (kind === 'forms') return `Every ${{ alola: 'Alolan', galar: 'Galarian', hisui: 'Hisuian', paldea: 'Paldean' }[v] || v} form registered`;
  if (kind === 'box') { const [p, n] = v.split('-'); return `${p === 'home' ? 'HOME' : 'Box'} ${n} filled`; }
  if (kind === 'count') return `${v} species registered`;
  if (kind === 'shiny') return v === '1' ? 'First shiny logged' : `${v} shinies logged`;
  if (kind === 'sd') { const set = D.superdexSets.find((x) => x.key === v); return `${set ? set.title : v} complete`; }
  return key;
}
const milestoneIcon = (key) => ({ gen: Crown, dex: Trophy, forms: Shapes, box: LayoutGrid, count: Flag, shiny: Sparkles, sd: Gem }[key.split(':')[0]] || Milestone);

// Superdex ownership: from your stored Pokémon, or ticked by hand. Returns a timestamp or null.
function useSuperdexOwnership(caught, freeBoxes, superdex) {
  return useMemo(() => {
    const byPid = new Map();
    allRecords(caught, freeBoxes).forEach(({ pokemonId, rec }) => { if (!byPid.has(pokemonId)) byPid.set(pokemonId, []); byPid.get(pokemonId).push(rec); });
    const derived = (set, it) => {
      if (set.key === 'gender') {
        const want = it.k.endsWith('-f') ? 'female' : 'male';
        const r = (byPid.get(it.dex) || []).find((x) => x.gender === want);
        return r ? r.caughtAt || 1 : null;
      }
      if (!it.pid) return null;
      const list = byPid.get(it.pid) || [];
      let r;
      if (!it.form) r = list[0];
      else if (it.form === 'gmax') r = list.find((x) => x.gmax);
      else { const def = defaultForm(it.pid); r = list.find((x) => (x.form || def) === it.form); }
      return r ? r.caughtAt || 1 : null;
    };
    const owned = (set, it) => derived(set, it) || superdex[`${set.key}:${it.k}`] || null;
    return { derived, owned };
  }, [caught, freeBoxes, superdex]);
}

function StatTile({ label, value, sub, icon: Icon, color }) {

const heat = (n, max) => (n ? `rgba(255, 123, 53, ${0.22 + 0.68 * Math.min(1, n / Math.max(1, max))})` : 'transparent');

function CatchCalendar({ byDay, selected, onSelect }) {
  const today = dayKey(Date.now());
  const [ym, setYm] = useState(() => (selected || today).slice(0, 7));
  useEffect(() => { if (selected) setYm(selected.slice(0, 7)); }, [selected]);
  const [y, m] = ym.split('-').map(Number);
  const first = new Date(y, m - 1, 1);
  const lead = (first.getDay() + 6) % 7;                               // Monday first
  const count = new Date(y, m, 0).getDate();
  const max = Math.max(1, ...[...byDay.values()].map((l) => l.length));
  const cells = [...Array(lead).fill(null), ...Array.from({ length: count }, (_, i) => `${ym}-${pad2(i + 1)}`)];
  const shift = (n) => { const d = new Date(y, m - 1 + n, 1); setYm(`${d.getFullYear()}-${pad2(d.getMonth() + 1)}`); };
  const monthTotal = [...byDay.entries()].filter(([k]) => k.startsWith(ym)).reduce((a, [, l]) => a + l.length, 0);
  return (
    <div>
      <div className="flex items-center gap-2">
        <button type="button" className="btn px-2" onClick={() => shift(-1)} aria-label="Previous month"><ChevronLeft size={16} /></button>
        <p className="min-w-0 flex-1 text-center font-semibold">{first.toLocaleDateString(undefined, { month: 'long', year: 'numeric' })}
          <span className="mono ml-2 text-xs font-normal text-vault-muted">{monthTotal} logged</span></p>
        <button type="button" className="btn px-2" onClick={() => shift(1)} aria-label="Next month"><ChevronRight size={16} /></button>
      </div>
      <div className="mt-3 grid grid-cols-7 gap-1 text-center" role="grid" aria-label="Catch calendar">
        {['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].map((d) => <span key={d} className="eyebrow py-1 text-[10px]">{d}</span>)}
        {cells.map((k, i) => {
          if (!k) return <span key={`x${i}`} />;
          const list = byDay.get(k);
          const n = list ? list.length : 0;
          return (
            <button key={k} type="button" onClick={() => onSelect(k)} aria-pressed={selected === k} disabled={k > today}
              aria-label={`${fmtDay(k)}: ${n ? `${n} logged` : 'nothing logged'}`}
              className="relative aspect-square rounded-lg border text-xs transition disabled:opacity-30"
              style={{ background: heat(n, max), borderColor: selected === k ? 'var(--fg)' : k === today ? 'var(--ember)' : 'var(--line)', color: n ? 'var(--fg)' : 'var(--muted)' }}>
              <span className="absolute left-1.5 top-1 font-semibold">{+k.slice(8)}</span>
              {n > 0 && <span className="mono absolute bottom-1 right-1.5 text-[10px] font-semibold">{n}</span>}
            </button>
          );
        })}
      </div>
    </div>
  );
}

function YearStrip({ byDay, onSelect, selected }) {
  const today = new Date();
  const end = dayKey(today.getTime());
  const startDate = new Date(today.getFullYear(), today.getMonth(), today.getDate() - 364);
  const start = dayKey(startDate.getTime() - ((startDate.getDay() + 6) % 7) * 86400000);
  const weeks = [];
  for (let k = start, w = []; k <= end; k = addDays(k, 1)) { w.push(k); if (w.length === 7) { weeks.push(w); w = []; } if (addDays(k, 1) > end && w.length) weeks.push(w); }
  const max = Math.max(1, ...[...byDay.values()].map((l) => l.length));
  return (
    <div className="strip overflow-x-auto pb-1">
      <div className="flex gap-[3px]" role="group" aria-label="Last 12 months">
        {weeks.map((w) => (
          <div key={w[0]} className="grid gap-[3px]">
            {w.map((k) => {
              const n = (byDay.get(k) || []).length;
              return <button key={k} type="button" onClick={() => onSelect(k)} title={`${fmtDay(k)}: ${n}`} aria-label={`${fmtDay(k)}: ${n} logged`}
                className="h-[11px] w-[11px] rounded-[3px]" style={{ background: n ? heat(n, max) : 'var(--panel-2)', outline: selected === k ? '1.5px solid var(--fg)' : 'none' }} />;
            })}
          </div>
        ))}
      </div>
    </div>
  );
}

function JournalTab({ state, index, species, gens, boxes, milestones, onOpenEvent, onExport }) {
  const { caught, freeBoxes } = state;
  const events = useMemo(() => buildEvents(caught, freeBoxes), [caught, freeBoxes]);
  const livingTotal = species.length + REGIONAL.length;
  const livingCaught = species.filter((x) => caught[x.id]).length + REGIONAL.filter((f) => caught[f.id]).length;
  const st = useMemo(() => catchStats(events, livingTotal - livingCaught), [events, livingTotal, livingCaught]);
  const [day, setDay] = useState(() => (st.days.length ? st.days[st.days.length - 1] : null));
  const dayEvents = day ? st.byDay.get(day) || [] : [];
  const records = useMemo(() => allRecords(caught, freeBoxes), [caught, freeBoxes]);
  const shinies = records.filter((x) => x.rec.shiny).length;
  const ribbons = records.reduce((a, x) => a + ((x.rec.ribbons || []).length), 0);
  const checks = useMemo(() => records.filter((x) => x.rec.origin || x.rec.ball || x.rec.met || (x.rec.ribbons && x.rec.ribbons.length)).map((x) => {
    const entry = index.byId.get(x.pokemonId);
    const list = checkRecord(entry, x.rec);
    return { ...x, entry, list, worst: worstCheck(list) };
  }), [records, index]);
  const native = checks.filter((c) => c.rec.origin && c.list.some((l) => l.level === 'ok' && l.text.startsWith('Native'))).length;
  const withOrigin = checks.filter((c) => c.rec.origin).length;
  const problems = checks.filter((c) => c.worst === 'error' || c.worst === 'warn').sort((a, b) => (a.worst === 'error' ? -1 : 1) - (b.worst === 'error' ? -1 : 1));
  const decorated = records.filter((x) => (x.rec.ribbons || []).length).sort((a, b) => b.rec.ribbons.length - a.rec.ribbons.length).slice(0, 6);
  const ms = Object.entries(milestones).sort((a, b) => b[1] - a[1]);
  const nameOf = (x) => { const e = index.byId.get(x.id != null ? x.id : x.pokemonId); return (x.rec && x.rec.nickname) || (e ? e.name : 'Pokémon'); };
  const eta = st.etaDays != null ? new Date(Date.now() + st.etaDays * 86400000) : null;

  return (
    <div className="grid min-w-0 gap-5">
      <section className="panel min-w-0 p-5 sm:p-6" aria-labelledby="journal-title">
        <div className="flex flex-wrap items-end justify-between gap-3">
          <div>
            <p className="eyebrow">Hunting log</p>
            <h1 id="journal-title" className="font-display text-3xl font-bold uppercase tracking-wide sm:text-4xl">Catch Journal</h1>
            <p className="mt-1 max-w-[62ch] text-sm text-vault-muted">Every Pokémon you register is logged on the day it was caught. Change a date in a Pokémon’s Collector details to backfill older catches.</p>
          </div>
          <button type="button" className="btn btn-ember" onClick={onExport}><Download size={14} /> Bragging Rights image</button>
        </div>
        <div className="mt-5 grid grid-cols-2 gap-3 lg:grid-cols-4">
          <StatTile icon={Flame} label="Current streak" value={`${st.current} day${st.current === 1 ? '' : 's'}`} sub={`Longest ${st.longest} day${st.longest === 1 ? '' : 's'}`} />
          <StatTile icon={Trophy} label="Most productive day" value={st.best ? st.best.n : '–'} sub={st.best ? fmtDay(st.best.key, { day: 'numeric', month: 'short', year: 'numeric' }) : 'Nothing logged yet'} color="#facc15" />
          <StatTile icon={TrendingUp} label="Catch velocity" value={`${st.perDay.toFixed(st.perDay < 10 ? 1 : 0)}/day`} sub={`${st.recent} in the last ${st.windowDays} day${st.windowDays === 1 ? '' : 's'}`} color="var(--ok)" />
          <StatTile icon={Hourglass} label="Estimated finish" value={livingTotal === livingCaught ? 'Done!' : eta ? eta.toLocaleDateString(undefined, { month: 'short', year: 'numeric' }) : '–'}
            sub={livingTotal === livingCaught ? 'Living dex complete' : `${livingTotal - livingCaught} to go${st.etaDays ? ` · about ${st.etaDays} days at this pace` : ' · log a catch to estimate'}`} color="#38bdf8" />
        </div>
      </section>

      <div className="grid min-w-0 items-start gap-5 lg:grid-cols-[minmax(0,1.1fr)_minmax(0,1fr)]">
        <section className="panel min-w-0 p-5" aria-labelledby="cal-title">
          <h2 id="cal-title" className="font-display text-lg font-bold uppercase tracking-wide">Catch calendar</h2>
          <div className="mt-3"><YearStrip byDay={st.byDay} onSelect={setDay} selected={day} /></div>
          <div className="mt-4"><CatchCalendar byDay={st.byDay} selected={day} onSelect={setDay} /></div>
        </section>
        <section className="panel min-w-0 p-5" aria-labelledby="day-title" aria-live="polite">

            <ul className="mt-3 grid max-h-[420px] gap-1.5 overflow-y-auto pr-1">

      <div className="grid min-w-0 items-start gap-5 lg:grid-cols-2">

            <ol className="mt-3 grid max-h-[380px] gap-1.5 overflow-y-auto pr-1">

                return (
                  <li key={k} className="flex items-center gap-3 rounded-xl border border-vault-line bg-vault-bg px-3 py-2">

        <section className="panel min-w-0 p-5" aria-labelledby="chk-title">
          <h2 id="chk-title" className="font-display text-lg font-bold uppercase tracking-wide">Origin and legality</h2>
          <div className="mt-3 grid grid-cols-3 gap-2">
            <StatTile label="Origins set" value={withOrigin} />

            <StatTile label="Flagged" value={problems.length} />

          {!checks.length ? <p className="mt-3 text-sm text-vault-muted">Add an origin game, Poké Ball or ribbons in a Pokémon’s Collector details and the checks run here.</p>

              <ul className="mt-3 grid max-h-[300px] gap-2 overflow-y-auto pr-1">

                  <li key={`${c.where}${c.boxId || ''}${c.slot != null ? c.slot : c.pokemonId}`}>

                      <p className="flex items-center gap-2 text-sm font-semibold"><span className="h-7 w-7 shrink-0"><Sprite id={c.pokemonId} form={c.rec.form} /></span>{nameOf(c)}
                        <span className="eyebrow ml-auto" style={{ color: c.worst === 'error' ? 'var(--bad)' : 'var(--warn)' }}>{c.worst === 'error' ? 'Impossible' : 'Check'}</span></p>

            <div className="mt-5">

              <ul className="mt-2 grid gap-2">
                {decorated.map((x) => {
                  const t = x.rec.title && DECOR_BY_KEY.get(x.rec.title);

                    <li key={`${x.where}${x.boxId || ''}${x.slot != null ? x.slot : x.pokemonId}`} className="flex items-start gap-3 rounded-xl border border-vault-line bg-vault-bg p-2.5">
                      <span className="h-10 w-10 shrink-0"><Sprite id={x.pokemonId} form={x.rec.form} shiny={x.rec.shiny} /></span>
                      <div className="min-w-0">
                        <p className="text-sm font-semibold">{nameOf(x)}{t && <span className="ml-1 font-normal italic text-vault-muted">{t.title}</span>}</p>
                        <div className="mt-1 flex flex-wrap gap-1">{x.rec.ribbons.slice(0, 8).map((k) => DECOR_BY_KEY.get(k)).filter(Boolean).map((d) => <DecorBadge key={d.key} d={d} small on />)}
                          {x.rec.ribbons.length > 8 && <span className="mono text-[11px] text-vault-faint">+{x.rec.ribbons.length - 8}</span>}</div>
                      </div>
                    </li>
                  );
                })}
              </ul>
            </div>
          )}
        </section>
      </div>
    </div>
  );

/* ---------------------------------------------------------------------
   15g. SUPERDEX: forms beyond the National Dex
   --------------------------------------------------------------------- */
const SD_GROUPS = [
  ['stranded', 'Stranded & un-transferable', MapPin],
  ['cosmetic', 'Cosmetic sets', Palette],
  ['gender', 'Gender differences', Dna],
  ['battle', 'Gigantamax & battle forms', Swords],
];
function SdTile({ it, own, derived, onToggle, small }) {
  const on = !!own;
  return (
    <button type="button" onClick={onToggle} aria-pressed={on}
      title={`${it.name}${it.note ? `\n${it.note}` : ''}${derived ? '\nOwned: found in your boxes' : on ? '\nTicked by hand. Click to untick.' : '\nClick to tick'}`}
      className={`relative grid rounded-xl border bg-vault-bg p-1 text-center transition ${small ? '' : 'pb-1.5'}`}
      style={{ borderColor: on ? 'var(--ok)' : 'var(--line)' }}>
      <span className="mx-auto block w-full max-w-[72px]"><Sprite cell={it.cell} id={it.dex} className={on ? '' : 'silhouette'} /></span>
      {!small && <span className="mt-0.5 block truncate text-[10.5px] leading-tight" style={{ color: on ? 'var(--fg)' : 'var(--muted)' }}>{it.name}</span>}
      {on && <span className={`slot-check ${derived ? '' : 'is-quick'}`} style={{ right: 4, top: 4, bottom: 'auto' }} aria-hidden="true"><Check size={10} strokeWidth={3.5} /></span>}
    </button>
  );
}
function AlcremieGrid({ set, ownFor, onTick }) {
  const creams = set.items.slice(0, 9).map((it) => it.name.split(' · ')[0]);
  const sweets = [];
  for (let i = 0; i < set.items.length; i += 9) sweets.push(set.items[i].name.split(' · ')[1]);
  return (
    <div className="overflow-x-auto">
      <table className="w-full min-w-[620px] border-separate border-spacing-1">
        <thead><tr><th />{creams.map((c) => <th key={c} className="eyebrow text-[9.5px] leading-tight">{c}</th>)}</tr></thead>
        <tbody>
          {sweets.map((sw, r) => (
            <tr key={sw}>
              <th className="eyebrow pr-1 text-right text-[9.5px]">{sw}</th>
              {set.items.slice(r * 9, r * 9 + 9).map((it) => {
                const o = ownFor(it);
                return <td key={it.k} className="w-[10%]"><SdTile it={it} own={o.own} derived={o.derived} small onToggle={() => onTick(it, o)} /></td>;
              })}
            </tr>
          ))}
        </tbody>
      </table>
    </div>
  );
}
function BattleFormCard({ bf }) {
  const [i, setI] = useState(0);
  return (
    <div className="rounded-2xl border border-vault-line bg-vault-bg p-3">
      <div className="mx-auto h-24 w-24"><Sprite cell={bf.frames[i][1]} id={bf.frames[0][1]} alt={`${bf.name}, ${bf.frames[i][0]}`} /></div>
      <p className="mt-1 text-center font-semibold">{bf.name}</p>
      <p className="text-center text-[11px] text-vault-muted">{bf.trigger}</p>
      <div className="mt-2 flex flex-wrap justify-center gap-1" role="radiogroup" aria-label={`${bf.name} form`}>
        {bf.frames.map(([label], j) => (
          <button key={label} type="button" role="radio" aria-checked={i === j} onClick={() => setI(j)}
            className="rounded-md border px-1.5 py-0.5 text-[10.5px] font-semibold"
            style={i === j ? { borderColor: 'var(--ember)', background: 'var(--ember-soft)', color: 'var(--fg)' } : { borderColor: 'var(--line)', color: 'var(--muted)' }}>{label}</button>
        ))}
      </div>
    </div>
  );
}
function SuperdexTab({ state, ownership, onTick }) {
  const [group, setGroup] = useState('stranded');
  const [q, setQ] = useState('');
  const sk = searchKey(q);
  const sets = D.superdexSets;
  const ownFor = (set) => (it) => { const d = ownership.derived(set, it); return { derived: !!d, own: d || state.superdex[`${set.key}:${it.k}`] || null }; };
  const totals = sets.reduce((a, set) => { const f = ownFor(set); set.items.forEach((it) => { a.total++; if (f(it).own) a.own++; }); return a; }, { own: 0, total: 0 });
  const shown = sets.filter((s) => (sk ? true : s.group === group)).map((s) => ({ ...s, items: sk ? s.items.filter((it) => searchKey(it.name).includes(sk)) : s.items })).filter((s) => s.items.length);
  return (
    <div className="grid min-w-0 gap-5">
      <section className="panel min-w-0 p-5 sm:p-6" aria-labelledby="sd-title">
        <div className="flex flex-wrap items-end justify-between gap-3">
          <div>
            <p className="eyebrow">Beyond the National Dex</p>
            <h1 id="sd-title" className="font-display text-3xl font-bold uppercase tracking-wide sm:text-4xl">Superdex</h1>
            <p className="mt-1 max-w-[64ch] text-sm text-vault-muted">Forms HOME can’t hold, every cosmetic variant, both sexes where they differ, and Gigantamax. A solid check comes from a Pokémon in your boxes (set its Form, gender or G-Max factor in Collector details); a hollow check is one you ticked by hand.</p>
          </div>
          <div className="text-right"><p className="mono text-3xl font-semibold">{totals.own}<span className="text-vault-faint">/{totals.total}</span></p><p className="eyebrow">Superdex slots</p></div>
        </div>
        <div className="mt-4 flex flex-wrap items-center gap-2">
          {SD_GROUPS.map(([key, label, Icon]) => (
            <button key={key} type="button" onClick={() => { setGroup(key); setQ(''); }} aria-pressed={!sk && group === key}
              className="flex items-center gap-1.5 rounded-xl border px-3 py-1.5 text-sm font-semibold"
              style={!sk && group === key ? { borderColor: 'var(--ember)', background: 'var(--ember-soft)', color: 'var(--fg)' } : { borderColor: 'var(--line)', color: 'var(--muted)' }}>
              <Icon size={14} />{label}
            </button>
          ))}
          <div className="relative ml-auto w-full sm:w-56">
            <Search size={14} className="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-vault-faint" />
            <input className="field pl-8" placeholder="Search every set" value={q} onChange={(e) => setQ(e.target.value)} aria-label="Search the Superdex" />
          </div>
        </div>
      </section>

      {shown.map((set) => {
        const f = ownFor(set);
        const all = D.superdexSets.find((x) => x.key === set.key).items;
        const have = all.filter((it) => f(it).own).length;
        const done = have === all.length;
        return (
          <section key={set.key} className="panel min-w-0 p-5" aria-labelledby={`sd-${set.key}`}>
            <div className="flex flex-wrap items-baseline justify-between gap-2">
              <h2 id={`sd-${set.key}`} className="font-display text-lg font-bold uppercase tracking-wide">{done && <Crown size={16} className="mr-1.5 inline" style={{ color: 'var(--ember)' }} />}{set.title}</h2>
              <span className="mono text-xs text-vault-muted">{have}/{all.length}</span>
            </div>
            <p className="mt-0.5 text-sm text-vault-muted">{set.blurb}</p>
            <div className="bar-track mt-2"><div className="bar-fill" style={{ width: `${(have / all.length) * 100}%`, background: done ? 'var(--ok)' : 'var(--ember)' }} /></div>
            <div className="mt-4">
              {set.grid && !sk ? <AlcremieGrid set={set} ownFor={f} onTick={(it, o) => onTick(set, it, o)} /> : (
                <div className="grid grid-cols-4 gap-2 sm:grid-cols-6 lg:grid-cols-8 xl:grid-cols-10">
                  {set.items.map((it) => { const o = f(it); return <SdTile key={it.k} it={it} own={o.own} derived={o.derived} onToggle={() => onTick(set, it, o)} />; })}
                </div>
              )}
            </div>
            {set.group === 'stranded' && set.key === 'stranded' && !sk && (
              <ul className="mt-4 grid gap-1 text-xs text-vault-muted sm:grid-cols-2">
                {[...new Set(set.items.map((it) => it.note).filter(Boolean))].map((n) => <li key={n} className="flex gap-1.5"><Info size={12} className="mt-0.5 shrink-0" />{n}</li>)}
              </ul>
            )}
          </section>
        );
      })}

      {!sk && group === 'battle' && (
        <section className="panel min-w-0 p-5" aria-labelledby="sd-battle">
          <h2 id="sd-battle" className="font-display text-lg font-bold uppercase tracking-wide">Battle-only forms</h2>
          <p className="mt-0.5 text-sm text-vault-muted">These exist only mid-battle, so there’s nothing to store. Tap a form to see the change.</p>
          <div className="mt-4 grid grid-cols-2 gap-3 sm:grid-cols-3 lg:grid-cols-5">
            {D.battleForms.map((bf) => <BattleFormCard key={bf.name} bf={bf} />)}
          </div>
        </section>
      )}
      {!shown.length && <p className="text-sm text-vault-muted">Nothing in the Superdex matches “{q}”.</p>}
    </div>
  );
}

/* ---------------------------------------------------------------------
   15h. HUNTER'S ITINERARY: where to get every missing entry
   --------------------------------------------------------------------- */
const huntCache = { promise: null };
function useHuntData() {
  const [view, setView] = useState({ status: 'loading', data: null });
  useEffect(() => {
    let alive = true;
    if (!huntCache.promise) huntCache.promise = fetch(PACK_DIR + 'hunt.json').then((r) => (r.ok ? r.json() : Promise.reject(new Error(`hunt.json ${r.status}`))));
    huntCache.promise.then((data) => alive && setView({ status: 'ready', data })).catch(() => { huntCache.promise = null; if (alive) setView({ status: 'error', data: null }); });
    return () => { alive = false; };
  }, []);
  return view;
}
const ERA_LABEL = { switch: 'Switch', '3ds': '3DS · via Pokémon Bank' };

function HuntTab({ caught, index, species, gens, onOpen, onRegister }) {
  const hunt = useHuntData();
  const [scope, setScope] = useState('switch');
  const [withForms, setWithForms] = useState(true);
  const [hideLegends, setHideLegends] = useState(false);
  const [gen, setGen] = useState(0);
  const [open, setOpen] = useState(0);

  const plan = useMemo(() => {
    if (!hunt.data) return null;
    const data = hunt.data;
    const games = data.games.filter((g) => scope === 'all' || g[2] === 'switch');
    const gameKeys = new Set(games.map((g) => g[0]));
    const missing = [];
    species.forEach((sp) => {
      if (caught[sp.id] || sp.dex > 1025) return;
      if (gen && (genOf(sp.dex, gens) || {}).gen !== gen) return;
      const d = data.sp[sp.dex] || {};
      if (hideLegends && d.k) return;
      missing.push({ entry: sp, d });
    });
    if (withForms) REGIONAL.forEach((f) => {
      if (caught[f.id]) return;
      if (gen && (genOf(f.dex, gens) || {}).gen !== gen) return;
      missing.push({ entry: f, d: data.forms[f.id] || {} });
    });
    // Quick wins: evolve something you own, or breed it from a relative you own
    const wins = [];
    missing.forEach((m) => {
      const d = m.d;
      if (m.entry.kind === 'species' && d.e && caught[d.e[0]]) m.evolve = { from: index.byId.get(d.e[0]), how: d.e[1][0] };
      if (m.entry.kind === 'species' && !d.e && !d.x) {
        const rel = species.find((x) => x.id !== m.entry.id && caught[x.id] && (data.sp[x.dex] || {}).b === m.entry.dex);
        if (rel) m.breed = rel;
      }
      if (m.evolve || m.breed) wins.push(m);
    });
    // Route: keep picking the game that covers the most of what's left
    const avail = (m, g) => !!(m.d.g && g in m.d.g) || !!(m.d.l && m.d.l[g]);
    let left = missing.filter((m) => games.some((g) => avail(m, g[0])));
    const nowhere = missing.filter((m) => !games.some((g) => avail(m, g[0])));
    const steps = [];
    while (left.length) {
      let best = null;
      games.forEach((g) => { const n = left.filter((m) => avail(m, g[0])).length; if (n && (!best || n > best.n)) best = { g, n }; });
      if (!best) break;
      const here = left.filter((m) => avail(m, best.g[0]));
      steps.push({ game: best.g, items: here });
      left = left.filter((m) => !avail(m, best.g[0]));
    }
    return { missing, wins, steps, nowhere, gameKeys };
  }, [hunt.data, caught, species, gens, index, scope, withForms, hideLegends, gen]);

  const dexNames = { sv: 'Paldea, Kitakami or Blueberry', za: 'Lumiose or Hyperspace', swsh: 'Galar, Isle of Armor or Crown Tundra', bdsp: 'Sinnoh', pla: 'Hisui', lgpe: 'Kanto', usum: 'Alola', sm: 'Alola', oras: 'Hoenn', xy: 'Kalos' };
  function where(m, gkey) {
    const l = m.d.l && m.d.l[gkey];
    if (l && l.r.length) {
      const top = l.r[0];
      const lv = top[1] && top[2] ? ` (Lv ${top[1] === top[2] ? top[1] : `${top[1]}–${top[2]}`}${top[3] ? `, ${top[3]}` : ''})` : top[3] ? ` (${top[3]})` : '';
      return { text: `${top[0]}${lv}${l.n > 1 ? ` · +${l.n - 1} more` : ''}`, only: l.o, all: l.r };
    }
    const no = m.d.g && m.d.g[gkey];
    return { text: no ? `#${no} in the ${dexNames[gkey] || ''} Pokédex` : m.entry.kind === 'form' ? `Found in ${REGION_LABEL[m.entry.region]}` : 'In this game', only: '' };
  }
  const row = (m, gkey) => {
    const w = gkey ? where(m, gkey) : null;
    return (
      <li key={m.entry.id} className="flex items-center gap-3 rounded-xl border border-vault-line bg-vault-bg px-2.5 py-2">
        <button type="button" className="h-10 w-10 shrink-0" onClick={() => onOpen(m.entry)} aria-label={`${m.entry.name}: Pokédex entry`}><Sprite id={m.entry.id} className="silhouette" /></button>
        <div className="min-w-0 flex-1">
          <p className="truncate text-sm font-semibold"><span className="mono mr-1.5 text-xs font-normal text-vault-faint">{pad4(m.entry.dex)}</span>{m.entry.name}
            {m.d.k && <span className="eyebrow ml-2" style={{ color: '#c4b5fd' }}>{m.d.k === 'M' ? 'Mythical' : 'Legendary'}</span>}</p>
          {w && <p className="truncate text-xs text-vault-muted" title={w.all ? w.all.map((r) => r[0]).join(', ') : undefined}><MapPin size={11} className="mr-1 inline" />{w.text}{w.only && <span className="ml-1.5 font-semibold" style={{ color: 'var(--warn)' }}>{w.only} only</span>}</p>}
          {m.evolve && <p className="truncate text-xs" style={{ color: 'var(--ok)' }}>Evolve your {m.evolve.from ? m.evolve.from.name : 'pre-evolution'}: {m.evolve.how}</p>}
          {m.breed && <p className="truncate text-xs" style={{ color: 'var(--ok)' }}>Breed your {m.breed.name}</p>}
        </div>
        <button type="button" className="btn btn-quiet shrink-0 px-2 py-1 text-xs" onClick={() => onRegister(m.entry)}><Check size={13} /> Got it</button>
      </li>
    );
  };

  return (
    <div className="grid min-w-0 gap-5">
      <section className="panel min-w-0 p-5 sm:p-6" aria-labelledby="hunt-title">
        <p className="eyebrow">Hunter’s Itinerary</p>
        <h1 id="hunt-title" className="font-display text-3xl font-bold uppercase tracking-wide sm:text-4xl">Finish the Dex</h1>
        <p className="mt-1 max-w-[66ch] text-sm text-vault-muted">Everything you haven’t registered, grouped into the fewest games, with routes where PokeAPI has encounter data (Sword & Shield and its DLC, Let’s Go and the 3DS games). For Scarlet & Violet, Legends: Z-A, Legends: Arceus and BDSP it shows the regional Pokédex number. Version exclusives are marked where the data has them.</p>
        <div className="mt-4 flex flex-wrap items-center gap-2 text-sm">
          <div className="flex rounded-xl border border-vault-line bg-vault-bg p-1 text-xs font-semibold" role="radiogroup" aria-label="Games to plan with">
            {[['switch', 'Switch games'], ['all', 'Switch + 3DS']].map(([k, l]) => (
              <button key={k} type="button" role="radio" aria-checked={scope === k} onClick={() => setScope(k)} className="rounded-lg px-3 py-1.5"
                style={scope === k ? { background: 'var(--panel-2)', color: 'var(--fg)' } : { color: 'var(--muted)' }}>{l}</button>
            ))}
          </div>
          <label className="flex items-center gap-2 rounded-xl border border-vault-line px-3 py-1.5 text-xs font-semibold text-vault-muted"><input type="checkbox" checked={withForms} onChange={(e) => setWithForms(e.target.checked)} /> Regional forms</label>
          <label className="flex items-center gap-2 rounded-xl border border-vault-line px-3 py-1.5 text-xs font-semibold text-vault-muted"><input type="checkbox" checked={hideLegends} onChange={(e) => setHideLegends(e.target.checked)} /> Hide legendaries</label>
          <select className="field h-9 w-auto py-1 text-xs" value={gen} onChange={(e) => setGen(+e.target.value)} aria-label="Generation">
            <option value={0}>All generations</option>
            {gens.map((g) => <option key={g.gen} value={g.gen}>Gen {g.roman} · {g.region}</option>)}
          </select>
        </div>
      </section>

      {hunt.status === 'loading' && <div className="skeleton h-40" />}
      {hunt.status === 'error' && <p className="panel p-5 text-sm text-vault-bad">The hunt data (pack/hunt.json) didn’t load. Keep the pack folder next to the app.</p>}
      {plan && (
        <>
          <div className="grid grid-cols-2 gap-3 lg:grid-cols-4">
            <StatTile icon={Target} label="Still to catch" value={plan.missing.length} sub={withForms ? 'Species and regional forms' : 'Species'} />
            <StatTile icon={Route} label="Games in the plan" value={plan.steps.length} sub={plan.steps[0] ? `Start with ${plan.steps[0].game[1]}` : 'Nothing left'} color="#38bdf8" />
            <StatTile icon={Egg} label="Quick wins" value={plan.wins.length} sub="Evolve or breed what you own" color="var(--ok)" />
            <StatTile icon={Compass} label="Not in these games" value={plan.nowhere.length} sub="Events, GO or older games" color="#c4b5fd" />
          </div>

          {plan.wins.length > 0 && (
            <section className="panel min-w-0 p-5" aria-labelledby="wins-title">
              <h2 id="wins-title" className="font-display text-lg font-bold uppercase tracking-wide">Quick wins</h2>
              <ul className="mt-3 grid grid-cols-1 gap-2 lg:grid-cols-2">{plan.wins.slice(0, 60).map((m) => row(m))}</ul>
              {plan.wins.length > 60 && <p className="mt-2 text-xs text-vault-faint">and {plan.wins.length - 60} more</p>}
            </section>
          )}

          <section className="panel min-w-0 p-5" aria-labelledby="route-title">
            <h2 id="route-title" className="font-display text-lg font-bold uppercase tracking-wide">Route plan</h2>
            <ol className="mt-3 grid grid-cols-1 gap-2">
              {plan.steps.map((st, i) => (
                <li key={st.game[0]} className="min-w-0 rounded-2xl border border-vault-line">
                  <button type="button" aria-expanded={open === i} onClick={() => setOpen(open === i ? -1 : i)} className="flex w-full items-center gap-3 p-3 text-left">
                    <span className="font-display grid h-8 w-8 shrink-0 place-items-center rounded-lg text-lg font-bold" style={{ background: 'var(--ember-soft)', color: 'var(--ember)' }}>{i + 1}</span>

/* ---------------------------------------------------------------------
   15j. BRAGGING RIGHTS: one big PNG of your boxes, trainer-card style
   --------------------------------------------------------------------- */
const loadImg = (src) => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });
function roundRect(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
async function drawBragImage({ boxes, caught, stats, gens, trainer, guardian, records, useHome }) {
  if (document.fonts && document.fonts.ready) { try { await document.fonts.ready; } catch { /* system fonts */ } }
  const file = useHome ? 'home.webp' : 'sprites.webp';
  const atlas = await loadImg(PACK_DIR + file);
  const cw = atlas.naturalWidth / ATLAS_COLS;
  const ch = atlas.naturalHeight / ATLAS_ROWS;
  const css = getComputedStyle(document.documentElement);
  const fDisp = css.getPropertyValue('--font-display') || 'sans-serif';
  const fBody = css.getPropertyValue('--font-body') || 'sans-serif';
  const fMono = css.getPropertyValue('--font-mono') || 'monospace';
  const shown = boxes.filter((b) => b.kind !== 'reserved' && b.slots.some(Boolean));
  const W = 2400; const PAD = 64; const GAP = 28; const PER = 6;
  const bw = (W - PAD * 2 - GAP * (PER - 1)) / PER;
  const cols = shown[0] ? shown[0].cols : 6;
  const cell = (bw - 20) / cols;
  const rowsOf = (b) => Math.ceil(b.slots.length / b.cols);
  const bh = (b) => 46 + rowsOf(b) * cell + 14;
  const lines = [];
  for (let i = 0; i < shown.length; i += PER) lines.push(shown.slice(i, i + PER));
  const HEADER = 520;
  const H = PAD + HEADER + GAP + lines.reduce((a, l) => a + Math.max(...l.map(bh)) + GAP, 0) + 70;
  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#0b1222'; ctx.fillRect(0, 0, W, H);
  const glow = ctx.createRadialGradient(W * 0.15, 0, 50, W * 0.15, 0, 1400);
  glow.addColorStop(0, 'rgba(255,123,53,0.22)'); glow.addColorStop(1, 'rgba(255,123,53,0)');
  ctx.fillStyle = glow; ctx.fillRect(0, 0, W, H);
  const sprite = (key, x, y, size, dark) => {
    const idx = ATLAS_INDEX.get(key);
    if (idx == null) return;
    const sx = (idx % ATLAS_COLS) * cw; const sy = Math.floor(idx / ATLAS_COLS) * ch;
    if (!dark) { ctx.drawImage(atlas, sx, sy, cw, ch, x, y, size, size); return; }
    const off = sprite.off || (sprite.off = document.createElement('canvas'));
    off.width = cw; off.height = ch;
    const o = off.getContext('2d');
    o.clearRect(0, 0, cw, ch); o.drawImage(atlas, sx, sy, cw, ch, 0, 0, cw, ch);
    o.globalCompositeOperation = 'source-in'; o.fillStyle = 'rgba(148,163,184,0.16)'; o.fillRect(0, 0, cw, ch); o.globalCompositeOperation = 'source-over';
    ctx.drawImage(off, 0, 0, cw, ch, x, y, size, size);
  };

  // Trainer card
  const cx = PAD; const cy = PAD; const cwid = W - PAD * 2;
  const g = ctx.createLinearGradient(cx, cy, cx + cwid, cy + HEADER);
  g.addColorStop(0, '#1d2a4a'); g.addColorStop(1, '#131c33');
  roundRect(ctx, cx, cy, cwid, HEADER, 36); ctx.fillStyle = g; ctx.fill();
  ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(255,123,53,0.55)'; ctx.stroke();
  ctx.save(); roundRect(ctx, cx, cy, cwid, HEADER, 36); ctx.clip();
  ctx.fillStyle = 'rgba(255,123,53,0.10)'; ctx.beginPath(); ctx.arc(cx + 260, cy + HEADER / 2, 230, 0, Math.PI * 2); ctx.fill(); ctx.restore();
  sprite(spriteCell(guardian.pokemonId), cx + 60, cy + 60, 400, false);
  const tx = cx + 520;
  ctx.fillStyle = '#ff7b35'; ctx.font = `600 30px ${fDisp}`; ctx.fillText('LIVING FORM DEX · TRAINER CARD', tx, cy + 84);
  ctx.fillStyle = '#e8edf7'; ctx.font = `700 92px ${fDisp}`; ctx.fillText(String(trainer).toUpperCase().slice(0, 22), tx, cy + 180);
  ctx.fillStyle = '#8f9cba'; ctx.font = `500 34px ${fBody}`;
  ctx.fillText(`Guardian: ${guardian.nickname} the ${guardian.species} · Lv. ${guardian.level}`, tx, cy + 232);
  ctx.fillStyle = '#ff7b35'; ctx.font = `700 150px ${fMono}`;
  ctx.fillText(`${stats.pct.toFixed(stats.pct === 100 ? 0 : 1)}%`, tx, cy + 390);
  const facts = [['Species', `${stats.caught}/${stats.total}`], ['Regional forms', `${stats.formsCaught}/${stats.formsTotal}`], ['Boxes complete', `${stats.boxesDone}/${stats.boxesTotal}`],
    ['Shinies', String(records.filter((x) => x.rec.shiny).length)], ['Ribbons & marks', String(records.reduce((a, x) => a + (x.rec.ribbons || []).length, 0))]];
  ctx.font = `700 150px ${fMono}`;
  const fx = tx + Math.max(560, ctx.measureText('100.0%').width + 60);
  const fw = (cx + cwid - 50 - fx) / facts.length;
  facts.forEach(([k, v], i) => {
    const x = fx + i * fw; const y = cy + 318;
    ctx.fillStyle = '#8f9cba'; ctx.font = `600 21px ${fDisp}`; ctx.fillText(k.toUpperCase(), x, y);
    ctx.fillStyle = '#e8edf7'; ctx.font = `600 42px ${fMono}`; ctx.fillText(v, x, y + 50);
  });
  // generation bars
  const gx = tx; const gy = cy + 430; const gw = (cwid - (tx - cx) - 60 - 8 * 14) / gens.length;
  gens.forEach((gn, i) => {
    const total = gn.end - gn.start + 1; const have = stats.perGen[gn.gen] || 0;
    const x = gx + i * (gw + 14);
    roundRect(ctx, x, gy, gw, 14, 7); ctx.fillStyle = '#273452'; ctx.fill();
    if (have) { roundRect(ctx, x, gy, Math.max(14, (gw * have) / total), 14, 7); ctx.fillStyle = gn.color; ctx.fill(); }
    ctx.fillStyle = '#8f9cba'; ctx.font = `600 20px ${fDisp}`; ctx.fillText(`${gn.roman}  ${have}/${total}`, x, gy + 44);
  });

  // Boxes
  let y = PAD + HEADER + GAP;
  lines.forEach((line) => {
    const lh = Math.max(...line.map(bh));
    line.forEach((b, i) => {
      const x = PAD + i * (bw + GAP);
      const filled = b.slots.filter(Boolean);
      const done = filled.every((e) => caught[e.id]);
      roundRect(ctx, x, y, bw, bh(b), 20); ctx.fillStyle = '#141e35'; ctx.fill();
      ctx.lineWidth = 2; ctx.strokeStyle = done ? '#3ddc97' : '#273452'; ctx.stroke();
      ctx.fillStyle = done ? '#3ddc97' : '#e8edf7'; ctx.font = `700 24px ${fDisp}`; ctx.fillText(boxName(b).toUpperCase(), x + 14, y + 32);
      ctx.fillStyle = '#8f9cba'; ctx.font = `500 18px ${fMono}`;
      const cnt = `${filled.filter((e) => caught[e.id]).length}/${filled.length}`;
      ctx.fillText(cnt, x + bw - 14 - ctx.measureText(cnt).width, y + 32);
      b.slots.forEach((e, si) => {
        const sx = x + 10 + (si % b.cols) * cell; const sy = y + 46 + Math.floor(si / b.cols) * cell;
        roundRect(ctx, sx + 2, sy + 2, cell - 4, cell - 4, 8); ctx.fillStyle = e && caught[e.id] ? '#1a2643' : '#111a2e'; ctx.fill();
        if (!e) return;
        const rec = caught[e.id];
        sprite(rec ? spriteCell(e.id, { female: rec.gender === 'female', form: rec.form, gmax: rec.gmax }) : e.id, sx + 2, sy + 2, cell - 4, !rec);
        if (rec && rec.shiny) { ctx.fillStyle = '#facc15'; ctx.font = `700 ${Math.round(cell * 0.3)}px ${fBody}`; ctx.fillText('★', sx + 5, sy + cell - 6); }
      });
    });
    y += lh + GAP;
  });
  ctx.fillStyle = '#5f6b86'; ctx.font = `500 22px ${fBody}`;
  ctx.fillText(`Made with Living Form Dex · ${new Date().toLocaleDateString(undefined, { day: 'numeric', month: 'long', year: 'numeric' })} · Pokémon © Nintendo / Creatures / GAME FREAK`, PAD, H - 34);
  return new Promise((res, rej) => canvas.toBlob((b) => (b ? res(b) : rej(new Error('toBlob'))), 'image/png'));
}

/* ---------------------------------------------------------------------
   16. ACCOUNTS & CLOUD SAVE
   Two sign-in routes, one save format:
   - Inside Claude (the published page): your Claude account. The save sits in
     this page's private per-person storage (user + db capabilities).
   - Your VS Code copy: Google (Apple when switched on) through your own
     Firebase project, saved in Firestore.
   The save is split so no document grows too big: meta (guardian, version
   stamp, box order), caught (the living dex), and one document per free box.
   The current box, tab and click mode stay per device and never sync.
   --------------------------------------------------------------------- */
const FIREBASE_SDK = 'https://www.gstatic.com/firebasejs/10.14.1/';

function stableStringify(v) {
  if (v === null || typeof v !== 'object') return JSON.stringify(v === undefined ? null : v);
  if (Array.isArray(v)) return `[${v.map(stableStringify).join(',')}]`;
  return `{${Object.keys(v).filter((k) => v[k] !== undefined).sort().map((k) => `${JSON.stringify(k)}:${stableStringify(v[k])}`).join(',')}}`;
}
const cloneJSON = (v) => JSON.parse(JSON.stringify(v));
function withTimeout(promise, ms, message) {
  let timer;
  const limit = new Promise((_, reject) => { timer = setTimeout(() => reject(new Error(message)), ms); });
  return Promise.race([promise, limit]).finally(() => clearTimeout(timer));
}

const claudePaths = (id) => ({
  meta: `data/users/${id}/meta`, caught: `data/users/${id}/caught`,
  boxes: `data/users/${id}/meta/boxes`, box: (boxId) => `data/users/${id}/meta/boxes/${boxId}`,
});
const firebasePaths = (uid) => ({
  meta: `users/${uid}`, caught: `users/${uid}/parts/caught`,
  boxes: `users/${uid}/boxes`, box: (boxId) => `users/${uid}/boxes/${boxId}`,
});

function toParts(s) {
  return {
    meta: { schemaVersion: SCHEMA_VERSION, guardian: s.guardian, megaStones: s.megaStones || {}, superdex: s.superdex || {}, milestones: s.milestones || {}, updatedAt: s.updatedAt, boxOrder: s.freeBoxes.map((b) => b.id) },
    caught: { caught: s.caught },
    boxes: Object.fromEntries(s.freeBoxes.map((b) => [b.id, { name: b.name, slots: b.slots }])),
  };
}
const partsSnapshot = (parts) => ({
  caught: stableStringify(parts.caught),
  boxes: Object.fromEntries(Object.entries(parts.boxes).map(([id, b]) => [id, stableStringify(b)])),
});
const contentKey = (s) => stableStringify({
  guardian: s.guardian, caught: s.caught, megaStones: s.megaStones || {}, superdex: s.superdex || {}, milestones: s.milestones || {}, freeBoxes: (s.freeBoxes || []).map((b) => ({ id: b.id, name: b.name, slots: b.slots })),
});

// A fresh device: nothing but Thalaivar and an empty Box 1
function isPristine(s) {
  const keys = Object.keys(s.caught || {});
  const own = (s.caught || {})[6];
  const g = s.guardian || {};
  return keys.length === 1 && keys[0] === '6' && !!own && own.nickname === DEFAULT_GUARDIAN.nickname && !own.gender
    && !(own.moves && own.moves.length) && g.nickname === DEFAULT_GUARDIAN.nickname && g.pokemonId === DEFAULT_GUARDIAN.pokemonId
    && clampLevel(g.level) === DEFAULT_GUARDIAN.level && (s.freeBoxes || []).length <= 1
    && (s.freeBoxes || []).every((b) => !Object.keys(b.slots || {}).length) && !Object.keys(s.megaStones || {}).length && !Object.keys(s.superdex || {}).length;
}

// Both stores (Claude db and Firestore compat) share doc().get/set/delete and collection().get
async function readCloud(store, paths) {
  const meta = await store.doc(paths.meta).get();
  if (!meta.exists) return null;
  const m = cloneJSON(meta.data());
  const [caughtSnap, boxesSnap] = await Promise.all([store.doc(paths.caught).get(), store.collection(paths.boxes).get()]);
  const caught = caughtSnap.exists ? cloneJSON(caughtSnap.data()).caught || {} : {};
  const byId = {};
  boxesSnap.docs.forEach((d) => { byId[d.id] = { id: d.id, ...cloneJSON(d.data()) }; });
  const order = Array.isArray(m.boxOrder) ? m.boxOrder : [];
  const freeBoxes = [...order.filter((id) => byId[id]).map((id) => byId[id]), ...Object.values(byId).filter((b) => !order.includes(b.id))];
  return { schemaVersion: m.schemaVersion, guardian: m.guardian, megaStones: m.megaStones || {}, superdex: m.superdex || {}, milestones: m.milestones || {}, caught, freeBoxes, updatedAt: m.updatedAt };
}

// Write only what changed since `prev` (what the cloud holds). Meta goes last: its stamp marks a complete save.
async function writeCloud(store, paths, parts, prev) {
  if (!prev || stableStringify(parts.caught) !== prev.caught) await store.doc(paths.caught).set(cloneJSON(parts.caught));
  for (const [id, box] of Object.entries(parts.boxes)) {
    if (!prev || stableStringify(box) !== prev.boxes[id]) await store.doc(paths.box(id)).set(cloneJSON(box));
  }
  if (prev) {
    for (const id of Object.keys(prev.boxes)) if (!(id in parts.boxes)) await store.doc(paths.box(id)).delete();
  }
  await store.doc(paths.meta).set(cloneJSON(parts.meta));
  return partsSnapshot(parts);
}

function getSyncMark(key) {
  try { return (JSON.parse(safeStorage.get(SYNC_KEY) || '{}') || {})[key] || null; } catch { return null; }
}
function setSyncMark(key, value) {
  let all = {};
  try { all = JSON.parse(safeStorage.get(SYNC_KEY) || '{}') || {}; } catch { all = {}; }
  all[key] = value;
  safeStorage.set(SYNC_KEY, JSON.stringify(all));
}

function saveSummary(s) {
  const caught = s.caught || {};
  const boxes = s.freeBoxes || [];
  return {
    caught: Object.keys(caught).length,
    registered: Object.values(caught).filter(hasDetails).length,
    stored: boxes.reduce((n, b) => n + Object.keys(b.slots || {}).length, 0),
    boxes: boxes.length,
    guardian: (s.guardian && s.guardian.nickname) || '',
    updatedAt: s.updatedAt,
  };
}
function timeAgo(ts) {
  if (!ts) return 'never';
  const sec = Math.max(0, Math.round((Date.now() - ts) / 1000));
  if (sec < 45) return 'just now';
  if (sec < 3600) return `${Math.round(sec / 60)} min ago`;
  if (sec < 86400) return `${Math.round(sec / 3600)} h ago`;
  if (sec < 7 * 86400) return `${Math.round(sec / 86400)} days ago`;
  return new Date(ts).toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' });
}

/* ---- Firebase (VS Code copy only) ---- */
let firebasePromise = null;
function loadScript(src) {
  return new Promise((resolve, reject) => {
    const el = document.createElement('script');
    el.src = src;
    el.onload = resolve;
    el.onerror = () => reject(new Error('Could not load Google sign-in. Check your connection.'));
    document.head.appendChild(el);
  });
}
function loadFirebase() {
  if (!firebasePromise) {
    firebasePromise = (async () => {
      for (const file of ['firebase-app-compat.js', 'firebase-auth-compat.js', 'firebase-firestore-compat.js']) await loadScript(FIREBASE_SDK + file);
      const fb = window.firebase;
      const { apiKey, authDomain, projectId, appId, storageBucket, messagingSenderId } = FIREBASE_CONFIG;
      if (!fb.apps.length) fb.initializeApp(cloneJSON({ apiKey, authDomain, projectId, appId, storageBucket, messagingSenderId }));
      return { auth: fb.auth(), fs: fb.firestore() };
    })();
    firebasePromise.catch(() => { firebasePromise = null; });
  }
  return firebasePromise;
}

const FIREBASE_ERRORS = {
  'auth/popup-closed-by-user': '',
  'auth/cancelled-popup-request': '',
  'auth/user-cancelled': '',
  'auth/unauthorized-domain': 'This address isn’t an authorized domain in your Firebase project. Add it under Authentication → Settings → Authorized domains.',
  'auth/operation-not-allowed': 'That sign-in method is switched off in Firebase. Turn it on under Authentication → Sign-in method.',
  'auth/network-request-failed': 'Couldn’t reach the sign-in service. Check your connection and try again.',
  'auth/operation-not-supported-in-this-environment': 'Sign-in needs the page served over http. Open it through VS Code Live Server instead of double-clicking the file.',
  'auth/invalid-api-key': 'The apiKey in the setup block isn’t valid. Copy it again from Firebase → Project settings.',
  'auth/configuration-not-found': 'Firebase Authentication isn’t set up yet. Open Authentication in the Firebase console and press Get started.',
};

async function firebaseSignIn(which) {
  const { auth } = await loadFirebase();
  const fb = window.firebase;
  let provider;
  if (which === 'apple') {
    provider = new fb.auth.OAuthProvider('apple.com');
    provider.addScope('email');
    provider.addScope('name');
  } else {
    provider = new fb.auth.GoogleAuthProvider();
    provider.setCustomParameters({ prompt: 'select_account' });
  }
  try {
    await auth.signInWithPopup(provider);
  } catch (e) {
    if (e && e.code === 'auth/popup-blocked') { await auth.signInWithRedirect(provider); return; }
    throw e;
  }
}

/* ---- Who is signed in ---- */
function useAccount(mode) {
  const [session, setSession] = useState({ status: mode ? 'connecting' : 'none', provider: mode });
  useEffect(() => {
    let alive = true;
    let unsubscribe = null;
    const set = (value) => { if (alive) setSession(value); };
    if (mode === 'claude') {
      set({ status: 'connecting', provider: 'claude' });
      (async () => {
        const [user, db] = await Promise.all([window.claude.use('user'), window.claude.use('db')]);
        if (!user || !db) return set({ status: 'unavailable', provider: 'claude', reason: 'Cloud save isn’t available in this view. Open the page from Claude while signed in.' });
        const me = await user.me();
        if (!me.id) return set({ status: 'unavailable', provider: 'claude', reason: 'Sign in to Claude to sync your progress.' });
        set({
          status: 'ready', provider: 'claude', key: `claude:${me.id}`, store: db, paths: claudePaths(me.id),
          account: { name: me.name || 'Your Claude account', avatarUrl: me.avatarUrl, color: me.color, label: 'Claude account' },
        });
      })().catch((e) => set({ status: 'error', provider: 'claude', reason: (e && e.message) || 'Couldn’t connect to your Claude account.' }));
    } else if (mode === 'firebase') {
      set({ status: 'connecting', provider: 'firebase' });
      loadFirebase().then(({ auth, fs }) => {
        unsubscribe = auth.onAuthStateChanged((u) => {
          if (!u) { set({ status: 'signed-out', provider: 'firebase' }); return; }
          const pid = ((u.providerData || [])[0] || {}).providerId;
          set({
            status: 'ready', provider: 'firebase', key: `firebase:${u.uid}`, store: fs, paths: firebasePaths(u.uid),
            account: { name: u.displayName || u.email || 'Signed in', avatarUrl: u.photoURL || null, email: u.email || null, label: pid === 'apple.com' ? 'Apple' : 'Google' },
            signOut: () => auth.signOut(),
          });
        });
      }).catch((e) => set({ status: 'error', provider: 'firebase', reason: (e && e.message) || 'Couldn’t load Google sign-in.' }));
    } else {
      set({ status: 'none', provider: mode });
    }
    return () => { alive = false; if (unsubscribe) unsubscribe(); };
  }, [mode]);
  return session;
}

/* ---- Keep this device and the cloud save in step ----
   syncedAt (per account, per device) = the cloud version this device last matched.
   cloud stamp == syncedAt -> nobody else changed it: push local changes.
   cloud changed, local not -> take the cloud save.
   both changed            -> ask which to keep (never merge silently). */
function useCloudSync(state, stateKey, replaceState, session) {
  const [sync, setSync] = useState({ status: 'idle', at: null, error: '', conflict: null, offer: null, dismissed: false });
  const stateRef = useRef(state);
  stateRef.current = state;
  const stateKeyRef = useRef(stateKey);
  stateKeyRef.current = stateKey;
  const sessionRef = useRef(session);
  sessionRef.current = session;
  const cloudRef = useRef(null);
  const running = useRef(false);
  const again = useRef(false);
  const ready = session.status === 'ready';
  const done = { status: 'synced', error: '', conflict: null, offer: null, dismissed: false };

  // The save on screen must be this account's own before anything is read or written
  const mine = (s) => stateKeyRef.current === accountStorageKey(s.key) && sessionRef.current.key === s.key;
  const normalize = (cloud) => {
    const next = migrateState({ ...cloud, ui: stateRef.current.ui });
    next.updatedAt = cloud.updatedAt;
    return next;
  };

  const adopt = useCallback((s, cloud) => {
    const next = normalize(cloud);
    stateRef.current = next;
    replaceState(next, accountStorageKey(s.key));
  }, [replaceState]); // eslint-disable-line react-hooks/exhaustive-deps

  const push = useCallback(async (s, local) => {
    setSync((x) => ({ ...x, status: 'saving', error: '' }));
    cloudRef.current = await writeCloud(s.store, s.paths, toParts(local), cloudRef.current);
    setSyncMark(s.key, { syncedAt: local.updatedAt });
  }, []);

  const run = useCallback(async () => {
    const s = sessionRef.current;
    if (s.status !== 'ready' || !mine(s)) return;
    if (running.current) { again.current = true; return; }
    running.current = true;
    const slow = 'Your cloud save didn’t answer. Check your connection; sync will retry.';
    try {
      do {
        again.current = false;
        if (!mine(s)) return;
        const local = stateRef.current;
        const mark = getSyncMark(s.key);
        if (mark && cloudRef.current) {          // quick check: has anyone else saved since?
          const metaSnap = await withTimeout(s.store.doc(s.paths.meta).get(), 15000, slow);
          const stamp = metaSnap.exists ? (metaSnap.data() || {}).updatedAt : null;
          if (stamp === mark.syncedAt) {
            if (local.updatedAt !== mark.syncedAt && mine(s)) await withTimeout(push(s, local), 60000, slow);
            setSync({ ...done, at: Date.now() });
            continue;
          }
        }
        setSync((x) => ({ ...x, status: x.status === 'idle' ? 'connecting' : 'checking', error: '' }));
        const raw = await withTimeout(readCloud(s.store, s.paths), 20000, slow);
        if (!mine(s)) return;
        if (!raw) {                                // a brand-new account
          cloudRef.current = null;
          const offline = loadState(GUEST_KEY);
          if (!mark && isPristine(local) && !isPristine(offline)) {
            setSync({ status: 'offer', at: null, error: '', conflict: null, offer: { offline }, dismissed: false });
            return;
          }
          await withTimeout(push(s, local), 60000, slow);
          setSync({ ...done, at: Date.now() });
          continue;
        }
        cloudRef.current = partsSnapshot(toParts(raw));
        const cloud = normalize(raw);
        const same = contentKey(local) === contentKey(cloud);
        const cloudChanged = !mark || cloud.updatedAt !== mark.syncedAt;
        const localChanged = mark ? local.updatedAt !== mark.syncedAt : !isPristine(local);
        if (same || (cloudChanged && !localChanged)) {
          adopt(s, raw);
          setSyncMark(s.key, { syncedAt: raw.updatedAt });
        } else if (!cloudChanged) {
          if (localChanged) await withTimeout(push(s, local), 60000, slow);
        } else {
          setSync({ status: 'conflict', at: null, error: '', conflict: { cloud }, offer: null, dismissed: false });
          return;
        }
        setSync({ ...done, at: Date.now() });
      } while (again.current);
    } catch (e) {
      const msg = (e && (e.message || e.code)) || 'Sync failed.';
      setSync((x) => ({ ...x, status: 'error', error: e && e.code === 'quota_exceeded' ? 'Your cloud save is full. Remove some free boxes, then sync again.' : msg }));
    } finally {
      running.current = false;
    }
  }, [adopt, push]); // eslint-disable-line react-hooks/exhaustive-deps

  // Connect: check the cloud as soon as an account is ready and its own save is on screen
  const onAccountSave = ready && stateKey === accountStorageKey(session.key);
  useEffect(() => {
    cloudRef.current = null;
    if (onAccountSave) run();
    else setSync({ status: 'idle', at: null, error: '', conflict: null, offer: null, dismissed: false });
  }, [onAccountSave, session.key, run]);

  // Save changes 1.5 s after you stop editing
  const paused = sync.status === 'conflict' || sync.status === 'offer';
  useEffect(() => {
    if (!onAccountSave || paused) return undefined;
    const mark = getSyncMark(session.key);
    if (mark && mark.syncedAt === state.updatedAt) return undefined;
    setSync((x) => (x.status === 'synced' ? { ...x, status: 'pending' } : x));
    const t = setTimeout(run, 1500);
    return () => clearTimeout(t);
  }, [state.updatedAt, onAccountSave, paused, session.key, run]);

  // Coming back to the tab or window: look for changes made on another device
  useEffect(() => {
    if (!onAccountSave) return undefined;
    let last = Date.now();
    const check = () => {
      if (document.visibilityState !== 'visible' || Date.now() - last < 15000) return;
      last = Date.now();
      run();
    };
    document.addEventListener('visibilitychange', check);
    window.addEventListener('focus', check);
    return () => { document.removeEventListener('visibilitychange', check); window.removeEventListener('focus', check); };
  }, [onAccountSave, run]);

  const resolve = useCallback(async (choice) => {
    const s = sessionRef.current;
    if (choice === 'later') { setSync((x) => ({ ...x, dismissed: true })); return; }
    if (s.status !== 'ready' || !mine(s)) return;
    if (choice === 'cloud' && sync.conflict) {
      adopt(s, sync.conflict.cloud);
      setSyncMark(s.key, { syncedAt: sync.conflict.cloud.updatedAt });
      setSync({ ...done, at: Date.now() });
      return;
    }
    let local = { ...stateRef.current, updatedAt: Date.now() };     // a new stamp so other devices see the change
    if (choice === 'import' && sync.offer) {                         // copy this device's offline progress into the new account
      local = migrateState({ ...sync.offer.offline, ui: stateRef.current.ui });
      local.updatedAt = Date.now();
    }
    stateRef.current = local;
    replaceState(local, accountStorageKey(s.key));
    try {
      await push(s, local);
      setSync({ ...done, at: Date.now() });
    } catch (e) {
      setSync({ status: 'error', at: null, error: (e && e.message) || 'Sync failed.', conflict: null, offer: null, dismissed: false });
    }
  }, [sync.conflict, sync.offer, adopt, push, replaceState]); // eslint-disable-line react-hooks/exhaustive-deps

  const reopen = useCallback(() => setSync((x) => ({ ...x, dismissed: false })), []);
  return { ...sync, run, resolve, reopen };
}

/* ---- Account button + menu ---- */
function syncLine(mode, session, sync) {
  if (mode === 'guest') return { tone: 'muted', text: 'Not signed in. Progress stays in this browser.' };
  if (session.status === 'connecting') return { tone: 'muted', text: 'Connecting…' };
  if (session.status === 'unavailable' || session.status === 'error') return { tone: 'warn', text: session.reason };
  if (session.status === 'signed-out') return { tone: 'warn', text: 'Signed out.' };
  switch (sync.status) {
    case 'synced': return { tone: 'ok', text: `Synced ${timeAgo(sync.at)}` };
    case 'pending': return { tone: 'muted', text: 'Changes waiting to sync' };
    case 'saving': return { tone: 'muted', text: 'Saving to the cloud…' };
    case 'conflict': return { tone: 'warn', text: 'Sync paused: this device and the cloud have different saves.' };
    case 'offer': return { tone: 'warn', text: 'Waiting for you: start fresh or copy this device’s offline progress.' };
    case 'error': return { tone: 'bad', text: sync.error };
    default: return { tone: 'muted', text: 'Checking the cloud save…' };
  }
}
const TONE = { ok: 'var(--ok)', warn: 'var(--warn)', bad: 'var(--bad)', muted: 'var(--muted)' };

function Avatar({ account, size = 30 }) {
  const [failed, setFailed] = useState(false);
  if (account && account.avatarUrl && !failed) {
    return <img src={account.avatarUrl} alt="" width={size} height={size} referrerPolicy="no-referrer" onError={() => setFailed(true)}
      className="shrink-0 rounded-full object-cover" style={{ width: size, height: size }} />;
  }
  const initial = account && account.name ? account.name.trim().charAt(0).toUpperCase() : '';
  return (
    <span className="grid shrink-0 place-items-center rounded-full text-xs font-bold"
      style={{ width: size, height: size, background: (account && account.color) || 'var(--panel-2)', color: account ? '#fff' : 'var(--muted)' }}>
      {initial || <UserRound size={Math.round(size * 0.55)} />}
    </span>
  );
}

function AccountMenu({ mode, session, sync, onSignIn, onSignOut, onBackup }) {
  const [open, setOpen] = useState(false);
  const ref = useRef(null);
  useEffect(() => {
    if (!open) return undefined;
    const onDown = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    const onKey = (e) => { if (e.key === 'Escape') { e.preventDefault(); setOpen(false); } };
    document.addEventListener('mousedown', onDown);
    document.addEventListener('keydown', onKey, true);
    return () => { document.removeEventListener('mousedown', onDown); document.removeEventListener('keydown', onKey, true); };
  }, [open]);

  const account = session.status === 'ready' ? session.account : null;
  const line = syncLine(mode, session, sync);
  const name = account ? account.name : mode === 'guest' ? 'Guest' : session.provider === 'claude' ? 'Claude account' : 'Account';
  const label = account ? account.label : mode === 'guest' ? 'Offline on this device' : '';
  const busy = session.status === 'connecting' || ['connecting', 'checking', 'saving'].includes(sync.status);

  return (
    <div ref={ref} className="relative">
      <button type="button" className="btn btn-quiet gap-2 px-1.5 sm:pr-3" aria-haspopup="true" aria-expanded={open}
        onClick={() => setOpen((o) => !o)} title={`${name}: ${line.text}`}>
        <span className="relative">
          <Avatar account={account} size={28} />
          <span className="absolute -bottom-0.5 -right-0.5 h-2.5 w-2.5 rounded-full border-2 border-vault-bg" style={{ background: TONE[line.tone] }} />
        </span>
        <span className="hidden max-w-[120px] truncate lg:inline">{name}</span>
        <ChevronDown size={14} className="hidden lg:inline" />
      </button>
      {open && (
        <div className="account-pop" role="menu" aria-label="Account">
          <div className="flex items-center gap-3">

/* ---------------------------------------------------------------------
   17. BACKUP (move progress between PC, laptop and Mac)
   --------------------------------------------------------------------- */
function BackupDialog({ state, onRestore, onReset, onClose, storageOk }) {
  const json = useMemo(() => JSON.stringify(state, null, 2), [state]);
  const outRef = useRef(null);
  const [paste, setPaste] = useState('');
  const [msg, setMsg] = useState(null);
  const [confirmReset, setConfirmReset] = useState(false);
  const count = Object.keys(state.caught).length;
  const stored = (state.freeBoxes || []).reduce((n, b) => n + freeCount(b), 0);


  function copy() {
    const fallback = () => { outRef.current.focus(); outRef.current.select(); setMsg({ ok: true, text: 'Backup selected. Press Ctrl+C (Cmd+C on Mac) to copy it.' }); };
    try {
      navigator.clipboard.writeText(json).then(() => setMsg({ ok: true, text: `Copied ${count} caught entries to the clipboard.` }), fallback);
    } catch { fallback(); }
  }
  function restore() {
    try {
      const parsed = JSON.parse(paste);
      if (!parsed || typeof parsed !== 'object' || !('caught' in parsed)) throw new Error('shape');
      const next = migrateState(parsed);
      onRestore(next);
      setMsg({ ok: true, text: `Restored ${Object.keys(next.caught).length} caught entries, ${next.freeBoxes.length} free boxes and ${next.guardian.nickname}.` });
      setPaste('');
    } catch {
      setMsg({ ok: false, text: 'That isn’t a Living Form Dex backup. Paste the whole JSON block you copied on the other device.' });
    }
  }
  function readFile(e) {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => setPaste(String(reader.result || ''));
    reader.onerror = () => setMsg({ ok: false, text: 'Could not read that file.' });
    reader.readAsText(file);
  }

  return (
    <div className="overlay" onMouseDown={(e) => { if (e.target === e.currentTarget) onClose(); }}>
      <div className="sheet panel relative max-w-2xl p-5 sm:p-7" role="dialog" aria-modal="true" aria-labelledby="backup-title">
        <button type="button" onClick={onClose} className="btn btn-quiet absolute right-3 top-3 px-2" aria-label="Close backup"><X size={18} /></button>
        <p className="eyebrow">localStorage key {STORAGE_KEY}</p>
        <h2 id="backup-title" className="font-display mt-1 text-2xl font-bold uppercase tracking-wide">Backup &amp; restore</h2>
        <p className="mt-2 text-sm text-vault-muted">Progress is saved in this browser only. To carry it between your PC, OMEN laptop and Mac, copy the backup here and restore it on the other machine.</p>
        {!storageOk && <p className="mt-3 rounded-lg border border-vault-bad px-3 py-2 text-sm text-vault-bad">This browser is blocking localStorage, so changes are lost on refresh. Copy a backup before closing.</p>}

        <h3 className="eyebrow mt-5">Backup ({count} caught · {stored} in free boxes)</h3>
        <textarea ref={outRef} id="backup-out" readOnly value={json} className="field mono mt-2 h-40 text-xs" />
        <button type="button" className="btn btn-ember mt-2" onClick={copy}><Copy size={14} /> Copy backup</button>

        <h3 className="eyebrow mt-6">Restore</h3>
        <textarea id="backup-in" value={paste} onChange={(e) => setPaste(e.target.value)} placeholder="Paste a backup JSON here" className="field mono mt-2 h-28 text-xs" />
        <div className="mt-2 flex flex-wrap items-center gap-2">
          <button type="button" className="btn btn-ember" onClick={restore} disabled={!paste.trim()}><Upload size={14} /> Restore backup</button>
          <label className="btn cursor-pointer"><HardDrive size={14} /> Load .json file
            <input id="backup-file" type="file" accept="application/json,.json,.txt" className="sr-only" onChange={readFile} />
          </label>
        </div>
        {msg && <p role="status" className="mt-3 text-sm" style={{ color: msg.ok ? 'var(--ok)' : 'var(--bad)' }}>{msg.text}</p>}

        <div className="mt-6 border-t border-vault-line pt-4">
          {!confirmReset ? (
            <button type="button" className="btn" onClick={() => setConfirmReset(true)}><Eraser size={14} /> Reset tracker</button>
          ) : (
            <div className="flex flex-wrap items-center gap-2 text-sm">
              <span>Clear all {count} caught entries, empty your free boxes ({stored} Pokémon) and restore Thalaivar as guardian?</span>
              <button type="button" className="btn btn-ember" onClick={() => { onReset(); setConfirmReset(false); setMsg({ ok: true, text: 'Tracker reset.' }); }}>Reset</button>
              <button type="button" className="btn" onClick={() => setConfirmReset(false)}>Cancel</button>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

/* ---------------------------------------------------------------------
   18. ERROR BOUNDARY
   --------------------------------------------------------------------- */
class ErrorBoundary extends Component {
  constructor(props) { super(props); this.state = { error: null }; }
  static getDerivedStateFromError(error) { return { error }; }
  componentDidCatch(error, info) { console.error('Living Form Dex crashed:', error, info); }
  render() {
    if (!this.state.error) return this.props.children;
    return (
      <div className="panel mx-auto mt-10 max-w-lg p-6 text-center">
        <AlertTriangle size={28} className="mx-auto" style={{ color: 'var(--bad)' }} />
        <h2 className="font-display mt-2 text-xl font-bold uppercase">Something broke in this view</h2>
        <p className="mt-2 text-sm text-vault-muted">Your caught list is still saved. Reload the page to continue.</p>
        <p className="mono mt-3 text-xs text-vault-faint">{String(this.state.error.message || this.state.error)}</p>
        <button type="button" className="btn btn-ember mx-auto mt-4" onClick={() => this.setState({ error: null })}><RefreshCw size={14} /> Try again</button>
      </div>
    );
  }
}

<style>
/* Layout: sticky command bar -> Guardian hero -> [HOME box grid | generation ledger]
   Omnidex: search bar -> filter chips -> card grid -> detail sheet (modal) */
:root {
  color-scheme: dark;
  --bg: #0f172a;            /* slate-900: the vault floor */
  --panel: #141e35;
  --panel-2: #1a2643;
  --line: #273452;
  --line-hi: #3d4e78;
  --fg: #e8edf7;
  --muted: #8f9cba;
  --faint: #5d6a88;
  --ember: #ff7b35;         /* Thalaivar's flame: the one accent */
  --ember-soft: rgba(255, 123, 53, 0.14);
  --ok: #3ddc97;
  --ok-soft: rgba(61, 220, 151, 0.4);
  --warn: #fbbf24;
  --bad: #f87171;
  --male: #60a5fa;
  --female: #f472b6;
  --on-light: #0b1020;
  --font-display: "Chakra Petch", "Bahnschrift", "Segoe UI", system-ui, sans-serif;
  --font-body: "Figtree", "Segoe UI", -apple-system, system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Consolas, monospace;
}
html { background: var(--bg); }
body {
  background: var(--bg);
  background-image: radial-gradient(900px 420px at 12% -8%, var(--ember-soft), transparent 65%);
  background-repeat: no-repeat;
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--bg); }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1240px; margin-inline: auto; }
h1, h2, h3 { text-wrap: balance; }
@keyframes shimmer { to { background-position: -200% 0; } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pulse-slot { 50% { transform: scale(1.06); } }
@keyframes toast-in { from { transform: translateY(12px); opacity: 0; } }
@keyframes page-in { from { transform: translateY(6px); opacity: 0; } }
.page-in { animation: page-in .28s ease-out; }
/* below lg the tab bar sits at the bottom, so toasts float above it */
@media (max-width: 1023.98px) { body .toast-wrap { padding-bottom: calc(80px + env(safe-area-inset-bottom, 0px)); } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
}
</style>

          ok: 'var(--ok)', warn: 'var(--warn)', bad: 'var(--bad)', ink: 'var(--on-light)',

<style type="text/tailwindcss">
@layer components {
  .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  .eyebrow { font-family: var(--font-display); text-transform: uppercase; letter-spacing: 0.14em; font-size: 11px; font-weight: 600; color: var(--muted); }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; }
  .btn { display: inline-flex; align-items: center; gap: 6px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel-2); color: var(--fg); font-weight: 600; font-size: 13px; padding: 7px 12px; transition: border-color .15s, background-color .15s; }
  .btn:hover { border-color: var(--line-hi); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn-ember { background: var(--ember); border-color: var(--ember); color: var(--on-light); }
  .btn-ember:hover { border-color: var(--fg); }
  .btn-quiet { background: transparent; border-color: transparent; }
  .btn-quiet:hover { border-color: var(--line); }
  .field { width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; color: var(--fg); font-size: 14px; }
  .field::placeholder { color: var(--faint); }
  .field:focus { border-color: var(--ember); outline: none; }
  .skeleton { background: linear-gradient(90deg, var(--panel-2) 0%, #26355a 50%, var(--panel-2) 100%); background-size: 200% 100%; animation: shimmer 1.2s linear infinite; border-radius: 8px; }
  .spin { animation: spin 1s linear infinite; }
  .sprite { display: block; image-rendering: pixelated; }
  .silhouette { filter: brightness(0) invert(0.85); opacity: 0.2; }

  /* HOME box */
  .box-frame { position: relative; border-radius: 14px; padding: 10px; background: var(--bg); border: 1px solid var(--line); }
  .box-frame::before { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; opacity: .35;
    background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px); background-size: 18px 18px; }
  .box-grid { position: relative; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; }
  .slot { position: relative; aspect-ratio: 1; border-radius: 10px; background: var(--panel-2); border: 1px solid var(--line); padding: 8%; transition: border-color .15s, transform .15s; }
  .slot:hover { border-color: var(--line-hi); transform: translateY(-1px); }
  .slot.is-caught { background: radial-gradient(circle at 50% 62%, rgba(255,255,255,.08), transparent 70%), var(--panel-2); border-color: var(--ok-soft); }
  .slot.is-hl { outline: 2px solid var(--ember); outline-offset: 2px; animation: pulse-slot .8s ease-in-out 3; }
  .slot-empty { aspect-ratio: 1; border-radius: 10px; border: 1px dashed var(--line); display: grid; place-items: center; color: var(--faint); font-family: var(--font-mono); font-size: 9px; }
  .slot-num { position: absolute; left: 5px; top: 3px; font: 500 9.5px/1 var(--font-mono); color: var(--faint); pointer-events: none; }
  .slot.is-caught .slot-num { color: var(--muted); }
  .slot-check { position: absolute; right: 4px; bottom: 4px; width: 15px; height: 15px; border-radius: 50%; background: var(--ok); color: var(--on-light); display: grid; place-items: center; }
  .slot-check.is-quick { background: var(--bg); color: var(--ok); box-shadow: inset 0 0 0 1.5px var(--ok); }
  .slot-gender { position: absolute; right: 5px; top: 2px; font: 700 12px/1 var(--font-body); pointer-events: none; }
  .slot-shiny { position: absolute; left: 4px; bottom: 4px; color: #facc15; pointer-events: none; filter: drop-shadow(0 0 2px rgba(250, 204, 21, .6)); }
  .sprite-smooth { image-rendering: auto; }

  /* free boxes */
  .slot.is-stored { background: radial-gradient(circle at 50% 62%, rgba(255,255,255,.08), transparent 70%), var(--panel-2); }
  .slot.is-held { opacity: .35; outline: 2px dashed var(--ember); outline-offset: 2px; }
  .slot-free-empty { aspect-ratio: 1; border-radius: 10px; border: 1px dashed var(--line); display: grid; place-items: center; color: var(--line-hi); transition: border-color .15s, color .15s, background-color .15s; }
  .slot-free-empty:hover { border-color: var(--ember); color: var(--ember); background: var(--ember-soft); }
  .slot-free-empty.is-target { border-color: var(--ember); color: var(--ember); }
  .free-row { display: flex; width: 100%; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel-2); text-align: left; font-size: 14px; }
  .free-row:hover { border-color: var(--line-hi); }
  .free-row[aria-current="true"] { border-color: var(--ember); background: var(--ember-soft); }

  /* mega */
  .mega-card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px; transition: border-color .15s; }
  .mega-card:hover { border-color: var(--line-hi); }
  .mega-card.is-ready { border-color: rgba(255, 123, 53, .55); box-shadow: inset 0 0 0 1px rgba(255, 123, 53, .18); }
  .stone-toggle { display: inline-flex; align-items: center; gap: 6px; justify-self: start; padding: 5px 9px; border-radius: 8px;
    border: 1px dashed var(--line-hi); color: var(--muted); font-weight: 600; }
  .stone-toggle:hover { border-color: var(--ember); color: var(--fg); }
  .stone-toggle.is-on { border-style: solid; border-color: var(--ember); background: var(--ember-soft); color: var(--fg); }

  /* field guide */
  .book-page { position: relative; overflow: hidden; }
  .book-page::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--chapter, var(--ember)); opacity: .85; }

  /* phone and tablet navigation */
  .bottom-nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px;
    background: rgba(15, 23, 42, .95); backdrop-filter: blur(8px); border-top: 1px solid var(--line);
    padding: 6px max(8px, env(safe-area-inset-right, 0px)) max(6px, env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
  .bottom-nav button { display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 52px; justify-content: center; border-radius: 10px;
    font-size: 11px; font-weight: 600; color: var(--muted); }
  .bottom-nav button[aria-current="page"] { color: var(--ember); background: var(--ember-soft); }

  /* sign-in */
  .login-btn { width: 100%; justify-content: center; padding: 12px 16px; font-size: 15px; border-radius: 12px; }
  .account-pop { position: absolute; right: 0; top: calc(100% + 8px); z-index: 60; width: min(300px, calc(100vw - 32px)); padding: 14px;
    background: var(--panel); border: 1px solid var(--line-hi); border-radius: 14px; box-shadow: 0 18px 40px rgba(0, 0, 0, .5); }

  /* slot form */
  .field.is-invalid { border-color: var(--bad); }
  .combo-list { position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 40; max-height: 252px; overflow-y: auto; padding: 4px;
    background: var(--panel); border: 1px solid var(--line-hi); border-radius: 12px; box-shadow: 0 18px 40px rgba(0, 0, 0, .45);
    scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
  .combo-option { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 8px; cursor: pointer; font-size: 14px; }
  .combo-option[aria-selected="true"] { background: var(--panel-2); }
  .toast-wrap { position: fixed; left: 0; right: 0; bottom: 0; z-index: 90; display: flex; justify-content: center; pointer-events: none;
    padding-bottom: max(20px, env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .toast { display: flex; align-items: center; gap: 8px; max-width: 100%; padding: 10px 16px; border-radius: 12px; font-size: 14px; font-weight: 600;
    background: var(--panel-2); color: var(--fg); border: 1px solid var(--ok-soft); box-shadow: 0 12px 30px rgba(0, 0, 0, .45); animation: toast-in .25s ease-out; }
  .chip-box { flex: 0 0 auto; min-width: 44px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel-2); padding: 5px 7px 6px; text-align: center; }
  .chip-box[aria-current="true"] { border-color: var(--ember); background: var(--ember-soft); }
  .strip { scrollbar-width: thin; scrollbar-color: var(--line) transparent; }

  /* progress */
  .bar-track { height: 8px; border-radius: 999px; background: var(--panel-2); overflow: hidden; }
  .bar-fill { height: 100%; border-radius: inherit; transition: width 1s cubic-bezier(.2,.8,.2,1); }
  .ring-progress { transition: stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1); }

  /* guardian stage */
  .stage { position: relative; display: grid; place-items: end center; }
  .stage::before { content: ""; position: absolute; inset: 8% 6% 18%; border-radius: 50%; background: radial-gradient(circle, rgba(255,123,53,.35), transparent 68%); filter: blur(6px); }
  .stage::after { content: ""; position: absolute; left: 14%; right: 14%; bottom: 4%; height: 16%; border-radius: 50%; background: radial-gradient(ellipse, rgba(255,123,53,.28), transparent 70%); border-top: 1px solid rgba(255,123,53,.35); }

  /* modal */
  .overlay { position: fixed; inset: 0; z-index: 70; background: rgba(5, 8, 20, .72); backdrop-filter: blur(3px); display: flex; align-items: flex-start; justify-content: center; overflow-y: auto;
    padding: max(16px, env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); }
  .sheet { width: 100%; max-width: 980px; margin-block: 3vh; }
  .movelist { max-height: 340px; overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
  :where(button, a, select, textarea, input):focus-visible { outline: 2px solid var(--ember); outline-offset: 2px; }
}
</style>

  }
  scored.sort((a, b) => a[0] - b[0] || a[1] - b[1] || a[2] - b[2]);
  return scored.slice(0, limit).map((s) => s[3]);
}

// Native region of a living dex entry, and the generation it first existed in
function speciesGen(entry) {
  if (!entry) return null;
  if (entry.kind === 'form') return { alola: 7, galar: 8, hisui: 8, paldea: 9 }[entry.region] || null;
  const d = entry.dex;
  return GENERATIONS.find((g) => d >= g.start && d <= g.end)?.gen || (d > 1025 ? 10 : null);
}
function nativeRegions(entry) {
  if (!entry) return [];
  if (entry.kind === 'form') return [entry.region];
  if (entry.id === 10272) return ['paldea'];                        // Bloodmoon Ursaluna, from Kitakami
  const d = entry.dex;
  if (d === 808 || d === 809) return ['go', 'kanto'];               // Meltan and Melmetal arrived through GO and Let's Go
  if (d >= 899 && d <= 905) return ['hisui'];
  const g = speciesGen({ dex: d });
  return [[null, 'kanto', 'johto', 'hoenn', 'sinnoh', 'unova', 'kalos', 'alola', 'galar', 'paldea'][g] || ''].filter(Boolean);
}

/* Checks for one stored Pokémon. Returns [{ level: 'error' | 'warn' | 'ok', text }]. */
function checkRecord(entry, rec) {
  const out = [];
  if (!entry || !rec) return out;
  const game = rec.origin ? ORIGIN_BY_KEY.get(rec.origin) : null;
  const ball = rec.ball ? BALL_BY_KEY.get(rec.ball) : null;
  const name = entry.name;
  const sg = speciesGen(entry);
  if (game) {
    if (game.gen && sg && sg > game.gen) out.push({ level: 'error', text: `${name} first appeared in Generation ${sg}, so it can’t come from ${game.label}.` });
    if (game.key === 'lgpe' && entry.kind !== 'form' && entry.dex > 151 && entry.dex !== 808 && entry.dex !== 809) out.push({ level: 'error', text: `Let’s Go only has the original 151, Meltan and Melmetal.` });
    const native = nativeRegions(entry);
    if (game.region === 'go') out.push({ level: native.includes('go') ? 'ok' : 'warn', text: native.includes('go') ? `Native: ${name} comes from Pokémon GO.` : `GO origin: it carries the GO mark rather than a ${REGION_NAMES[native[0]] || 'regional'} origin.` });
    else if (native.includes(game.region)) out.push({ level: 'ok', text: `Native: ${name} is from ${REGION_NAMES[game.region]}, and so is ${game.label}.` });
    else if (native.length) out.push({ level: 'warn', text: `Not native: ${name} is from ${native.map((r) => REGION_NAMES[r]).join(' / ')}, but ${game.label} is set in ${REGION_NAMES[game.region] || game.region}.${native[0] === 'sinnoh' && game.region === 'hisui' ? ' Hisui is ancient Sinnoh; most collectors count it separately.' : ''}` });
    if (rec.met === 'egg' && game.eggs === false) out.push({ level: 'error', text: `${game.label} has no breeding, so nothing there hatches from an Egg.` });
    if (rec.caughtAt && new Date(rec.caughtAt).getFullYear() < game.year) out.push({ level: 'error', text: `${game.label} came out in ${game.year}, after the caught date.` });
  }
  if (ball) {
    if (game && game.gen && ball.gen > game.gen) out.push({ level: 'error', text: `The ${ball.name} didn’t exist yet in ${game.label} (it arrived in Generation ${ball.gen}).` });
    else if (game && GAME_BALLS[game.key] && !GAME_BALLS[game.key].includes(ball.key)) {
      out.push(game.key === 'pla'
        ? { level: 'warn', text: 'Pokémon caught in Legends: Arceus show a Strange Ball in every other game.' }
        : { level: 'error', text: `${game.label} has no ${ball.name}.` });
    }
    if (ball.key === 'strange' && game && game.key !== 'pla') out.push({ level: 'warn', text: 'A Strange Ball usually means it was caught in Legends: Arceus.' });
    if (ball.key === 'cherish' && rec.met && rec.met !== 'event') out.push({ level: 'error', text: 'Cherish Balls are only used for event distributions, never wild catches.' });
    if (ball.key === 'cherish' && !rec.met) out.push({ level: 'warn', text: 'A Cherish Ball means an event Pokémon. Set “Met” to Event distribution.' });
    if (rec.met === 'egg' && (ball.key === 'master' || ball.key === 'cherish')) out.push({ level: 'error', text: `A ${ball.name} is never passed down to an Egg, so a hatched Pokémon can’t be in one.` });
  }
  if (rec.tid) {
    const max = game && game.gen && game.gen < 7 ? 65535 : 999999;
    if (+rec.tid > max) out.push({ level: 'error', text: `ID No. ${rec.tid} is too high for ${game ? game.label : 'this game'} (max ${max}).` });
  }
  (rec.ribbons || []).forEach((k) => {
    const d = DECOR_BY_KEY.get(k);
    if (!d || !game) return;
    if (d.games && !d.games.includes(game.key)) out.push({ level: 'error', text: `The ${d.name} is only found on Pokémon met in ${d.games.map((g) => ORIGIN_BY_KEY.get(g).short).join(' or ')}.` });
    if (d.to && game.gen && game.gen > d.to) out.push({ level: 'error', text: `The ${d.name} can only be earned in Generation ${d.from === d.to ? d.from : `${d.from}–${d.to}`} games, before ${game.label}.` });
  });
  return out;
}
const worstCheck = (checks) => (checks.some((c) => c.level === 'error') ? 'error' : checks.some((c) => c.level === 'warn') ? 'warn' : checks.length ? 'ok' : null);

// Box layouts (per device). 'home' mirrors HOME exactly; 'custom' lets the size, order and breaks change.
const BOX_SHAPES = [[6, 5], [5, 4], [6, 4], [6, 6], [8, 5], [8, 6], [10, 6]];
const DEFAULT_LAYOUT = { mode: 'home', order: 'grouped', cols: 6, rows: 5, genBreaks: true };
const SPRITE_STYLES = [
  { key: 'box', label: 'Box sprites', note: 'Pixel sprites for every species and form' },
  { key: 'home', label: 'HOME renders', note: '3D renders, like Pokémon HOME (about 6.5 MB, loads once)' },
  { key: 'gen3', label: 'Gen 3 (Emerald)', note: 'GBA sprites for #1–386; later species keep box sprites' },
  { key: 'gen5', label: 'Gen 5 animated', note: 'Black & White animations for #1–649; loads per generation' },
];

/* ---------------------------------------------------------------------
   3. HOME BOX MODEL
   Spine:  HOME 1..N    -> Dex #n sits in box ceil(n/30), slot ((n-1) % 30) + 1
   Runway: N+1..50      -> empty, future species keep landing in the spine
   Annex:  HOME 51..55  -> one box per regional set
   --------------------------------------------------------------------- */
function homeSlot(dex) {
  const box = Math.ceil(dex / BOX_SIZE);
  const slot = ((dex - 1) % BOX_SIZE) + 1;
  return { box, slot, row: Math.ceil(slot / BOX_COLS), col: ((slot - 1) % BOX_COLS) + 1 };
}

function buildBoxes(species, gens, layout = DEFAULT_LAYOUT) {
  const boxes = [];
  if (layout.mode !== 'custom') {
    const spineCount = Math.ceil(species.length / BOX_SIZE);
    for (let b = 1; b <= spineCount; b++) {
      const first = (b - 1) * BOX_SIZE + 1;
      const last = b * BOX_SIZE;
      const regions = gens.filter((g) => g.end >= first && g.start <= Math.min(last, species.length)).map((g) => g.region);
      boxes.push({
        number: b, prefix: 'HOME', cols: BOX_COLS, kind: 'spine', label: regions.join(' → '), range: `${pad4(first)} – ${pad4(last)}`,
        firstDex: first, slots: Array.from({ length: BOX_SIZE }, (_, i) => species[first - 1 + i] || null),
      });
    }
    for (const a of ANNEX_BOXES) {
      const forms = a.region ? REGIONAL.filter((f) => f.region === a.region) : [];
      boxes.push({
        number: a.box, prefix: 'HOME', cols: BOX_COLS, kind: a.region ? 'annex' : 'reserved', label: a.label, color: a.color,
        range: a.region ? `${forms.length} forms` : 'Reserved', slots: Array.from({ length: BOX_SIZE }, (_, i) => forms[i] || null),
      });
    }
    return boxes;
  }
  // Custom: any box size, regional forms beside their species or after the Dex, optional generation breaks
  const size = layout.cols * layout.rows;
  const groups = [];                      // runs of entries; with breaks on, each run starts a fresh box
  const genOfEntry = (e) => genOf(e.dex, gens);
  if (layout.order === 'grouped') {
    const formsOf = new Map();
    REGIONAL.forEach((f) => { if (!formsOf.has(f.dex)) formsOf.set(f.dex, []); formsOf.get(f.dex).push(f); });
    let run = null;
    species.forEach((sp) => {
      const g = genOfEntry(sp);
      if (!run || (layout.genBreaks && run.gen !== g)) { run = { gen: g, entries: [] }; groups.push(run); }
      run.entries.push(sp, ...(formsOf.get(sp.dex) || []));
    });
  } else {
    let run = null;
    species.forEach((sp) => {
      const g = genOfEntry(sp);
      if (!run || (layout.genBreaks && run.gen !== g)) { run = { gen: g, entries: [] }; groups.push(run); }
      run.entries.push(sp);
    });
    ANNEX_BOXES.filter((a) => a.region).forEach((a) => {
      const forms = REGIONAL.filter((f) => f.region === a.region);
      if (layout.genBreaks || !groups.length || groups[groups.length - 1].region == null) groups.push({ region: a.region, color: a.color, label: a.label, entries: [] });
      groups[groups.length - 1].entries.push(...forms);
    });
  }
  const flat = layout.genBreaks ? groups : [{ entries: groups.flatMap((g) => g.entries) }];
  let n = 1;
  flat.forEach((grp) => {
    for (let i = 0; i < grp.entries.length; i += size) {
      const slots = grp.entries.slice(i, i + size);
      const sp = slots.filter((e) => e.kind === 'species');
      const regions = [...new Set(slots.map((e) => (e.kind === 'form' ? REGION_LABEL[e.region] : (genOfEntry(e) || {}).region)).filter(Boolean))];
      const formsOnly = !sp.length;
      boxes.push({
        number: n++, prefix: 'Box', cols: layout.cols, kind: formsOnly ? 'annex' : 'custom',
        label: formsOnly ? `${regions.join(' · ')} Forms` : regions.join(' → '), color: formsOnly ? grp.color : null,
        range: sp.length ? `${pad4(sp[0].dex)} – ${pad4(sp[sp.length - 1].dex)}` : `${slots.length} forms`,
        slots: [...slots, ...Array(size - slots.length).fill(null)],
      });
    }
  });
  return boxes;
}

const boxName = (b) => `${b.prefix} ${b.number}`;

function locate(entry, boxes) {
  if (!entry) return null;
  if (entry.kind === 'species' && boxes[0] && boxes[0].prefix === 'HOME') return { ...homeSlot(entry.dex), name: `HOME ${homeSlot(entry.dex).box}` };
  for (const b of boxes) {
    const i = b.slots.findIndex((s) => s && s.id === entry.id);
    if (i !== -1) return { box: b.number, name: boxName(b), slot: i + 1, row: Math.floor(i / b.cols) + 1, col: (i % b.cols) + 1 };
  }
  return null;
}

/* ---------------------------------------------------------------------
   4. LOCAL STATE (localStorage)
   --------------------------------------------------------------------- */
const safeStorage = {
  get(key) { try { return window.localStorage.getItem(key); } catch { return null; } },
  set(key, value) { try { window.localStorage.setItem(key, value); return true; } catch { return false; } },
};

const DEFAULT_GUARDIAN = {
  nickname: 'Thalaivar', pokemonId: 6, species: 'Charizard', level: 100,
  types: ['fire', 'flying'], sprite: `${SPRITES}/other/showdown/6.gif`, origin: 'Kanto',
};

/* Schema v5
   caught[pokemonId]  = record: { caughtAt, updatedAt, nickname, gender, moves: [move slugs, max 4],
                        form, shiny, gmax, ball, origin, met, ot, tid, level, nature, ability,
                        ivs: [6], evs: [6], ribbons: [ribbon/mark keys], title }               living dex, one per slot
   freeBoxes[]        = { id, name, slots: { 0-29: { pokemonId, ...record } } }                 any Pokémon, any slot
   megaStones         = { [stone key]: true }                                                     Mega Stones you own
   superdex           = { ["set:item"]: timestamp }                                               Superdex slots ticked by hand
   milestones         = { [milestone key]: timestamp }                                            completions, logged automatically
   A quick-marked living dex entry has caughtAt only. */
const SCHEMA_VERSION = 5;   // v4: megaStones · v5: record details, superdex, milestones
const MOVE_SLOTS = 4;

const newBoxId = () => `fb${Date.now().toString(36)}${Math.random().toString(36).slice(2, 6)}`;
const makeFreeBox = (n) => ({ id: newBoxId(), name: `Box ${n}`, slots: {} });

function createDefaultState() {
  const now = Date.now();
  const first = makeFreeBox(1);
  return {
    schemaVersion: SCHEMA_VERSION,
    guardian: { ...DEFAULT_GUARDIAN },
    caught: { 6: { caughtAt: now, updatedAt: now, nickname: 'Thalaivar', gender: null, moves: [] } }, // Thalaivar is already in the vault
    freeBoxes: [first],
    megaStones: {},
    superdex: {},
    milestones: {},
    ui: { box: 1, clickMode: 'register', freeBox: first.id, layout: { ...DEFAULT_LAYOUT }, spriteStyle: 'box' },
    updatedAt: now,
  };
}

const OT_MAX = 12;
function cleanStatList(arr, max, total) {
  if (!Array.isArray(arr) || arr.length !== 6) return null;
  const v = arr.map((n) => Math.max(0, Math.min(max, parseInt(n, 10) || 0)));
  return total && v.reduce((a, b) => a + b, 0) > total ? null : v;
}
function cleanRecord(value, pokemonId) {
  const now = Date.now();
  if (typeof value === 'number') return { caughtAt: value };                 // v1 stored a timestamp
  if (!value || typeof value !== 'object') return { caughtAt: now };          // v1 arrays / booleans
  const rec = { caughtAt: typeof value.caughtAt === 'number' ? value.caughtAt : now };
  if (typeof value.updatedAt === 'number') rec.updatedAt = value.updatedAt;
  const nickname = String(value.nickname || '').trim().slice(0, NICKNAME_MAX);
  if (nickname) rec.nickname = nickname;
  if (GENDERS[value.gender]) rec.gender = value.gender;
  if (Array.isArray(value.moves)) {
    const moves = [...new Set(value.moves.map((m) => String(m).toLowerCase()).filter(Boolean))].slice(0, MOVE_SLOTS);
    if (moves.length) rec.moves = moves;
  }
  // v5 details
  const opts = pokemonId ? formOptions(pokemonId) : null;
  if (opts && value.form && value.form !== defaultForm(pokemonId) && opts.some((f) => f[0] === value.form)) rec.form = value.form;
  if (value.shiny === true) rec.shiny = true;
  if (value.gmax === true && pokemonId && canGmax(pokemonId)) rec.gmax = true;
  if (BALL_BY_KEY.has(value.ball)) rec.ball = value.ball;
  if (ORIGIN_BY_KEY.has(value.origin)) rec.origin = value.origin;
  if (MET_TYPES.some(([k]) => k === value.met)) rec.met = value.met;
  const ot = String(value.ot || '').trim().slice(0, OT_MAX);
  if (ot) rec.ot = ot;
  const tid = String(value.tid || '').replace(/\D/g, '').slice(0, 6);
  if (tid) rec.tid = tid;
  if (value.level != null && value.level !== '') { const l = parseInt(value.level, 10); if (l >= 1 && l <= 100) rec.level = l; }
  if (D.natures.some((n) => n[0] === value.nature)) rec.nature = value.nature;
  if (typeof value.ability === 'string' && /^[a-z0-9-]{2,40}$/.test(value.ability)) rec.ability = value.ability;
  const ivs = cleanStatList(value.ivs, 31);
  if (ivs) rec.ivs = ivs;
  const evs = cleanStatList(value.evs, 252, 510);
  if (evs) rec.evs = evs;
  if (Array.isArray(value.ribbons)) {
    const r = [...new Set(value.ribbons.filter((k) => DECOR_BY_KEY.has(k)))].slice(0, 200);
    if (r.length) rec.ribbons = r;
  }
  if (rec.ribbons && rec.ribbons.includes(value.title) && DECOR_BY_KEY.get(value.title).title) rec.title = value.title;
  return rec;
}

const DETAIL_FIELDS = ['nickname', 'gender', 'form', 'shiny', 'gmax', 'ball', 'origin', 'met', 'ot', 'tid', 'level', 'nature', 'ability', 'ivs', 'evs', 'ribbons'];
const hasDetails = (rec) => !!(rec && (DETAIL_FIELDS.some((k) => rec[k] != null && rec[k] !== false) || (rec.moves && rec.moves.length)));

function cleanFreeRecord(value) {
  const pokemonId = value && parseInt(value.pokemonId, 10);
  if (!pokemonId || pokemonId < 1) return null;
  return { pokemonId, ...cleanRecord(value, pokemonId) };
}

function cleanFreeBoxes(raw) {
  if (!Array.isArray(raw)) return [makeFreeBox(1)];
  const seen = new Set();
  const out = [];
  raw.slice(0, MAX_FREE_BOXES).forEach((b, i) => {
    if (!b || typeof b !== 'object') return;
    let id = typeof b.id === 'string' && b.id ? b.id : newBoxId();
    if (seen.has(id)) id = newBoxId();
    seen.add(id);
    const name = String(b.name || '').trim().slice(0, FREE_BOX_NAME_MAX) || `Box ${i + 1}`;
    const slots = {};
    Object.entries(b.slots || {}).forEach(([k, v]) => {
      const n = parseInt(k, 10);
      const rec = n >= 0 && n < BOX_SIZE ? cleanFreeRecord(v) : null;
      if (rec) slots[n] = rec;
    });
    out.push({ id, name, slots });
  });
  return out.length ? out : [makeFreeBox(1)];
}

const freeCount = (box) => Object.keys(box.slots).length;

// The Pokédex slot a stored Pokémon counts for: species and regional forms have their own,
// other forms (Wash Rotom, Origin Giratina...) count for their species.
const LIVE_FORM_DEX = new Map();   // forms found by the live PokeAPI check -> their species
function dexSlotFor(pokemonId) {
  if (pokemonId <= 10000) return pokemonId;
  if (REGIONAL.some((f) => f.id === pokemonId)) return pokemonId;
  const other = OTHER_FORMS.find((f) => f.id === pokemonId);
  if (other) return other.dex;
  return LIVE_FORM_DEX.get(pokemonId) || null;
}

// Everything in a free box is also registered in the Pokédex (removing it later doesn't unregister it)
function registerFreeInDex(caught, freeBoxes) {
  const added = [];
  freeBoxes.forEach((b) => Object.values(b.slots).forEach((r) => {
    const id = dexSlotFor(r.pokemonId);
    if (id && !caught[id]) {
      caught[id] = { caughtAt: r.caughtAt || Date.now() };
      if (id === r.pokemonId && r.form) caught[id].form = r.form;       // Unown B registers as Unown B
      added.push(id);
    }
  }));
  return added;
}

// Accepts anything that came out of localStorage or a pasted backup (v1 or v2), returns a valid v2 state.
function migrateState(raw) {
  const base = createDefaultState();
  if (!raw || typeof raw !== 'object') return base;
  const caught = {};
  if (Array.isArray(raw.caught)) {
    raw.caught.forEach((id) => { if (/^\d+$/.test(String(id))) caught[id] = cleanRecord(null); });
  } else if (raw.caught && typeof raw.caught === 'object') {
    for (const [id, value] of Object.entries(raw.caught)) {
      if (/^\d+$/.test(id) && value) caught[id] = cleanRecord(value, parseInt(id, 10));
    }
  } else {
    Object.assign(caught, base.caught);
  }
  const guardian = { ...base.guardian, ...(raw.guardian || {}) };
  guardian.level = clampLevel(guardian.level);
  guardian.nickname = String(guardian.nickname || base.guardian.nickname).slice(0, NICKNAME_MAX);
  if (!Array.isArray(guardian.types)) guardian.types = [];
  // v1 -> v2: the guardian's own slot picks up its nickname once
  if ((raw.schemaVersion || 1) < 2) {
    const own = caught[guardian.pokemonId];
    if (own && !own.nickname) own.nickname = guardian.nickname;
  }
  const freeBoxes = cleanFreeBoxes(raw.freeBoxes);    // v1/v2 saves have none: start with one empty box
  registerFreeInDex(caught, freeBoxes);
  const megaStones = {};
  Object.entries(raw.megaStones || {}).forEach(([k, v]) => { if (v === true && /^[a-z0-9]{2,40}$/.test(k)) megaStones[k] = true; });
  const superdex = {};
  Object.entries(raw.superdex || {}).forEach(([k, v]) => { if (typeof v === 'number' && /^[a-z0-9:-]{1,60}$/.test(k)) superdex[k] = v; });
  const milestones = {};
  Object.entries(raw.milestones || {}).forEach(([k, v]) => { if (typeof v === 'number' && /^[a-z0-9:-]{1,60}$/.test(k)) milestones[k] = v; });
  const ui = { ...base.ui, ...(raw.ui || {}) };
  if (ui.clickMode !== 'quick') ui.clickMode = 'register';
  ui.layout = cleanLayout(ui.layout);
  if (!SPRITE_STYLES.some((x) => x.key === ui.spriteStyle)) ui.spriteStyle = 'box';
  if (!freeBoxes.some((b) => b.id === ui.freeBox)) ui.freeBox = freeBoxes[0].id;
  return {
    schemaVersion: SCHEMA_VERSION,
    guardian,
    caught,
    freeBoxes,
    megaStones,
    superdex,
    milestones,
    ui,
    updatedAt: typeof raw.updatedAt === 'number' ? raw.updatedAt : Date.now(),
  };
}

function cleanLayout(l) {
  const v = l && typeof l === 'object' ? l : {};
  const shape = BOX_SHAPES.find(([c, r]) => c === v.cols && r === v.rows) || [6, 5];
  return { mode: v.mode === 'custom' ? 'custom' : 'home', order: v.order === 'national' ? 'national' : 'grouped', cols: shape[0], rows: shape[1], genBreaks: v.genBreaks !== false };
}

// Every account keeps its own save on this device; the offline (guest) save stays at STORAGE_KEY.
const GUEST_KEY = STORAGE_KEY;
const accountStorageKey = (accountKey) => `livingFormDex:acct:${accountKey}`;

function loadState(key = GUEST_KEY) {
  const raw = safeStorage.get(key);
  if (!raw) return createDefaultState();
  try { return migrateState(JSON.parse(raw)); } catch { return createDefaultState(); }
}

// One save per storage key. Changing the key (switching account) loads that account's save,
// so one account's progress never shows up under another.
function usePersistentState(key) {
  const [slot, setSlot] = useState(() => ({ key, state: loadState(key) }));
  const [storageOk, setStorageOk] = useState(true);
  const fromOtherTab = useRef(false);

  let current = slot;
  if (slot.key !== key) {
    current = { key, state: loadState(key) };
    setSlot(current);
  }

  useEffect(() => {
    if (fromOtherTab.current) { fromOtherTab.current = false; return; }
    setStorageOk(safeStorage.set(slot.key, JSON.stringify(slot.state)));
  }, [slot]);

  // Keep two open tabs on the same account in step.
  useEffect(() => {
    const onStorage = (e) => {
      if (e.key !== key || !e.newValue) return;
      try { fromOtherTab.current = true; setSlot({ key, state: migrateState(JSON.parse(e.newValue)) }); } catch { fromOtherTab.current = false; }
    };
    window.addEventListener('storage', onStorage);
    return () => window.removeEventListener('storage', onStorage);
  }, [key]);

  // touch=false for per-device view changes (current box, click mode) so they never count as progress to sync
  const update = useCallback((fn, touch = true) => setSlot((sl) => {
    const next = fn(sl.state);
    return { key: sl.key, state: touch ? { ...next, updatedAt: Date.now() } : next };
  }), []);
  // Cloud sync: take a save exactly as it is, but only into the save it was meant for
  const replace = useCallback((next, forKey) => setSlot((sl) => (forKey && sl.key !== forKey ? sl : { key: sl.key, state: next })), []);
  return [current.state, update, storageOk, replace, current.key];
}

/* ---------------------------------------------------------------------
   5. POKEAPI CLIENT (live first, offline pack as fallback)
   --------------------------------------------------------------------- */
class ApiError extends Error {
  constructor(kind, message, status) { super(message); this.kind = kind; this.status = status; }
}
const apiHealth = { offlineUntil: 0 };
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

async function fetchJSON(url, { timeout = 12000, retries = 1 } = {}) {
  for (let attempt = 0; ; attempt++) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), timeout);
    try {
      const res = await fetch(url, { signal: ctrl.signal });
      if (res.status === 404) throw new ApiError('not_found', 'Not found', 404);
      if (!res.ok) throw new ApiError('http', `PokeAPI answered ${res.status}`, res.status);
      return await res.json();
    } catch (err) {
      const e = err instanceof ApiError ? err
        : err && err.name === 'AbortError' ? new ApiError('timeout', 'PokeAPI took too long to answer')
        : new ApiError('network', 'Could not reach PokeAPI');
      const retryable = e.kind === 'timeout' || e.kind === 'network' || (e.kind === 'http' && e.status >= 500);
      if (!retryable || attempt >= retries) throw e;
      await sleep(400 * (attempt + 1));
    } finally {
      clearTimeout(timer);
    }
  }
}

let packPromise = null;
function loadPack() {
  if (!packPromise) {
    packPromise = fetch(PACK_DIR + 'dex.json')
      .then((r) => (r.ok ? r.json() : null))
      .catch(() => null)
      .then((p) => { if (!p) packPromise = null; return p; });
  }
  return packPromise;
}

function pickVersionGroup(keys) {
  const order = (k) => (VERSION_GROUPS.has(k) ? VERSION_GROUPS.get(k).order : 999); // unknown = newer than this file
  const sorted = [...keys].sort((a, b) => order(b) - order(a));
  return sorted.find((k) => !SKIP_MOVE_SOURCES.has(k)) || sorted[0] || null;
}

const METHOD_ORDER = { 'level-up': 0, machine: 1, egg: 2, tutor: 3 };
function sortMoves(moves) {
  const seen = new Set();
  return moves
    .filter((m) => { const k = `${m.key}|${m.method}|${m.level}`; if (seen.has(k)) return false; seen.add(k); return true; })
    .sort((a, b) => (METHOD_ORDER[a.method] ?? 9) - (METHOD_ORDER[b.method] ?? 9)
      || (a.method === 'level-up' ? a.level - b.level : 0) || a.name.localeCompare(b.name));
}

function statsFromList(list) {
  const s = { hp: 0, attack: 0, defense: 0, spAtk: 0, spDef: 0, speed: 0 };
  const map = { hp: 'hp', attack: 'attack', defense: 'defense', 'special-attack': 'spAtk', 'special-defense': 'spDef', speed: 'speed' };
  list.forEach(([name, v]) => { if (map[name]) s[map[name]] = v; });
  return s;
}

function displayNameFor(id, fallback) {
  const base = BASE_SPECIES[id - 1];
  if (base) return base.name;
  const form = REGIONAL.find((f) => f.id === id) || OTHER_FORMS.find((f) => f.id === id) || MEGAS.find((f) => f.id === id);
  return form ? form.name : fallback;
}

function originFor(id, gen) {
  const form = REGIONAL.find((f) => f.id === id);
  if (form) return REGION_LABEL[form.region];
  return (GENERATIONS.find((g) => g.gen === gen) || FUTURE_GEN).region;
}

// Live /pokemon + /pokemon-species JSON -> one shape the UI understands
function fromLive(p, sp) {
  const speciesId = sp ? sp.id : idFromUrl(p.species.url);
  const gen = sp && sp.generation ? idFromUrl(sp.generation.url) : 0;
  const englishName = sp && sp.names ? (sp.names.find((n) => n.language.name === 'en') || {}).name : null;
  const vgSet = new Set();
  p.moves.forEach((m) => m.version_group_details.forEach((d) => vgSet.add(d.version_group.name)));
  const vg = pickVersionGroup(vgSet);
  const moves = [];
  p.moves.forEach((m) => m.version_group_details
    .filter((d) => d.version_group.name === vg)
    .forEach((d) => {
      const known = MOVE_BY_SLUG.get(m.move.name) || {};
      moves.push({ key: m.move.name, name: moveName(m.move.name), type: known.type, cls: known.cls, power: known.power,
        method: d.move_learn_method.name, level: d.level_learned_at });
    }));
  const games = new Set(vgSet);
  (p.game_indices || []).forEach((g) => { const k = D.versionToGroup[g.version.name]; if (k) games.add(k); });
  const other = (p.sprites && p.sprites.other) || {};
  const bw = (((p.sprites || {}).versions || {})['generation-v'] || {})['black-white'] || {};
  return {
    id: p.id, speciesId, dex: speciesId, slug: p.name,
    name: displayNameFor(p.id, p.is_default && englishName ? englishName : prettify(p.name)),
    genus: sp && sp.genera ? (sp.genera.find((g) => g.language.name === 'en') || {}).genus || '' : '',
    gen, origin: originFor(p.id, gen),
    types: [...p.types].sort((a, b) => a.slot - b.slot).map((t) => t.type.name),
    stats: statsFromList(p.stats.map((s) => [s.stat.name, s.base_stat])),
    abilities: [...p.abilities].sort((a, b) => a.slot - b.slot).map((a) => ({ name: abilityName(a.ability.name), hidden: a.is_hidden })),
    height: p.height, weight: p.weight,
    sprites: {
      static: p.sprites.front_default,
      artwork: (other['official-artwork'] || {}).front_default || null,
      animated: (other.showdown || {}).front_default || (bw.animated || {}).front_default || null,
    },
    moves: sortMoves(moves), movesFrom: vg,
    allMoves: p.moves.map((m) => m.move.name),   // every move it learns in any game
    games: [...games], source: 'live',
  };
}

// Offline pack entry -> same shape as fromLive
function fromPack(pack, id) {
  const e = pack.p[id];
  const [hp, attack, defense, spAtk, spDef, speed] = e.st;
  const cls = ['', 'status', 'physical', 'special'];
  return {
    id, speciesId: e.s, dex: e.s, slug: e.k, name: e.n, genus: e.g, gen: e.gen, origin: originFor(id, e.gen),
    types: e.t.map((t) => pack.types[t]),
    stats: { hp, attack, defense, spAtk, spDef, speed },
    abilities: e.ab.map(([aid, hidden]) => ({ name: (pack.abilities[aid] || [])[1] || '?', hidden: !!hidden })),
    height: e.h, weight: e.w,
    sprites: { static: null, artwork: null, animated: null },
    moves: sortMoves(e.mv.map(([mid, meth, level]) => {
      const m = pack.moves[mid] || [];
      return { key: m[0], name: m[1], type: pack.types[m[2]], cls: cls[m[3]], power: m[4], method: pack.methods[meth], level };
    })),
    movesFrom: e.vg, games: e.gm, source: 'pack',
    allMoves: [...e.mv.map(([mid]) => mid), ...(e.mx || [])].map((mid) => (pack.moves[mid] || [])[0]).filter(Boolean),
  };
}

async function fetchLive(key) {
  let poke;
  try {
    poke = await fetchJSON(`${API}/pokemon/${key}`);
  } catch (e) {
    if (e.kind !== 'not_found') throw e;
    // Names like "deoxys" or "urshifu" only exist as species; follow the default variety.
    const sp = await fetchJSON(`${API}/pokemon-species/${key}`);
    const variety = sp.varieties.find((v) => v.is_default) || sp.varieties[0];
    poke = await fetchJSON(variety.pokemon.url);
  }
  let species = null;
  try { species = await fetchJSON(poke.species.url, { retries: 0 }); } catch { /* species extras are optional */ }
  return fromLive(poke, species);
}

const pokemonCache = new Map();
// query: number (PokeAPI id) or free text. Resolves to the normalized Pokémon object.
function fetchPokemon(query) {
  const id = typeof query === 'number' ? query : /^\d+$/.test(String(query)) ? parseInt(query, 10) : null;
  const slug = id ? String(id) : searchKey(query) && String(query).trim().toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/♀/g, '-f').replace(/♂/g, '-m')
    .replace(/[.'’:]/g, '').replace(/[\s_]+/g, '-');
  if (!slug) return Promise.reject(new ApiError('not_found', 'Empty search'));
  if (pokemonCache.has(slug)) return pokemonCache.get(slug);

  const job = (async () => {
    let liveError = null;
    if (Date.now() >= apiHealth.offlineUntil) {
      try { return await fetchLive(slug); } catch (e) {
        liveError = e;
        if (e.kind === 'not_found' && !id) throw e;
        if (e.kind === 'network' || e.kind === 'timeout') apiHealth.offlineUntil = Date.now() + 2 * 60 * 1000;
      }
    }
    const pack = await loadPack();
    if (pack && id && pack.p[id]) return fromPack(pack, id);
    if (liveError && liveError.kind === 'not_found') throw liveError;
    throw new ApiError(liveError ? liveError.kind : 'network',
      pack ? 'This Pokémon is not in the offline pack and PokeAPI is unreachable.' : 'Could not reach PokeAPI.');
  })();
  pokemonCache.set(slug, job);
  job.catch(() => pokemonCache.delete(slug));
  return job;
}

// Which data source is answering? Also learns the live species count, so Gen 10 appears on its own.
function useDexSource() {
  const [source, setSource] = useState({ status: 'checking', count: BASE_SPECIES.length });
  const check = useCallback(async () => {
    setSource((s) => ({ ...s, status: 'checking' }));
    try {
      const data = await fetchJSON(`${API}/pokemon-species?limit=1`, { timeout: 8000, retries: 0 });
      apiHealth.offlineUntil = 0;
      setSource({ status: 'live', count: data.count });
    } catch {
      apiHealth.offlineUntil = Date.now() + 2 * 60 * 1000;
      const pack = await loadPack();
      setSource({ status: pack ? 'pack' : 'offline', count: BASE_SPECIES.length });
    }
  }, []);
  useEffect(() => { check(); }, [check]);
  return [source, check];
}

function useSpeciesList(source) {
  const [extras, setExtras] = useState(() => {
    try { const c = JSON.parse(safeStorage.get(EXTRA_SPECIES_KEY) || 'null'); return Array.isArray(c && c.names) ? c.names : []; }
    catch { return []; }
  });
  useEffect(() => {
    const known = BASE_SPECIES.length + extras.length;
    if (source.status !== 'live' || source.count <= known) return;
    let cancelled = false;
    fetchJSON(`${API}/pokemon-species?offset=${BASE_SPECIES.length}&limit=${source.count - BASE_SPECIES.length}`)
      .then((data) => {
        if (cancelled) return;
        const names = data.results.map((r) => prettify(r.name));
        setExtras(names);
        safeStorage.set(EXTRA_SPECIES_KEY, JSON.stringify({ names, at: Date.now() }));
      })
      .catch(() => {});
    return () => { cancelled = true; };
  }, [source.status, source.count]); // eslint-disable-line react-hooks/exhaustive-deps

  return useMemo(() => [
    ...BASE_SPECIES,
    ...extras.map((name, i) => {
      const id = BASE_SPECIES.length + i + 1;
      return { id, dex: id, name, sk: searchKey(name), kind: 'species', future: true };
    }),
  ], [extras]);
}

/* ---------------------------------------------------------------------
   6. SPRITES (live GitHub sprites, else the offline atlas, else a Poké Ball)
   --------------------------------------------------------------------- */
const SpriteContext = createContext('probing');

function useSpriteMode() {
  const [mode, setMode] = useState('probing');
  useEffect(() => {
    let settled = false;
    const finish = (m) => { if (!settled) { settled = true; setMode(m); } };
    const tryAtlas = () => {
      const a = new Image();
      a.onload = () => finish('atlas');
      a.onerror = () => finish('none');
      a.src = PACK_DIR + 'sprites.webp';
    };
    const probe = new Image();
    const timer = setTimeout(tryAtlas, 6000);
    probe.onload = () => { clearTimeout(timer); finish('live'); };
    probe.onerror = () => { clearTimeout(timer); tryAtlas(); };
    probe.src = `${SPRITES}/25.png`;
    return () => clearTimeout(timer);
  }, []);
  return mode;
}

function PokeballGlyph({ className = '' }) {
  return (
    <svg viewBox="0 0 24 24" className={className} aria-hidden="true" style={{ width: '62%', height: '62%', margin: 'auto' }}>
      <circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" strokeWidth="1.6" />
      <path d="M2 12h7m6 0h7" stroke="currentColor" strokeWidth="1.6" />
      <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" strokeWidth="1.6" />
    </svg>
  );
}

// Sprite styles (Display settings): optional packs, loaded the first time a style is picked
const SpriteStyleContext = createContext({ style: 'box', ready: {} });
const STYLE_PACKS = { home: 'home.webp', gen3: 'gen3.webp' };
const GEN3_COLS = 20;
// One load per pack for the whole page: switching style mid-download never cancels it, and an error retries next time.
const packStore = { state: {}, listeners: new Set() };
function loadStylePack(style) {
  const file = STYLE_PACKS[style];
  const st = packStore.state[style];
  if (!file || st === 'ok' || st === 'loading') return;
  const set = (v) => { packStore.state = { ...packStore.state, [style]: v }; packStore.listeners.forEach((f) => f()); };
  set('loading');
  const img = new Image();
  img.onload = () => set('ok');
  img.onerror = () => set('error');
  img.src = `${PACK_DIR}${file}${st === 'error' ? `?retry=${Date.now()}` : ''}`;
}
function useStylePacks(style) {
  const [ready, setReady] = useState(packStore.state);
  useEffect(() => {
    const f = () => setReady(packStore.state);
    packStore.listeners.add(f);
    f();
    return () => { packStore.listeners.delete(f); };
  }, []);
  useEffect(() => { loadStylePack(style); }, [style]);
  return ready;
}

// Black & White animated sprites: one JSON file per generation ({ dex: base64 GIF }), fetched on first use
const BW_FILES = [[1, 151], [152, 251], [252, 386], [387, 493], [494, 649]];
const bwStore = { urls: new Map(), files: new Map(), failed: false, listeners: new Set() };
const bwNotify = () => bwStore.listeners.forEach((f) => f());
function bwRequest(dex) {
  if (bwStore.urls.has(dex) || bwStore.failed) return;
  const n = BW_FILES.findIndex(([lo, hi]) => dex >= lo && dex <= hi);
  if (n === -1 || bwStore.files.has(n)) return;
  bwStore.files.set(n, fetch(`${PACK_DIR}bw${n + 1}.json`)
    .then((r) => (r.ok ? r.json() : Promise.reject(new Error(`bw${n + 1}.json`))))
    .then((map) => { Object.entries(map).forEach(([id, b64]) => bwStore.urls.set(+id, `data:image/gif;base64,${b64}`)); bwNotify(); })
    .catch(() => { bwStore.failed = true; bwNotify(); }));
}
function useBwUrl(dex, on) {
  const [, force] = useState(0);
  useEffect(() => {
    if (!on) return undefined;
    const f = () => force((n) => n + 1);
    bwStore.listeners.add(f);
    bwRequest(dex);
    return () => { bwStore.listeners.delete(f); };
  }, [dex, on]);
  return on ? bwStore.urls.get(dex) || null : null;
}

const STYLE_URL = {
  home: (key, shiny) => {
    const sh = shiny ? 'shiny/' : '';
    if (typeof key === 'number') return `${SPRITES}/other/home/${sh}${key}.png`;
    if (key.startsWith('f')) return `${SPRITES}/other/home/${sh}female/${key.slice(1)}.png`;
    return `${SPRITES}/other/home/${key.slice(2)}.png`;
  },
  gen3: (key, shiny) => `${SPRITES}/versions/generation-iii/emerald/${shiny ? 'shiny/' : ''}${key}.png`,
  gen5: (key, shiny) => `${SPRITES}/versions/generation-v/black-white/animated/${shiny ? 'shiny/' : ''}${key}.gif`,
};
const cellUrl = (key, shiny) => {
  const sh = shiny ? 'shiny/' : '';
  if (typeof key === 'number') return `${SPRITES}/${sh}${key}.png`;
  if (key.startsWith('f')) return `${SPRITES}/${sh}female/${key.slice(1)}.png`;
  return `${SPRITES}/${sh}${key.slice(2)}.png`;
};
function atlasStyle(file, idx, cols, rows) {
  const col = idx % cols;
  const row = Math.floor(idx / cols);
  return {
    backgroundImage: `url(${PACK_DIR}${file})`,
    backgroundSize: `${cols * 100}% ${rows * 100}%`,
    backgroundPosition: `${(col / (cols - 1)) * 100}% ${(row / (rows - 1)) * 100}%`,
  };
}

// Fills its container (square). Pass size for a fixed pixel box.
// female / form / gmax pick the matching sprite; cell names an atlas cell directly (Superdex).
function Sprite({ id, size, className = '', alt = '', female = false, form = null, gmax = false, shiny = false, cell = null }) {
  const mode = useContext(SpriteContext);
  const { style, ready } = useContext(SpriteStyleContext);
  const key = cell != null ? cell : spriteCell(id, { female, form, gmax });
  const [failed, setFailed] = useState(0);         // box sprites: 1 = this sprite failed live, 2 = its fallback failed too
  const [styleFailed, setStyleFailed] = useState(false);   // the chosen style's online sprite failed: use the pack or box sprites
  const [bwSize, setBwSize] = useState(null);
  useEffect(() => { setFailed(0); setStyleFailed(false); setBwSize(null); }, [key, style, shiny]);
  const box = size ? { width: size, height: size } : { width: '100%', aspectRatio: '1 / 1' };
  const a11y = { role: alt ? 'img' : undefined, 'aria-label': alt || undefined, 'aria-hidden': alt ? undefined : 'true' };
  const plain = typeof key === 'number' && key <= 1025;            // a species' standard look
  const online = mode === 'live' && !styleFailed;
  const bwFits = style === 'gen5' && plain && key <= 649;
  const bwUrl = useBwUrl(key, bwFits && !online);                  // offline: the bundled animations
  if (mode === 'probing') return <span className="skeleton block" style={box} aria-hidden="true" />;

  // Gen 5 animated: online straight from PokeAPI's sprites, otherwise from the pack
  if (bwFits && (online || bwUrl)) {
    return (
      <span {...a11y} className={`sprite relative block ${className}`} style={box}>
        <img src={online ? STYLE_URL.gen5(key, shiny) : bwUrl} alt="" onError={() => setStyleFailed(true)}
          onLoad={(e) => setBwSize([e.currentTarget.naturalWidth, e.currentTarget.naturalHeight])}
          style={{ position: 'absolute', left: '50%', bottom: '6%', transform: 'translateX(-50%)', width: bwSize ? `${(bwSize[0] / 96) * 100}%` : '60%', imageRendering: 'pixelated' }} />
      </span>
    );
  }
  // HOME renders: the bundled sheet once it has loaded, online renders before that (or if the pack is missing)
  if (style === 'home') {
    const idx = ATLAS_INDEX.get(key);
    if (ready.home === 'ok' && idx != null) return <span {...a11y} className={`sprite sprite-smooth block ${className}`} style={{ ...box, ...atlasStyle('home.webp', idx, ATLAS_COLS, ATLAS_ROWS) }} />;
    if (online) return <img src={STYLE_URL.home(key, shiny)} alt={alt} loading="lazy" decoding="async" onError={() => setStyleFailed(true)} className={`sprite sprite-smooth ${className}`} style={{ ...box, objectFit: 'contain' }} />;
  }
  // Gen 3 (Emerald): #1-386
  if (style === 'gen3' && plain && key <= 386) {
    if (ready.gen3 === 'ok') return <span {...a11y} className={`sprite block ${className}`} style={{ ...box, ...atlasStyle('gen3.webp', key - 1, GEN3_COLS, Math.ceil(386 / GEN3_COLS)) }} />;
    if (online) return <img src={STYLE_URL.gen3(key, shiny)} alt={alt} loading="lazy" decoding="async" onError={() => setStyleFailed(true)} className={`sprite ${className}`} style={{ ...box, objectFit: 'contain' }} />;
  }
  if (mode === 'live' && failed < 2) {
    const k = failed === 1 ? id : key;
    return <img src={cellUrl(k, shiny && failed === 0)} alt={alt} loading="lazy" decoding="async" onError={() => setFailed((f) => f + 1)}
      className={`sprite ${className}`} style={{ ...box, objectFit: 'contain' }} />;
  }
  const idx = ATLAS_INDEX.has(key) ? ATLAS_INDEX.get(key) : ATLAS_INDEX.get(id);
  if (mode === 'atlas' && idx != null) {
    return <span {...a11y} className={`sprite block ${className}`} style={{ ...box, ...atlasStyle('sprites.webp', idx, ATLAS_COLS, ATLAS_ROWS) }} />;
  }
  return <span className={`grid text-vault-faint ${className}`} style={box} role={alt ? 'img' : undefined} aria-label={alt || undefined}><PokeballGlyph /></span>;
}

/* ---------------------------------------------------------------------
   7. NATURE RECOMMENDER
   Rule: raise the best useful stat, lower the attacking stat it won't use.
   Mixed attackers drop a defense instead; walls pair Def/Sp. Def;
   very slow attackers get a Trick Room option.
   --------------------------------------------------------------------- */
const STAT_LABEL = { hp: 'HP', attack: 'Attack', defense: 'Defense', spAtk: 'Sp. Atk', spDef: 'Sp. Def', speed: 'Speed' };
const STAT_SHORT = { hp: 'HP', attack: 'Atk', defense: 'Def', spAtk: 'SpA', spDef: 'SpD', speed: 'Spe' };
const NATURE_TABLE = {
  attack:  { defense: 'Lonely', speed: 'Brave',   spAtk: 'Adamant', spDef: 'Naughty' },
  defense: { attack: 'Bold',    speed: 'Relaxed', spAtk: 'Impish',  spDef: 'Lax' },
  speed:   { attack: 'Timid',   defense: 'Hasty', spAtk: 'Jolly',   spDef: 'Naive' },
  spAtk:   { attack: 'Modest',  defense: 'Mild',  speed: 'Quiet',   spDef: 'Rash' },
  spDef:   { attack: 'Calm',    defense: 'Gentle', speed: 'Sassy',  spAtk: 'Careful' },
};
const TIE_PRIORITY = { speed: 0, attack: 1, spAtk: 1, defense: 2, spDef: 2 };

function recommendNatures(stats) {
  const s = stats;
  const make = (plus, minus, reason) => ({ name: NATURE_TABLE[plus][minus], plus, minus, reason });
  const mixed = Math.abs(s.attack - s.spAtk) <= 10 && Math.min(s.attack, s.spAtk) >= 80;

  if (mixed) {
    const plus = ['speed', 'attack', 'spAtk'].sort((a, b) => s[b] - s[a] || TIE_PRIORITY[a] - TIE_PRIORITY[b])[0];
    const [weak, other] = s.defense <= s.spDef ? ['defense', 'spDef'] : ['spDef', 'defense'];
    const why = `Attack (${s.attack}) and Sp. Atk (${s.spAtk}) are both usable, so keep both and trade away a defense.`;
    return [
      make(plus, weak, `${why} ${STAT_LABEL[weak]} (${s[weak]}) is the weaker one.`),
      make(plus, other, `Same mixed plan, keeping ${STAT_LABEL[weak]} instead if you expect ${weak === 'defense' ? 'physical' : 'special'} hits.`),
    ];
  }

  const dump = s.attack < s.spAtk ? 'attack' : s.spAtk < s.attack ? 'spAtk' : 'attack';
  const ranked = ['attack', 'defense', 'spAtk', 'spDef', 'speed']
    .filter((k) => k !== dump)
    .sort((a, b) => s[b] - s[a] || TIE_PRIORITY[a] - TIE_PRIORITY[b]);
  const dumpWhy = `${STAT_LABEL[dump]} (${s[dump]}) goes unused`;
  const first = make(ranked[0], dump, `Raises ${STAT_LABEL[ranked[0]]} (${s[ranked[0]]}), its best stat. ${dumpWhy}.`);

  // A true wall (best stat is a defense, no attacking stat reaching 100) pairs Def and Sp. Def.
  const isWall = (ranked[0] === 'defense' || ranked[0] === 'spDef') && Math.max(s.attack, s.spAtk) < 100;
  if (isWall) {
    const other = ranked[0] === 'defense' ? 'spDef' : 'defense';
    return [first, make(other, dump, `Wall set for the other side: raises ${STAT_LABEL[other]} (${s[other]}). ${dumpWhy}.`)];
  }
  if (s.speed <= 50 && ranked[0] !== 'speed') {
    return [first, make(ranked[0], 'speed', `Trick Room option: Speed (${s.speed}) is low, so make it lower and hit harder.`)];
  }
  return [first, make(ranked[1], dump, `Raises ${STAT_LABEL[ranked[1]]} (${s[ranked[1]]}), its next best stat. ${dumpWhy}.`)];
}

function textOn(hex) {
  const n = parseInt(hex.slice(1), 16);
  const [r, g, b] = [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  return (0.299 * r + 0.587 * g + 0.114 * b) > 150 ? 'var(--on-light)' : '#ffffff';
}

function TypeChip({ type, small = false }) {
  const bg = TYPE_COLORS[type] || '#64748b';
  return (
    <span className={`inline-flex items-center rounded-md font-display font-semibold uppercase tracking-wider ${small ? 'px-1.5 py-0.5 text-[10px]' : 'px-2.5 py-1 text-xs'}`}
      style={{ background: bg, color: textOn(bg) }}>
      {type}
    </span>
  );
}

function SourcePill({ status, onRetry }) {

  return (

  );
}

   --------------------------------------------------------------------- */
function GuardianSprite({ guardian }) {
  const mode = useContext(SpriteContext);
  const { style } = useContext(SpriteStyleContext);
  const [failed, setFailed] = useState(false);
  useEffect(() => setFailed(false), [guardian.sprite, guardian.pokemonId]);
  const alt = `${guardian.nickname} the ${guardian.species}`;
  const imgStyle = { height: 150, width: 'auto', maxWidth: '100%', imageRendering: 'pixelated', position: 'relative', zIndex: 1 };
  if (mode === 'probing') return <span className="skeleton block" style={{ width: 130, height: 130 }} />;
  if (style !== 'box') return <div className="relative z-[1]" style={{ width: 150 }}><Sprite id={guardian.pokemonId} alt={alt} /></div>;
  if (mode === 'live' && guardian.sprite && !failed) {
    return <img src={guardian.sprite} alt={alt} onError={() => setFailed(true)} style={imgStyle} />;
  }
  if (mode === 'atlas' && guardian.pokemonId === 6) {
    return <img src={`${PACK_DIR}guardian-6.gif`} alt={alt} style={imgStyle} />;
  }
  return <div className="relative z-[1]" style={{ width: 150 }}><Sprite id={guardian.pokemonId} alt={alt} /></div>;
}

function CompletionRing({ pct }) {
  const r = 54;
  const c = 2 * Math.PI * r;
  const [shown, setShown] = useState(0);
  useEffect(() => { const t = requestAnimationFrame(() => setShown(pct)); return () => cancelAnimationFrame(t); }, [pct]);
  return (
    <svg viewBox="0 0 132 132" className="h-32 w-32 shrink-0" role="img" aria-label={`${pct.toFixed(1)} percent of the National Dex caught`}>
      <circle cx="66" cy="66" r={r} fill="none" stroke="var(--panel-2)" strokeWidth="11" />
      <circle cx="66" cy="66" r={r} fill="none" stroke="var(--ember)" strokeWidth="11" strokeLinecap="round"
        strokeDasharray={c} strokeDashoffset={c * (1 - shown / 100)} transform="rotate(-90 66 66)" className="ring-progress" />
      <text x="66" y="64" textAnchor="middle" fill="var(--fg)" style={{ font: '700 26px var(--font-display)' }}>
        {pct >= 99.95 && pct < 100 ? '99.9' : pct.toFixed(1)}
      </text>
      <text x="66" y="84" textAnchor="middle" fill="var(--muted)" style={{ font: '600 10px var(--font-display)', letterSpacing: '0.14em' }}>PERCENT</text>
    </svg>
  );
}

function GuardianHero({ guardian, onSave, stats, index }) {
  const [editing, setEditing] = useState(false);
  const [draft, setDraft] = useState(guardian);
  const [saving, setSaving] = useState(false);
  const [error, setError] = useState('');
  const suggestions = useMemo(() => index.all, [index]);

  useEffect(() => { if (!editing) setDraft(guardian); }, [guardian, editing]);

  async function save(e) {
    e.preventDefault();
    const nickname = String(draft.nickname).trim().slice(0, NICKNAME_MAX) || guardian.nickname;
    const level = clampLevel(draft.level);
    const typed = String(draft.species).trim();
    setError('');
    if (!typed || searchKey(typed) === searchKey(guardian.species)) {
      onSave({ ...guardian, nickname, level });
      setEditing(false);
      return;
    }
    const entry = resolveQuery(typed, index);
    setSaving(true);
    try {
      const p = await fetchPokemon(entry ? entry.id : typed);
      onSave({
        nickname, level, pokemonId: p.id, species: p.name, types: p.types, origin: p.origin,
        sprite: p.sprites.animated || p.sprites.static || null,
      });
      setEditing(false);
    } catch (err) {
      setError(err.kind === 'not_found'
        ? `No Pokémon called “${typed}”. Check the spelling or enter a Dex number.`
        : `Couldn't load ${typed}: ${err.message} Your guardian wasn't changed.`);
    } finally {
      setSaving(false);
    }
  }

  return (
    <section className="panel relative min-w-0 overflow-hidden" aria-labelledby="guardian-title">
      <div className="grid gap-6 p-5 sm:p-7 lg:grid-cols-[minmax(0,1fr)_auto] lg:items-center">
